<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard Direktur</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#eef2f7;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.title{
  font-size:22px;
  font-weight:bold;
}

.time{
  text-align:right;
  font-size:14px;
}

/* STATUS */
.status{
  margin:10px;
  padding:15px;
  border-radius:12px;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.status.normal{background:linear-gradient(45deg,#16a085,#2980b9);}
.status.warning{background:orange;}
.status.danger{background:red;}

/* KPI */
.kpi{
  display:flex;
  gap:10px;
  margin:10px;
}

.kpi-card{
  flex:1;
  background:white;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

.kpi-card h1{
  margin:5px 0;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:10px;
}

/* CARD */
.card{
  background:white;
  padding:10px;
  border-radius:12px;
}

/* ACTIVITY */
#activityBox{
  margin:10px;
  height:140px;
  overflow:auto;
}

/* BAR */
.bar{
  height:8px;
  background:#ddd;
  border-radius:5px;
  margin:5px 0;
}

.fill{
  height:8px;
  background:#3498db;
  border-radius:5px;
}

/* MOBILE */
@media(max-width:768px){
  .kpi{flex-direction:column;}
  .grid{grid-template-columns:1fr;}
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="title">DASHBOARD DIREKTUR</div>
  <div class="time" id="time"></div>
</div>

<!-- STATUS -->
<div id="statusBox" class="status normal">
  <div>
    <b>STATUS KEHADIRAN</b><br>
    <span id="statusText">NORMAL</span>
  </div>
  <div id="statusMsg">Semua berjalan baik</div>
</div>

<!-- KPI -->
<div class="kpi">
  <div class="kpi-card">
    HADIR
    <h1 id="hadir">0</h1>
  </div>
  <div class="kpi-card">
    TIDAK HADIR
    <h1 id="tidak">0</h1>
  </div>
  <div class="kpi-card">
    TOTAL JAM
    <h1 id="jam">0</h1>
  </div>
</div>

<!-- GRID -->
<div class="grid">

  <!-- GRAFIK -->
  <div class="card">
    <b>Trend Kehadiran</b>
    <canvas id="chart"></canvas>
  </div>

  <!-- GUDANG -->
  <div class="card">
    <b>Distribusi Gudang</b>
    <div id="gudang"></div>
  </div>

</div>

<!-- ACTIVITY -->
<div class="card" id="activityBox">
  <b>Aktivitas & Alert</b>
  <div id="activity"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const URL = "https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec?mode=dashboard";

/* JAM */
function updateTime(){
  const now = new Date();
  document.getElementById("time").innerHTML =
    now.toLocaleDateString()+"<br>"+now.toLocaleTimeString();
}
setInterval(updateTime,1000);

/* FETCH DATA */
async function load(){
  const res = await fetch(URL);
  const d = await res.json();

  document.getElementById("hadir").innerText = d.totalHari;
  document.getElementById("tidak").innerText = 0;
  document.getElementById("jam").innerText = d.totalJam;

  /* STATUS */
  let status = "normal";
  let text = "NORMAL";
  let msg = "Semua berjalan baik";

  if(d.totalHari == 0){
    status="danger";
    text="KRITIS";
    msg="Tidak ada absensi hari ini";
  }

  document.getElementById("statusBox").className = "status "+status;
  document.getElementById("statusText").innerText = text;
  document.getElementById("statusMsg").innerText = msg;

  /* GUDANG */
  let g = document.getElementById("gudang");
  g.innerHTML="";
  for(let k in d.gudang){
    let val = d.gudang[k];
    g.innerHTML += `
      ${k} (${val})
      <div class="bar"><div class="fill" style="width:${val*10}%"></div></div>
    `;
  }

  /* ACTIVITY */
  let act = document.getElementById("activity");
  act.innerHTML="";

  if(d.totalHari == 0){
    act.innerHTML += "⚠ Tidak ada absensi hari ini<br>";
  }

  d.live.forEach(l=>{
    act.innerHTML += `${l.jam} - ${l.nama} (${l.gudang})<br>`;
  });

}

/* CHART */
new Chart(document.getElementById("chart"),{
  type:"line",
  data:{
    labels:["Sen","Sel","Rab","Kam","Jum","Sab","Min"],
    datasets:[{
      label:"Hadir",
      data:[0,0,0,0,0,0,0],
      borderColor:"blue"
    }]
  }
});

/* AUTO REFRESH */
setInterval(load,5000);
load();

</script>

</body>
</html>
