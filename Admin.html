<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN DASHBOARD</title>

<style>
body{
  margin:0;
  font-family:monospace;
  background:#0b0b0b;
  color:#00ff66;
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  background:#0b0b0b;
  padding:15px;
  border-bottom:1px solid #222;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title{
  font-size:18px;
  letter-spacing:1px;
}

.btn{
  background:linear-gradient(45deg, lime, #00ffcc);
  border:none;
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

/* CARD */
.card{
  background:#111;
  padding:15px;
  border-radius:15px;
  box-shadow:0 0 10px rgba(0,255,100,0.1);
  transition:0.3s;
}

.card:hover{
  transform:scale(1.02);
  box-shadow:0 0 20px rgba(0,255,100,0.3);
}

/* JAM */
#jam{
  font-size:26px;
  text-align:center;
  margin:10px 0;
}

/* TOTAL */
.total{
  font-size:28px;
  font-weight:bold;
  text-align:center;
}

/* GUDANG */
.gudangScroll{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
}

.gudangItem{
  min-width:80px;
  background:#111;
  border-radius:10px;
  padding:10px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,255,100,0.1);
}

/* LIVE */
.liveItem{
  background:#111;
  margin:8px 0;
  padding:10px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  animation:fadeIn 0.5s;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(-10px);}
  to{opacity:1; transform:translateY(0);}
}

/* STATUS COLOR */
.masuk{ color:#00ff66; }
.keluar{ color:#ff4444; }

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="title">⚡ ADMIN PANEL</div>
  <button class="btn" onclick="location.href='user.html'">+ USER</button>
</div>

<!-- JAM -->
<div id="jam">00:00:00</div>

<!-- GRID -->
<div class="grid">

  <!-- TOTAL -->
  <div class="card">
    <div>Total Absen</div>
    <div class="total" id="total">0</div>
  </div>

  <!-- TOTAL JAM -->
  <div class="card">
    <div>Total Jam</div>
    <div class="total" id="jamTotal">0</div>
  </div>

</div>

<!-- GUDANG -->
<div class="card" style="margin:10px;">
  <div>Distribusi Gudang</div>
  <div class="gudangScroll" id="gudangBox"></div>
</div>

<!-- LIVE -->
<div class="card" style="margin:10px;">
  <div>Live Aktivitas</div>
  <div id="liveBox"></div>
</div>

<script>

const URL="https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

/* JAM */
setInterval(()=>{
  let now = new Date();
  document.getElementById("jam").innerText =
    now.toLocaleTimeString('id-ID');
},1000);

/* LOAD DATA */
function loadData(){

  fetch(URL+"?mode=adminSummary")
  .then(r=>r.json())
  .then(d=>{

    document.getElementById("total").innerText = d.total || 0;
    document.getElementById("jamTotal").innerText = d.totalJam || 0;

    /* GUDANG */
    let g = "";
    d.gudang.forEach(x=>{
      g += `
      <div class="gudangItem">
        <b>${x.nama}</b><br>${x.jumlah}
      </div>`;
    });
    document.getElementById("gudangBox").innerHTML = g;

    /* LIVE */
    let l = "";
    d.live.forEach(x=>{
      let cls = x.aksi=="MASUK" ? "masuk" : "keluar";
      l += `
      <div class="liveItem">
        <div>${x.nama}</div>
        <div class="${cls}">${x.aksi}</div>
        <div>${x.jam}</div>
      </div>`;
    });
    document.getElementById("liveBox").innerHTML = l;

  });

}

setInterval(loadData,5000);
loadData();

</script>

</body>
</html>
