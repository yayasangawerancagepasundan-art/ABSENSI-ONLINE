<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASHBOARD ADMIN</title>

<style>
body{
  background:black;
  color:#00ff66;
  font-family:monospace;
  text-align:center;
}

.box{
  background:white;
  color:black;
  margin:10px;
  padding:15px;
  border-radius:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin:5px 0;
}

button{
  width:90%;
  padding:10px;
  margin:10px;
}

#list{
  text-align:left;
}
</style>
</head>

<body>

<h2>DASHBOARD ADMIN</h2>

<div class="box">
  <div class="row"><div>Total User</div><div id="totalUser">-</div></div>
  <div class="row"><div>Total Absen Hari Ini</div><div id="totalAbsen">-</div></div>
</div>

<div class="box">
  <h3>DATA ABSENSI HARI INI</h3>
  <div id="list">Loading...</div>
</div>

<button onclick="loadData()">REFRESH</button>

<script>

const URL="https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

// ambil UID kalau mau dipakai nanti
const params=new URLSearchParams(location.search);
const UID=params.get("uid")||"";

// LOAD DATA
function loadData(){

  document.getElementById("list").innerHTML="Loading...";

  fetch(`${URL}?mode=admin`)
  .then(r=>r.json())
  .then(data=>{

    if(data.status!="OK"){
      document.getElementById("list").innerHTML="ERROR";
      return;
    }

    document.getElementById("totalUser").innerText=data.totalUser;
    document.getElementById("totalAbsen").innerText=data.totalAbsen;

    let html="";

    data.data.forEach(d=>{
      html+=`
      <div class="box">
        <div><b>${d.nama}</b></div>
        <div>${d.waktu}</div>
        <div>${d.status}</div>
      </div>
      `;
    });

    document.getElementById("list").innerHTML=html || "Tidak ada data";
  });

}

// AUTO LOAD
loadData();

</script>

</body>
</html>
