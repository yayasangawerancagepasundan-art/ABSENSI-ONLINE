<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAMBAH USER</title>

<style>
body{
  font-family:monospace;
  background:black;
  color:#00ff66;
  text-align:center;
}

.container{
  max-width:400px;
  margin:auto;
}

.card{
  background:white;
  color:black;
  padding:15px;
  margin:10px;
  border-radius:10px;
}

input{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  width:90%;
  padding:12px;
  margin:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.green{ background:lime; }
.red{ background:red; color:white; }
.blue{ background:#00ccff; }
</style>
</head>

<body>

<h2>➕ TAMBAH USER</h2>

<div class="container">

  <div class="card">
    UID
    <input id="uid">
  </div>

  <div class="card">
    NAMA
    <input id="nama">
  </div>

  <div class="card">
    GUDANG
    <input id="gudang">
  </div>

  <div class="card">
    LATITUDE
    <input id="lat" readonly>
  </div>

  <div class="card">
    LONGITUDE
    <input id="lng" readonly>
  </div>

  <button class="blue" onclick="ambilGPS()">📍 AMBIL LOKASI</button>

  <button class="green" onclick="simpan()">SIMPAN</button>
  <button class="red" onclick="batal()">BATAL</button>

</div>

<script>

const URL="https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

function ambilGPS(){
  navigator.geolocation.getCurrentPosition(p=>{
    document.getElementById("lat").value = p.coords.latitude;
    document.getElementById("lng").value = p.coords.longitude;
  },()=>{
    alert("Gagal ambil GPS");
  });
}

function simpan(){

  const uid = document.getElementById("uid").value;
  const nama = document.getElementById("nama").value;
  const gudang = document.getElementById("gudang").value;
  const lat = document.getElementById("lat").value;
  const lng = document.getElementById("lng").value;

  if(!uid || !nama || !gudang || !lat || !lng){
    alert("Semua wajib diisi + GPS wajib");
    return;
  }

  fetch(`${URL}?mode=addUser&uid=${uid}&nama=${nama}&gudang=${gudang}&lat=${lat}&lng=${lng}`)
  .then(r=>r.json())
  .then(d=>{
    if(d.status=="OK"){
      alert("User berhasil ditambahkan");
      location.href="admin.html";
    }else{
      alert(d.pesan);
    }
  });

}

function batal(){
  location.href="admin.html";
}

</script>

</body>
</html>
