<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN PANEL</title>

<style>
body{
  background:#000;
  color:#00ff99;
  font-family:monospace;
  margin:0;
  padding:15px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.btn{
  background:#00ff99;
  border:none;
  padding:10px;
  border-radius:10px;
  font-weight:bold;
}

.card{
  background:#111;
  padding:15px;
  border-radius:15px;
  margin-top:15px;
}

.scroll{
  display:flex;
  overflow-x:auto;
  gap:10px;
}

.box{
  min-width:120px;
  background:#000;
  border:1px solid #00ff99;
  padding:10px;
  border-radius:10px;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}
</style>
</head>

<body>

<div class="header">
  <h2>⚡ ADMIN PANEL</h2>
  <button class="btn" onclick="toggleForm()">+ USER</button>
</div>

<div id="clock"></div>

<input placeholder="Cari nama...">

<div class="card">
  <div>Total Absen: <span id="total">0</span></div>
  <div>Total Jam: <span id="jam">0</span></div>
</div>

<div class="card">
  <h3>Distribusi Gudang</h3>
  <div class="scroll" id="gudang"></div>
</div>

<div class="card">
  <h3>Live Aktivitas</h3>
  <div id="live"></div>
</div>

<div class="card" id="form" style="display:none;">
  <h3>Tambah User</h3>
  <input id="uid" placeholder="UID">
  <input id="nama" placeholder="Nama">
  <input id="gd" placeholder="Gudang">

  <button class="btn" onclick="simpan()">SIMPAN</button>
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

// JAM
setInterval(()=>{
  document.getElementById("clock").innerText = new Date().toLocaleString();
},1000);

// DASHBOARD
function load(){
fetch(URL+"?mode=dashboard")
.then(r=>r.json())
.then(d=>{

  document.getElementById("total").innerText = d.totalHari;
  document.getElementById("jam").innerText = d.totalJam;

  let g="";
  for(let k in d.gudang){
    g+=`<div class="box">${k}<br>${d.gudang[k]}</div>`;
  }
  document.getElementById("gudang").innerHTML=g;

  let l="";
  d.live.forEach(x=>{
    l+=`${x.jam} - ${x.nama} (${x.gudang})<br>`;
  });
  document.getElementById("live").innerHTML=l;

});
}

setInterval(load,5000);
load();

// FORM
function toggleForm(){
  let f=document.getElementById("form");
  f.style.display = f.style.display=="none"?"block":"none";
}

function simpan(){
let uid=document.getElementById("uid").value;
let nama=document.getElementById("nama").value;
let gd=document.getElementById("gd").value;

fetch(`${URL}?mode=add&uid=${uid}&nama=${nama}&gudang=${gd}`)
.then(r=>r.json())
.then(d=>{
  alert("Berhasil");
});
}
</script>

</body>
</html>
