<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{background:#000;color:#fff;font-family:monospace;margin:0;padding:10px;}
.container{max-width:500px;margin:auto;}

input{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:none;}

.btn{display:flex;gap:5px;}
button{flex:1;padding:12px;border:none;border-radius:8px;font-weight:bold;}

.add{background:#0f0;}
.update{background:#ff0;}
.delete{background:#f00;color:#fff;}

table{width:100%;table-layout:fixed;border-collapse:collapse;}
th,td{padding:8px;font-size:12px;word-break:break-word;}
th{background:#111;}
tr:nth-child(even){background:#1a1a1a;}
</style>
</head>

<body>

<div class="container">

<h3>ADMIN</h3>

<input id="uid" placeholder="UID">
<input id="nama" placeholder="Nama">
<input id="gudang" placeholder="Gudang">

<div class="btn">
<button class="add" onclick="tambah()">Tambah</button>
<button class="update" onclick="update()">Update</button>
<button class="delete" onclick="hapus()">Hapus</button>
</div>

<input id="search" placeholder="Cari nama..." onkeyup="cari()">

<div id="abjad"></div>

<table>
<thead>
<tr>
<th>UID</th>
<th>Nama</th>
<th>Gudang</th>
<th>Status</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<div>Hadir hari ini: <b id="total">0</b></div>

</div>

<script>

const URL="https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

let allData=[];

function load(){
 fetch(URL+"?mode=getUsers")
 .then(r=>r.json())
 .then(d=>{
  allData=d.data;
  render(allData);
  buatAbjad();
 });
}

function render(data){
 let html="";
 let hadir=0;

 data.forEach(d=>{
  html+=`
  <tr onclick="pilih('${d.uid}','${d.nama}','${d.gudang}')">
  <td>${d.uid}</td>
  <td>${d.nama}</td>
  <td>${d.gudang}</td>
  <td id="s_${d.uid}">...</td>
  </tr>`;
  cek(d.uid);
 });

 list.innerHTML=html;
}

function cek(uid){
 fetch(URL+`?mode=cek&uid=${uid}`)
 .then(r=>r.json())
 .then(d=>{
  let el=document.getElementById("s_"+uid);
  if(d.status=="HADIR"){
    el.innerText="✔";
    hitung();
  }else{
    el.innerText="-";
  }
 });
}

function hitung(){
 let total=document.querySelectorAll("td:contains('✔')");
 document.getElementById("total").innerText=total.length;
}

function pilih(u,n,g){
 uid.value=u;
 nama.value=n;
 gudang.value=g;
}

function tambah(){
 fetch(URL+`?mode=add&uid=${uid.value}&nama=${nama.value}&gudang=${gudang.value}`)
 .then(()=>load());
}

function update(){
 fetch(URL+`?mode=update&uid=${uid.value}&nama=${nama.value}&gudang=${gudang.value}`)
 .then(()=>load());
}

function hapus(){
 fetch(URL+`?mode=delete&uid=${uid.value}`)
 .then(()=>load());
}

function cari(){
 let q=search.value.toLowerCase();
 let hasil=allData.filter(d=>d.nama.toLowerCase().includes(q));
 render(hasil);
}

function buatAbjad(){
 let html="";
 for(let i=65;i<=90;i++){
  let h=String.fromCharCode(i);
  html+=`<span onclick="filter('${h}')">${h}</span> `;
 }
 html+=`<span onclick="render(allData)">ALL</span>`;
 abjad.innerHTML=html;
}

function filter(h){
 let hasil=allData.filter(d=>d.nama.toUpperCase().startsWith(h));
 render(hasil);
}

load();

</script>

</body>
</html>
