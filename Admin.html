<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN</title>

<style>
body{
  background:black;
  color:#00ff88;
  font-family:monospace;
  margin:0;
  padding:15px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.btn{
  background:#00ff88;
  color:black;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}

/* BOX */
.box{
  background:#111;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

/* GUDANG SCROLL */
.scroll{
  display:flex;
  overflow-x:auto;
  gap:10px;
}

.card{
  min-width:90px;
  background:#222;
  padding:10px;
  border-radius:8px;
  text-align:center;
}

/* LIVE */
#live{
  font-size:14px;
  line-height:1.6;
}

/* SEARCH */
input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

/* POPUP */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center;
  align-items:center;
}

.popupBox{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:90%;
  max-width:300px;
}

.popup input{
  margin-bottom:10px;
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
  <h2>ADMIN</h2>
  <div class="btn" onclick="openPopup()">+ USER</div>
</div>

<div id="jam"></div>

<!-- SEARCH -->
<input id="search" placeholder="Cari nama...">

<!-- SUMMARY -->
<div class="box">
  Total Absen: <b id="total">0</b><br>
  Total Jam: <b id="jamKerja">0</b>
</div>

<!-- GUDANG -->
<div class="box">
  <b>Distribusi Gudang</b>
  <div class="scroll" id="gudang"></div>
</div>

<!-- LIVE -->
<div class="box">
  <b>Live Activity</b>
  <div id="live"></div>
</div>

<!-- POPUP TAMBAH USER -->
<div class="popup" id="popup">
  <div class="popupBox">
    <h3>Tambah User</h3>

    <input id="uid" placeholder="UID">
    <input id="nama" placeholder="Nama">
    <input id="gudangInput" placeholder="Gudang">

    <div class="btn" onclick="getGPS()">Ambil GPS</div>
    <div id="gps" style="font-size:12px;margin:5px 0"></div>

    <div class="btn" onclick="simpan()">SIMPAN</div>
    <div class="btn" onclick="closePopup()">BATAL</div>
  </div>
</div>

<script>

const URL = "PASTE_URL_APPS_SCRIPT";

// ===== JAM REALTIME =====
setInterval(()=>{
  document.getElementById("jam").innerText =
    new Date().toLocaleString();
},1000);


// ===== LOAD DASHBOARD =====
function load(){

fetch(URL+"?mode=dashboard")
.then(r=>r.json())
.then(d=>{

// TOTAL
document.getElementById("total").innerText = d.totalHari;
document.getElementById("jamKerja").innerText = d.totalJam;

// GUDANG
let gHTML="";
let count=0;
let other=0;

for(let k in d.gudang){
  count++;
  if(count <= 5){
    gHTML += `<div class="card">${k}<br>${d.gudang[k]}</div>`;
  }else{
    other += d.gudang[k];
  }
}

if(other > 0){
  gHTML += `<div class="card">Other<br>${other}</div>`;
}

document.getElementById("gudang").innerHTML = gHTML;


// LIVE
let liveHTML="";
d.live.forEach(x=>{
  liveHTML += `${x.jam} - ${x.nama} (${x.gudang}) ${x.status}<br>`;
});

document.getElementById("live").innerHTML = liveHTML;

});

}

// AUTO REFRESH
setInterval(load,5000);
load();


// ===== SEARCH =====
document.getElementById("search").addEventListener("input", function(){
  let val = this.value.toLowerCase();
  let lines = document.getElementById("live").innerHTML.split("<br>");

  let filtered = lines.filter(x => x.toLowerCase().includes(val));
  document.getElementById("live").innerHTML = filtered.join("<br>");
});


// ===== POPUP =====
function openPopup(){
  document.getElementById("popup").style.display="flex";
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}


// ===== GPS =====
let lat="", lng="";

function getGPS(){
  navigator.geolocation.getCurrentPosition(p=>{
    lat = p.coords.latitude;
    lng = p.coords.longitude;
    document.getElementById("gps").innerText =
      "GPS: " + lat + ", " + lng;
  });
}


// ===== SIMPAN USER =====
function simpan(){

let uid = document.getElementById("uid").value;
let nama = document.getElementById("nama").value;
let gudang = document.getElementById("gudangInput").value;

fetch(`${URL}?mode=add&uid=${uid}&nama=${nama}&gudang=${gudang}`)
.then(r=>r.json())
.then(d=>{
  alert("Berhasil tambah user");
  closePopup();
});

}

</script>

</body>
</html>
