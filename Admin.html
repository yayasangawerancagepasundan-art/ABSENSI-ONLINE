<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN DASHBOARD</title>

<style>
body{
  margin:0;
  font-family:monospace;
  background:#0b0b0b;
  color:#00ff66;
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  background:#0b0b0b;
  padding:15px;
  border-bottom:1px solid #222;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title{
  font-size:18px;
}

.btn{
  background:linear-gradient(45deg, lime, #00ffcc);
  border:none;
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

/* CARD */
.card{
  background:#111;
  padding:15px;
  border-radius:15px;
  box-shadow:0 0 10px rgba(0,255,100,0.1);
}

/* JAM */
#jam{
  font-size:26px;
  text-align:center;
  margin:10px 0;
}

/* TOTAL */
.total{
  font-size:28px;
  text-align:center;
}

/* GUDANG */
.gudangScroll{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
}

.gudangItem{
  min-width:80px;
  background:#111;
  border-radius:10px;
  padding:10px;
  text-align:center;
}

/* LIVE */
.liveItem{
  background:#111;
  margin:8px 0;
  padding:10px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
}

/* FORM */
#formUser{
  display:none;
  padding:10px;
}

#formUser input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  background:#222;
  color:white;
}

#formUser button{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="title">⚡ ADMIN PANEL</div>
  <button class="btn" onclick="toggleForm()">+ USER</button>
</div>

<!-- JAM -->
<div id="jam">00:00:00</div>

<!-- GRID -->
<div class="grid">
  <div class="card">
    <div>Total Absen</div>
    <div class="total" id="total">0</div>
  </div>

  <div class="card">
    <div>Total Jam</div>
    <div class="total" id="jamTotal">0</div>
  </div>
</div>

<!-- GUDANG -->
<div class="card" style="margin:10px;">
  <div>Distribusi Gudang</div>
  <div class="gudangScroll" id="gudangBox"></div>
</div>

<!-- LIVE -->
<div class="card" style="margin:10px;">
  <div>Live Aktivitas</div>
  <div id="liveBox"></div>
</div>

<!-- FORM TAMBAH USER -->
<div id="formUser">
  <div class="card">
    <h3>TAMBAH USER</h3>

    <input id="uid" placeholder="UID RFID">
    <input id="nama" placeholder="Nama">
    <input id="gudang" placeholder="Gudang">
    <input id="lat" placeholder="Latitude">
    <input id="lng" placeholder="Longitude">

    <button onclick="simpanUser()">SIMPAN</button>
    <button onclick="toggleForm()">BATAL</button>
  </div>
</div>

<script>

const URL="https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

/* JAM */
setInterval(()=>{
  let now = new Date();
  document.getElementById("jam").innerText =
    now.toLocaleTimeString('id-ID');
},1000);

/* LOAD DATA */
function loadData(){

  fetch(URL+"?mode=adminSummary")
  .then(r=>r.json())
  .then(d=>{

    document.getElementById("total").innerText = d.total || 0;
    document.getElementById("jamTotal").innerText = d.totalJam || 0;

    let g = "";
    d.gudang.forEach(x=>{
      g += `
      <div class="gudangItem">
        <b>${x.nama}</b><br>${x.jumlah}
      </div>`;
    });
    document.getElementById("gudangBox").innerHTML = g;

    let l = "";
    d.live.forEach(x=>{
      l += `
      <div class="liveItem">
        <div>${x.nama}</div>
        <div>${x.aksi}</div>
        <div>${x.jam}</div>
      </div>`;
    });
    document.getElementById("liveBox").innerHTML = l;

  });

}

/* FORM CONTROL */
function toggleForm(){
  let f = document.getElementById("formUser");
  f.style.display = f.style.display=="none" ? "block" : "none";
}

function simpanUser(){

  let uid = document.getElementById("uid").value.trim();
  let nama = document.getElementById("nama").value.trim();
  let gudang = document.getElementById("gudang").value.trim();
  let lat = document.getElementById("lat").value.trim();
  let lng = document.getElementById("lng").value.trim();

  if(!uid || !nama || !gudang || !lat || !lng){
    alert("SEMUA HARUS DIISI");
    return;
  }

  fetch(`${URL}?mode=addUser&uid=${uid}&nama=${nama}&gudang=${gudang}&lat=${lat}&lng=${lng}`)
  .then(r=>r.json())
  .then(d=>{
    if(d.status=="OK"){
      alert("USER DITAMBAHKAN");
      toggleForm();
      loadData();
    }else{
      alert("GAGAL");
    }
  });
}

/* AUTO */
setInterval(loadData,5000);
loadData();

</script>

</body>
</html>
