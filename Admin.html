<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL</title>

<style>
body{
  font-family:Arial;
  background:#111;
  color:#fff;
  text-align:center;
}

.container{
  max-width:500px;
  margin:auto;
}

input,select{
  width:90%;
  padding:10px;
  margin:5px;
}

button{
  padding:10px;
  margin:5px;
  width:90%;
}

.card{
  background:#222;
  padding:10px;
  margin:10px;
  border-radius:8px;
  text-align:left;
}
</style>
</head>

<body>

<h2>ADMIN DATABASE</h2>

<div class="container">

<!-- FORM -->
<input id="uid" placeholder="UID">
<input id="nama" placeholder="Nama">
<input id="gudang" placeholder="Gudang">

<select id="role">
  <option>User</option>
  <option>Admin</option>
  <option>Direktur</option>
  <option>Teknisi</option>
</select>

<button onclick="addUser()">TAMBAH</button>
<button onclick="updateUser()">UPDATE</button>

<hr>

<h3>DATA USER</h3>
<div id="list"></div>

</div>

<script>

const URL="https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

// LOAD DATA
function loadData(){
  fetch(URL+"?mode=dashboard&uid=dummy") // trik untuk hit API
  .then(()=>getDatabase());
}

// AMBIL DATABASE (pakai trick)
function getDatabase(){
  fetch(URL)
  .then(()=>{

    // karena GAS tidak expose DB langsung
    // kita pakai workaround: tampil manual dummy

    document.getElementById("list").innerHTML=
    "<p>Gunakan fitur tambah/edit/hapus</p>";

  });
}

// TAMBAH
function addUser(){

  const data={
    mode:"add",
    uid:document.getElementById("uid").value,
    nama:document.getElementById("nama").value,
    role:document.getElementById("role").value,
    gudang:document.getElementById("gudang").value
  };

  fetch(URL,{
    method:"POST",
    body:JSON.stringify(data)
  })
  .then(r=>r.json())
  .then(res=>{
    alert("BERHASIL TAMBAH");
    clearForm();
  });

}

// UPDATE
function updateUser(){

  const data={
    mode:"edit",
    uid:document.getElementById("uid").value,
    nama:document.getElementById("nama").value,
    role:document.getElementById("role").value,
    gudang:document.getElementById("gudang").value
  };

  fetch(URL,{
    method:"POST",
    body:JSON.stringify(data)
  })
  .then(r=>r.json())
  .then(res=>{
    alert("BERHASIL UPDATE");
    clearForm();
  });

}

// DELETE
function deleteUser(uid){

  fetch(URL,{
    method:"POST",
    body:JSON.stringify({
      mode:"delete",
      uid:uid
    })
  })
  .then(r=>r.json())
  .then(()=>{
    alert("TERHAPUS");
  });
}

// ISI FORM (edit)
function fill(uid,nama,role,gudang){
  document.getElementById("uid").value=uid;
  document.getElementById("nama").value=nama;
  document.getElementById("role").value=role;
  document.getElementById("gudang").value=gudang;
}

// CLEAR
function clearForm(){
  document.getElementById("uid").value="";
  document.getElementById("nama").value="";
  document.getElementById("gudang").value="";
}

// INIT
loadData();

</script>

</body>
</html>
