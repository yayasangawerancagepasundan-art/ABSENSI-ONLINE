<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASHBOARD ADMIN</title>

<style>
body{
  background:black;
  color:#00ff66;
  font-family:monospace;
  text-align:center;
}

.box{
  background:white;
  color:black;
  margin:10px;
  padding:15px;
  border-radius:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin:5px 0;
}

button{
  width:90%;
  padding:10px;
  margin:5px;
}

input,select{
  width:90%;
  padding:8px;
  margin:5px;
}

#list{
  text-align:left;
}
</style>
</head>

<body>

<h2>DASHBOARD ADMIN</h2>

<!-- SUMMARY -->
<div class="box">
  <div class="row"><div>Total User</div><div id="totalUser">-</div></div>
  <div class="row"><div>Total Absen</div><div id="totalAbsen">-</div></div>
</div>

<!-- LIST -->
<div class="box">
  <h3>DATA USER</h3>
  <div id="list">Loading...</div>
</div>

<!-- FORM -->
<div class="box">
<h3>FORM USER</h3>

<input type="hidden" id="id">
<input type="text" id="nama" placeholder="Nama">
<input type="text" id="uid" placeholder="UID RFID">

<select id="role">
  <option>User</option>
  <option>Admin</option>
  <option>Direktur</option>
  <option>Teknisi</option>
</select>

<button onclick="saveData()">SAVE</button>
<button onclick="clearForm()">CANCEL</button>

</div>

<button onclick="loadData()">REFRESH</button>

<script>

const URL="https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

// LOAD DATA
function loadData(){

  document.getElementById("list").innerHTML="Loading...";

  fetch(`${URL}?mode=admin`)
  .then(r=>r.json())
  .then(data=>{

    if(data.status!="OK"){
      document.getElementById("list").innerHTML="ERROR";
      return;
    }

    document.getElementById("totalUser").innerText=data.totalUser;
    document.getElementById("totalAbsen").innerText=data.totalAbsen;

    let html="";

    data.data.forEach(d=>{
      html+=`
      <div class="box">
        <div><b>${d.nama}</b></div>
        <div>UID: ${d.uid}</div>
        <div>Role: ${d.role}</div>

        <button onclick="editData('${d.id}','${d.nama}','${d.uid}','${d.role}')">EDIT</button>
        <button onclick="hapusData('${d.id}')">HAPUS</button>
      </div>
      `;
    });

    document.getElementById("list").innerHTML=html || "Tidak ada data";
  });

}

// SAVE
function saveData(){

  let id = document.getElementById("id").value;
  let nama = document.getElementById("nama").value;
  let uid = document.getElementById("uid").value;
  let role = document.getElementById("role").value;

  fetch(`${URL}?mode=save&id=${id}&nama=${nama}&uid=${uid}&role=${role}`)
  .then(r=>r.json())
  .then(res=>{
    alert(res.pesan);
    clearForm();
    loadData();
  });

}

// EDIT
function editData(id,nama,uid,role){
  document.getElementById("id").value=id;
  document.getElementById("nama").value=nama;
  document.getElementById("uid").value=uid;
  document.getElementById("role").value=role;
}

// DELETE
function hapusData(id){

  if(!confirm("Hapus data?")) return;

  fetch(`${URL}?mode=delete&id=${id}`)
  .then(r=>r.json())
  .then(res=>{
    alert(res.pesan);
    loadData();
  });

}

// CLEAR
function clearForm(){
  document.getElementById("id").value="";
  document.getElementById("nama").value="";
  document.getElementById("uid").value="";
  document.getElementById("role").value="User";
}

// AUTO LOAD
loadData();

</script>

</body>
</html>
