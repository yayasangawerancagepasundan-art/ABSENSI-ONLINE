<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABSENSI</title>

<style>
body{
  background:#0b1a2e;
  color:white;
  text-align:center;
  font-family:Arial;
}
.hidden{display:none}

.radar-box{
  position:relative;
  width:220px;
  height:220px;
  margin:40px auto;
  border-radius:50%;
  border:2px solid #22c55e;
  overflow:hidden;
}
.radar-line{
  position:absolute;
  width:50%;
  height:2px;
  background:#22c55e;
  top:50%;
  left:50%;
  transform-origin:left center;
  animation:spin 2s linear infinite;
}
@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

video{
  width:90%;
  border-radius:10px;
}
button{
  padding:10px 18px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  color:white;
}
</style>
</head>

<body>

<!-- SCAN -->
<div id="scanPage">
<h2>ABSENSI</h2>
<p>UID: <span id="uid">-</span></p>
<button onclick="startScan()">SCAN KARTU</button>
<p id="status">Menunggu...</p>
</div>

<!-- LOKASI -->
<div id="locationPage" class="hidden">
<h3>📍 Cek Lokasi</h3>
<div class="radar-box">
  <div class="radar-line"></div>
</div>
<p id="locStatus">Mengambil lokasi...</p>
<p id="jarak">-</p>
</div>

<!-- KAMERA -->
<div id="cameraPage" class="hidden">
<h3>📸 Kamera</h3>
<video id="video" autoplay playsinline></video>
<p id="camStatus">Mengambil foto...</p>
</div>

<!-- RESULT -->
<div id="resultPage" class="hidden">
<h3>✅ Berhasil</h3>
<p id="nama"></p>
<p id="gudang"></p>
</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbznCmA9JKgrMSklIBvN8y7fpqGJt1jNSNUEu9hfGmCgGV5bMhAQPfzFqaB_leRqLis/exec";

let stream;

/* NFC */
async function startScan(){
  try{
    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("status").innerText="Tempel kartu...";

    ndef.onreading = (event)=>{
      let uid = event.serialNumber;
      window.uid = uid;

      document.getElementById("uid").innerText = uid;

      document.getElementById("scanPage").classList.add("hidden");
      document.getElementById("locationPage").classList.remove("hidden");

      getLocation();
    }

  }catch(e){
    alert("HP tidak support NFC");
  }
}

/* LOKASI */
function getLocation(){

navigator.geolocation.getCurrentPosition(async (pos)=>{

  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;

  window.lat = lat;
  window.lng = lng;

  document.getElementById("locStatus").innerText="Validasi lokasi...";

  try{

    let res = await fetch(`${URL}?uid=${window.uid}&lat=${lat}&lng=${lng}`);
    let data = await res.json();

    document.getElementById("jarak").innerText="Jarak: "+Math.round(data.jarak)+" m";

    if(data.status==="IN_RANGE"){

      window.nama = data.nama;
      window.gudang = data.gudang;

      document.getElementById("locStatus").innerText="Dalam area";

      setTimeout(openCamera,1000);

    }else{
      document.getElementById("locStatus").innerText="Diluar area ❌";
    }

  }catch(e){
    alert("Gagal koneksi lokasi");
  }

});
}

/* KAMERA (FIX) */
async function openCamera(){

document.getElementById("locationPage").classList.add("hidden");
document.getElementById("cameraPage").classList.remove("hidden");

stream = await navigator.mediaDevices.getUserMedia({
  video:{
    facingMode:"user",
    width:{ideal:320},
    height:{ideal:240}
  }
});

let video = document.getElementById("video");
video.srcObject = stream;

video.onloadedmetadata = ()=>{
  video.play();

  setTimeout(()=>{
    takePhoto(video);
  },1500);
};

}

/* FOTO (FIX) */
function takePhoto(video){

let canvas = document.createElement("canvas");
canvas.width = 240;
canvas.height = 180;

let ctx = canvas.getContext("2d");
ctx.drawImage(video,0,0,240,180);

let foto = canvas.toDataURL("image/jpeg",0.3);

sendData(foto);

}

/* KIRIM (FIX FORM DATA) */
async function sendData(foto){

document.getElementById("camStatus").innerText="Mengirim data...";

try{

let formData = new FormData();

formData.append("uid", window.uid);
formData.append("nama", window.nama);
formData.append("gudang", window.gudang);
formData.append("lat", window.lat);
formData.append("lng", window.lng);
formData.append("foto", foto);

let res = await fetch(URL,{
  method:"POST",
  body: formData
});

let data = await res.json();

stream.getTracks().forEach(t=>t.stop());

if(data.status==="SUCCESS"){

  document.getElementById("cameraPage").classList.add("hidden");
  document.getElementById("resultPage").classList.remove("hidden");

  document.getElementById("nama").innerText = window.nama;
  document.getElementById("gudang").innerText = window.gudang;

}else{
  alert("Server error");
}

}catch(e){
  alert("Gagal kirim data");
}

}

</script>

</body>
</html>
