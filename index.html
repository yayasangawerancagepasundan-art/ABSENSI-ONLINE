<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI NFC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      background: green;
      color: white;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
    }

    .box {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      text-align: left;
    }
  </style>
</head>

<body>

<h2>ABSENSI NFC</h2>

<button onclick="scanNFC()">SCAN KARTU</button>

<div class="box">
  <p id="status">Status: Menunggu scan...</p>
  <p id="uid">ID: -</p>
  <p id="server">Server: -</p>
</div>

<script>

function parseTextRecord(record) {
  const data = new Uint8Array(record.data);
  const textDecoder = new TextDecoder();

  const langLength = data[0] & 0x3F;

  return textDecoder.decode(data.slice(1 + langLength));
}

async function scanNFC() {

  if (!('NDEFReader' in window)) {
    alert("HP tidak support NFC Web");
    return;
  }

  try {
    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("status").innerText = "Dekatkan kartu NFC...";

    ndef.onreading = async (event) => {

      let rawText = "";
      let uid = "";

      for (const record of event.message.records) {
        if (record.recordType === "text") {
          rawText = parseTextRecord(record);
        }
      }

      // ambil angka saja
      uid = rawText.replace(/[^0-9]/g, "");

      document.getElementById("status").innerText = "RAW: " + rawText;

      if (!uid) {
        document.getElementById("uid").innerText = "UID: GAGAL BACA";
        return;
      }

      document.getElementById("uid").innerText = "UID: " + uid;

      document.getElementById("status").innerText = "Kirim ke server...";

      try {
        let res = await fetch("https://script.google.com/macros/s/AKfycbxQYvZIxsv-KrVS2k3wKtmAtq3iOQuoz2PErPJP764YIvOiKv8lvx8IcFO44-tQc4A/exec", {
          method: "POST",
          body: JSON.stringify({
            uid: uid
          })
        });

        let data = await res.json();

        document.getElementById("status").innerText = "Berhasil";
        document.getElementById("server").innerText = JSON.stringify(data);

      } catch (err) {
        document.getElementById("status").innerText = "Gagal kirim";
      }

    };

  } catch (error) {
    alert("Error NFC: " + error);
  }
}

</script>

</body>
</html>
