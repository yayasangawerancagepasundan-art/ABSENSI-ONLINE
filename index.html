<!DOCTYPE html>
<html>
<head>
  <title>Absensi Karyawan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    button {
      padding: 15px;
      font-size: 18px;
      background: green;
      color: white;
      border: none;
      border-radius: 10px;
      width: 100%;
      margin-top: 10px;
    }

    input {
      padding: 10px;
      width: 100%;
      margin-top: 10px;
      font-size: 16px;
    }

    .box {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h2>ABSENSI KARYAWAN</h2>

<button onclick="scanNFC()">SCAN NFC</button>

<input type="text" id="manualUID" placeholder="Masukkan UID manual (jika NFC gagal)">

<button onclick="kirimManual()">KIRIM MANUAL</button>

<div class="box">
  <p id="status">Status: -</p>
  <p id="nama">Nama: -</p>
  <p id="gudang">Gudang: -</p>
</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbxQYvZIxsv-KrVS2k3wKtmAtq3iOQuoz2PErPJP764YIvOiKv8lvx8IcFO44-tQc4A/exec";

// ================= NFC =================
async function scanNFC() {
  try {
    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("status").innerText = "Tempelkan kartu...";

    ndef.onreading = (event) => {
      let uid = "";

      for (const record of event.message.records) {
        uid = new TextDecoder().decode(record.data);
      }

      kirim(uid);
    };

  } catch (error) {
    alert("HP tidak support NFC browser");
  }
}

// ================= MANUAL =================
function kirimManual() {
  let uid = document.getElementById("manualUID").value;
  if (!uid) return alert("Isi UID dulu");
  kirim(uid);
}

// ================= KIRIM KE SERVER =================
function kirim(uid) {

  document.getElementById("status").innerText = "Ambil lokasi...";

  navigator.geolocation.getCurrentPosition(async function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    document.getElementById("status").innerText = "Kirim ke server...";

    let res = await fetch(URL, {
      method: "POST",
      body: JSON.stringify({
        uid: uid,
        lat: lat,
        lng: lng
      })
    });

    let data = await res.json();

    if (data.status == "SUCCESS") {
      document.getElementById("status").innerText = data.message || "Berhasil";
      document.getElementById("nama").innerText = "Nama: " + data.nama;
      document.getElementById("gudang").innerText = "Gudang: " + data.gudang;
    } else {
      document.getElementById("status").innerText = data.message || "Tidak terdaftar";
    }

  }, function() {
    alert("Gagal ambil lokasi");
  });
}

</script>

</body>
</html>
