<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABSENSI</title>

<style>
body {
  background:black;
  color:#00ff66;
  font-family:monospace;
  text-align:center;
}

.radar {
  width:260px;height:260px;
  margin:20px auto;
  border-radius:50%;
  background:radial-gradient(circle,#001a00,#000);
  position:relative;
  overflow:hidden;
}

.sweep {
  width:100%;height:100%;
  position:absolute;
  background:conic-gradient(rgba(0,255,100,0.4),transparent);
  animation:spin 2s linear infinite;
}

@keyframes spin {100%{transform:rotate(360deg);}}

.target {
  width:10px;height:10px;
  background:red;border-radius:50%;
  position:absolute;
}

.crosshair {
  width:30px;height:30px;
  border:2px solid #00ff66;
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  display:none;
}

button {
  margin-top:10px;
  padding:10px;
  width:80%;
}

#infoPage,#thankPage {display:none;background:white;color:black;margin:10px;padding:10px;border-radius:10px;}

video,img {width:100%;max-width:300px;border-radius:10px;}

</style>
</head>

<body>

<h2>ABSENSI</h2>

<!-- MAIN -->
<div id="mainPage">
<div class="radar">
  <div class="sweep"></div>
  <div class="target" id="target"></div>
  <div class="crosshair" id="crosshair"></div>
</div>

<div id="status">MENCARI TARGET...</div>
<div>Jarak: <span id="jarak">-</span></div>
<div>Akurasi: <span id="akurasi">-</span></div>

<button id="btnAbsen" disabled>ABSEN</button>
</div>

<!-- INFO + FOTO -->
<div id="infoPage">

<h3>INFORMASI</h3>
<div>Nama : <span id="nama"></span></div>
<div>Tanggal : <span id="tanggal"></span></div>
<div>Waktu : <span id="waktu"></span></div>
<div>Lokasi : <span id="lokasi"></span></div>
<div>Status : <span id="statusAbsensi"></span></div>

<hr>

<h3>SELFIE WAJIB</h3>

<video id="video" autoplay></video>
<canvas id="canvas" style="display:none;"></canvas>
<img id="preview" style="display:none;">

<button id="takePhoto">AMBIL FOTO</button>
<button id="retake" style="display:none;">ULANGI</button>
<button id="confirm" disabled>KONFIRMASI</button>

</div>

<!-- THANK YOU -->
<div id="thankPage">
<h2>TERIMAKASIH</h2>
<p>Data berhasil dikirim</p>
<p>Halaman akan tertutup...</p>
</div>

<script>

const URL="https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

const TARGET_LAT=-6.2341459;
const TARGET_LNG=106.4997284;
const RADIUS=50;

let lat=0,lng=0,locked=false,photo="";

// ===== DISTANCE
function dist(a,b,c,d){
const R=6371000;
let dLat=(c-a)*Math.PI/180;
let dLon=(d-b)*Math.PI/180;
let x=Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ===== GPS
navigator.geolocation.watchPosition(p=>{
lat=p.coords.latitude;
lng=p.coords.longitude;

let d=dist(lat,lng,TARGET_LAT,TARGET_LNG);

jarak.innerText=Math.round(d)+" m";
akurasi.innerText="± "+Math.round(p.coords.accuracy)+" m";

if(d<=RADIUS){
locked=true;
status.innerText="TARGET LOCK";
crosshair.style.display="block";
btnAbsen.disabled=false;
}
});

// ===== STEP 1: ABSEN
btnAbsen.onclick=()=>{

if(!locked)return alert("Belum radius");

fetch(`${URL}?lat=${lat}&lng=${lng}`)
.then(r=>r.json())
.then(data=>{

mainPage.style.display="none";
infoPage.style.display="block";

nama.innerText=data.nama||"-";
tanggal.innerText=data.tanggal||"-";
waktu.innerText=data.waktu||"-";
lokasi.innerText=data.lokasi||"-";
statusAbsensi.innerText=data.status||"-";

startCamera();

});

};

// ===== CAMERA
function startCamera(){
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);
}

// ambil foto
takePhoto.onclick=()=>{
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
canvas.getContext("2d").drawImage(video,0,0);

photo=canvas.toDataURL("image/jpeg");

preview.src=photo;
preview.style.display="block";
video.style.display="none";

confirm.disabled=false;
retake.style.display="inline-block";
};

// ulang
retake.onclick=()=>{
preview.style.display="none";
video.style.display="block";
confirm.disabled=true;
};

// ===== STEP FINAL: KIRIM
confirm.onclick=()=>{

fetch(`${URL}?lat=${lat}&lng=${lng}`)
.then(()=>{

infoPage.style.display="none";
thankPage.style.display="block";

// auto close 10 detik
setTimeout(()=>{
window.close();
},10000);

});

};

</script>

</body>
</html>
