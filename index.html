<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    .status {
      font-size: 20px;
      font-weight: bold;
    }

    .green { color: green; }
    .red { color: red; }

    button {
      padding: 15px;
      font-size: 18px;
      width: 100%;
      border-radius: 10px;
      border: none;
      background: gray;
      color: white;
      margin-top: 10px;
    }

    button.active {
      background: green;
    }

    /* ===== RADAR MAP ===== */
    .radar {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 20px auto;
      border-radius: 50%;
      overflow: hidden;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .sweep {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        rgba(0,255,100,0.4),
        transparent
      );
      animation: rotate 2s linear infinite;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    .center-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: lime;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .target-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: red;
      border-radius: 50%;
    }

    .target-lock {
      animation: pulse 0.6s infinite alternate;
      background: lime;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.6); }
    }

  </style>
</head>

<body>

<h2>ABSENSI</h2>

<div class="card">

  <div id="statusText" class="status red">Mencari lokasi...</div>

  <div class="radar">
    <iframe id="mapFrame"></iframe>

    <div class="overlay">
      <div class="sweep"></div>
      <div class="center-dot"></div>
      <div class="target-dot" id="targetDot"></div>
    </div>
  </div>

  <p>Jarak: <span id="jarak">-</span></p>
  <p>Akurasi: <span id="akurasi">-</span></p>

  <button id="btnAbsen" disabled>ABSEN</button>

</div>

<script>

const TARGET_LAT = -6.2341459;
const TARGET_LNG = 106.4997284;
const RADIUS = 50;

let locked = false;
let lastZoom = 17;
let lastUpdate = 0;

// ===== LOAD MAP SEKALI =====
document.getElementById("mapFrame").src =
  `https://maps.google.com/maps?q=${TARGET_LAT},${TARGET_LNG}&z=17&output=embed`;

// ===== HITUNG JARAK =====
function hitungJarak(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI/180;
  const dLon = (lon2 - lon1) * Math.PI/180;

  const a = Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// ===== GPS =====
navigator.geolocation.watchPosition(pos => {

  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;
  let accuracy = pos.coords.accuracy;

  let jarak = hitungJarak(lat, lng, TARGET_LAT, TARGET_LNG);

  document.getElementById("jarak").innerText = Math.round(jarak) + " m";
  document.getElementById("akurasi").innerText = "± " + Math.round(accuracy) + " m";

  // ===== ZOOM STEP HALUS (TIDAK KEDIP) =====
  let zoom;

  if (jarak > 500) zoom = 15;
  else if (jarak > 200) zoom = 16;
  else if (jarak > 100) zoom = 17;
  else if (jarak > 50) zoom = 18;
  else zoom = 19;

  // UPDATE MAP TIDAK TERLALU SERING
  let now = Date.now();
  if (Math.abs(zoom - lastZoom) >= 1 && (now - lastUpdate > 2000)) {

    document.getElementById("mapFrame").src =
      `https://maps.google.com/maps?q=${lat},${lng}&z=${zoom}&output=embed`;

    lastZoom = zoom;
    lastUpdate = now;
  }

  // ===== TARGET POSISI =====
  let dx = TARGET_LNG - lng;
  let dy = TARGET_LAT - lat;

  let scale = 100000;

  let x = dx * scale;
  let y = dy * scale;

  let max = 80;
  x = Math.max(-max, Math.min(max, x));
  y = Math.max(-max, Math.min(max, y));

  let target = document.getElementById("targetDot");

  target.style.left = (100 + x) + "px";
  target.style.top = (100 - y) + "px";

  // ===== LOCK =====
  if (jarak <= RADIUS && !locked) {

    locked = true;

    document.getElementById("statusText").innerText = "TARGET TERKUNCI";
    document.getElementById("statusText").className = "status green";

    target.classList.add("target-lock");

    document.getElementById("btnAbsen").disabled = false;
    document.getElementById("btnAbsen").classList.add("active");
  }

},{
  enableHighAccuracy: true,
  maximumAge: 3000,
  timeout: 15000
});

</script>

</body>
</html>
