<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI NFC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial; text-align: center; background: #f5f5f5; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 15px; }
    .status { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
    .red { color:red; }
    .green { color:green; }

    button {
      padding: 15px;
      font-size: 18px;
      background: gray;
      color: white;
      border: none;
      border-radius: 10px;
      width: 100%;
      margin-top: 10px;
    }

    button.active { background: green; }

    video, img { width: 100%; border-radius: 10px; margin-top: 10px; }

    .row { display: flex; margin: 6px 0; }
    .label { width: 40%; text-align: left; font-weight: bold; }
    .titik { width: 10%; text-align: center; }
    .value { width: 50%; text-align: left; }
  </style>
</head>

<body>

<h2>ABSENSI</h2>

<div class="card">

  <!-- LOADING -->
  <div id="loading">
    <div class="status red">Mencari lokasi...</div>
    <p>Jarak: <span id="jarak">-</span></p>
    <p>Akurasi: <span id="akurasi">-</span></p>
  </div>

  <!-- READY -->
  <div id="ready" style="display:none;">
    <div class="status green">Dalam Area</div>
    <button id="btnAbsen" disabled>ABSEN</button>
  </div>

  <!-- STEP FOTO -->
  <div id="stepFoto" style="display:none;">

    <div class="status">Konfirmasi Absensi</div>

    <div class="row"><div class="label">Jam</div><div class="titik">:</div><div class="value" id="jam">-</div></div>
    <div class="row"><div class="label">Tanggal</div><div class="titik">:</div><div class="value" id="tanggal">-</div></div>
    <div class="row"><div class="label">GPS</div><div class="titik">:</div><div class="value" id="gps">-</div></div>

    <video id="camera" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="preview" style="display:none;"/>

    <button id="btnFoto">📸 Ambil Foto</button>
    <button id="btnUlang" style="display:none;">🔁 Ulangi Foto</button>
    <button id="btnKirim" disabled>KONFIRMASI</button>

  </div>

  <!-- RESULT -->
  <div id="result" style="display:none;">
    <div id="statusResult" class="status"></div>

    <div class="row"><div class="label">Nama</div><div class="titik">:</div><div class="value" id="nama">-</div></div>
    <div class="row"><div class="label">Gudang</div><div class="titik">:</div><div class="value" id="gudang">-</div></div>
  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");

const TARGET_LAT = -6.2341459;
const TARGET_LNG = 106.4997284;
const RADIUS = 50;

let currentLat = "";
let currentLng = "";
let fotoReady = false;
let stream = null;

// ===== HITUNG JARAK =====
function hitungJarak(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI/180;
  const dLon = (lon2 - lon1) * Math.PI/180;

  const a = Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// ===== ANIMASI TITIK =====
let dot = 0;
setInterval(() => {
  dot = (dot + 1) % 4;
  document.querySelector("#loading .status").innerText =
    "Mencari lokasi" + ".".repeat(dot);
}, 500);

// ===== GPS =====
navigator.geolocation.watchPosition(pos => {

  currentLat = pos.coords.latitude;
  currentLng = pos.coords.longitude;

  const accuracy = pos.coords.accuracy;
  const jarak = hitungJarak(currentLat, currentLng, TARGET_LAT, TARGET_LNG);

  document.getElementById("jarak").innerText = Math.round(jarak) + " m";
  document.getElementById("akurasi").innerText = "± " + Math.round(accuracy) + " m";

  if (jarak <= RADIUS) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("ready").style.display = "block";

    let btn = document.getElementById("btnAbsen");
    btn.disabled = false;
    btn.classList.add("active");
  }

}, err => {
  alert("GPS ERROR: " + err.message);
},{
  enableHighAccuracy: true,
  maximumAge: 3000,
  timeout: 15000
});

// ===== ABSEN =====
document.getElementById("btnAbsen").onclick = async function(){

  document.getElementById("ready").style.display = "none";
  document.getElementById("stepFoto").style.display = "block";

  const now = new Date();

  document.getElementById("tanggal").innerText = now.toLocaleDateString("id-ID");
  document.getElementById("jam").innerText = now.toLocaleTimeString("id-ID");
  document.getElementById("gps").innerText = currentLat + ", " + currentLng;

  stream = await navigator.mediaDevices.getUserMedia({ video: true });
  document.getElementById("camera").srcObject = stream;
};

// ===== FOTO =====
document.getElementById("btnFoto").onclick = function(){

  const video = document.getElementById("camera");
  const canvas = document.getElementById("canvas");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);

  const img = canvas.toDataURL("image/jpeg");

  document.getElementById("preview").src = img;
  document.getElementById("preview").style.display = "block";

  // matikan kamera
  if (stream) stream.getTracks().forEach(track => track.stop());

  video.style.display = "none";

  fotoReady = true;

  document.getElementById("btnUlang").style.display = "block";

  let btn = document.getElementById("btnKirim");
  btn.disabled = false;
  btn.classList.add("active");
};

// ===== ULANG FOTO =====
document.getElementById("btnUlang").onclick = async function(){

  const video = document.getElementById("camera");
  const preview = document.getElementById("preview");

  preview.style.display = "none";
  video.style.display = "block";

  let btn = document.getElementById("btnKirim");
  btn.disabled = true;
  btn.classList.remove("active");

  fotoReady = false;

  stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
};

// ===== KONFIRMASI =====
document.getElementById("btnKirim").onclick = async function(){

  if(!fotoReady){
    alert("Ambil foto dulu!");
    return;
  }

  let res = await fetch(API + "?uid=" + uid + "&lat=" + currentLat + "&lng=" + currentLng);
  let data = await res.json();

  document.getElementById("stepFoto").style.display = "none";
  document.getElementById("result").style.display = "block";

  if(data.status == "OK"){
    document.getElementById("statusResult").innerText = "ABSEN " + data.aksi;
    document.getElementById("statusResult").className = "status green";
    document.getElementById("nama").innerText = data.nama;
    document.getElementById("gudang").innerText = data.gudang;
  } else {
    document.getElementById("statusResult").innerText = "DITOLAK";
    document.getElementById("statusResult").className = "status red";
    document.getElementById("nama").innerText = data.pesan;
  }

};

</script>

</body>
</html>
