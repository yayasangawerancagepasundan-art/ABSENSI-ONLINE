<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABSENSI</title>

<style>
body {
  background:black;
  color:#00ff66;
  font-family:monospace;
  text-align:center;
}

.location-icon {
  font-size:80px;
  margin:20px 0;
}

.progress-container {
  width:80%;
  height:20px;
  background:#222;
  margin:10px auto;
  border-radius:10px;
  overflow:hidden;
}
.progress-bar {
  height:100%;
  width:0%;
  background:lime;
  transition:width 0.3s;
}

button {
  margin-top:10px;
  padding:10px;
  width:80%;
}

#infoPage,#thankPage,#warningPage,#dashboardPage {
  display:none;
  margin:10px;
  padding:10px;
  border-radius:10px;
}

#infoPage,#thankPage,#dashboardPage {
  background:white;
  color:black;
}

#warningPage {
  background:black;
  color:red;
}

video,img {
  width:100%;
  max-width:300px;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>ABSENSI</h2>

<!-- MAIN -->
<div id="mainPage">
  <div class="location-icon">📍</div>

  <div id="status">MENCARI LOKASI...</div>
  <div>Jarak: <span id="jarak">-</span></div>
  <div>Akurasi: <span id="akurasi">-</span></div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <button id="btnAbsen" disabled>ABSEN</button>
</div>

<!-- INFO -->
<div id="infoPage">
<h3>INFORMASI</h3>
<div>Nama : <span id="nama"></span></div>
<div>Tanggal : <span id="tanggal"></span></div>
<div>Waktu : <span id="waktu"></span></div>
<div>Lokasi : <span id="lokasi"></span></div>
<div>Status : <span id="statusAbsensi"></span></div>

<hr>

<h3>SELFIE WAJIB</h3>

<video id="video" autoplay></video>
<canvas id="canvas" style="display:none;"></canvas>
<img id="preview" style="display:none;">

<button id="takePhoto">AMBIL FOTO</button>
<button id="retake" style="display:none;">ULANGI</button>
<button id="confirm" disabled>KONFIRMASI</button>
</div>

<!-- THANK -->
<div id="thankPage">
<h2>TERIMAKASIH</h2>
<p>Absensi berhasil</p>
<p>Menutup dalam <span id="countdown">10</span> detik...</p>
</div>

<!-- WARNING -->
<div id="warningPage">
<h1 style="font-size:60px;">⚠️</h1>
<h2 id="warningText">WARNING</h2>
<p>Menutup dalam <span id="warningCountdown">5</span> detik...</p>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage">

  <div style="display:flex; justify-content:space-between;">
    <h3>Dashboard</h3>
    <div style="font-size:24px;">👤</div>
  </div>

  <hr>

  <div>Nama : <span id="dashNama">-</span></div>
  <div>UID : <span id="dashUID">-</span></div>

  <p>Riwayat & data pribadi akan tampil di sini</p>

</div>

<script>

// ===== ELEMENT =====
const btnAbsen = document.getElementById("btnAbsen");
const confirmBtn = document.getElementById("confirm");
const takePhoto = document.getElementById("takePhoto");
const retake = document.getElementById("retake");

const mainPage = document.getElementById("mainPage");
const infoPage = document.getElementById("infoPage");
const thankPage = document.getElementById("thankPage");
const warningPage = document.getElementById("warningPage");
const dashboardPage = document.getElementById("dashboardPage");

const nama = document.getElementById("nama");
const tanggal = document.getElementById("tanggal");
const waktu = document.getElementById("waktu");
const lokasi = document.getElementById("lokasi");
const statusAbsensi = document.getElementById("statusAbsensi");

const dashNama = document.getElementById("dashNama");
const dashUID = document.getElementById("dashUID");

const jarak = document.getElementById("jarak");
const akurasi = document.getElementById("akurasi");
const status = document.getElementById("status");
const progressBar = document.getElementById("progressBar");

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");

// ===== CONFIG =====
const URL = "https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";
const params = new URLSearchParams(window.location.search);
const UID = params.get("uid") || "";

// TARGET
const TARGET_LAT = -6.2341459;
const TARGET_LNG = 106.4997284;
const RADIUS = 50;

let lat=0,lng=0,locked=false;

// ===== DISTANCE =====
function dist(a,b,c,d){
  const R=6371000;
  let dLat=(c-a)*Math.PI/180;
  let dLon=(d-b)*Math.PI/180;
  let x=Math.sin(dLat/2)**2+
  Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
  Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ===== GPS =====
navigator.geolocation.watchPosition(p=>{
  lat=p.coords.latitude;
  lng=p.coords.longitude;

  let d=dist(lat,lng,TARGET_LAT,TARGET_LNG);

  jarak.innerText=Math.round(d)+" m";
  akurasi.innerText="± "+Math.round(p.coords.accuracy)+" m";

  let persen = 100 - (d / RADIUS * 100);
  persen = Math.max(0, Math.min(100, persen));
  progressBar.style.width = persen + "%";

  if(d <= RADIUS){
    locked=true;
    status.innerText="LOKASI VALID";
    btnAbsen.disabled=false;
  }
});

// ===== ABSEN =====
btnAbsen.onclick=()=>{
  if(!locked) return alert("Belum dalam radius");

  fetch(`${URL}?uid=${UID}&lat=${lat}&lng=${lng}`)
  .then(r=>r.json())
  .then(data=>{

    if(data.status !== "OK"){

      mainPage.style.display="none";
      warningPage.style.display="block";

      const text = document.getElementById("warningText");

      if(data.pesan && data.pesan.includes("3 jam")){
        text.innerText = "BELUM 3 JAM (TIDAK BISA KELUAR)";
      }else if(data.pesan && data.pesan.includes("10 menit")){
        text.innerText = "BELUM 10 MENIT (TIDAK BISA MASUK)";
      }else{
        text.innerText = data.pesan || "DITOLAK";
      }

      let sisa = 5;
      const cd = document.getElementById("warningCountdown");

      const timer = setInterval(()=>{
        sisa--;
        cd.innerText = sisa;

        if(sisa <= 0){
          clearInterval(timer);

          warningPage.style.display="none";
          showDashboard();
        }
      },1000);

      return;
    }

    mainPage.style.display="none";
    infoPage.style.display="block";

    nama.innerText = data.nama;
    lokasi.innerText = data.gudang;
    statusAbsensi.innerText = data.aksi;

    let now = new Date();
    tanggal.innerText = now.toLocaleDateString();
    waktu.innerText = now.toLocaleTimeString();

  });
};

// ===== CAMERA =====
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

// FOTO
takePhoto.onclick=()=>{
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  canvas.getContext("2d").drawImage(video,0,0);

  preview.src=canvas.toDataURL("image/jpeg");
  preview.style.display="block";
  video.style.display="none";

  confirmBtn.disabled=false;
  retake.style.display="inline-block";
};

// ULANG
retake.onclick=()=>{
  preview.style.display="none";
  video.style.display="block";
  confirmBtn.disabled=true;
};

// ===== KONFIRMASI =====
confirmBtn.onclick = () => {

  infoPage.style.display="none";
  thankPage.style.display="block";

  let sisa = 10;
  const cd = document.getElementById("countdown");

  const timer = setInterval(()=>{
    sisa--;
    cd.innerText = sisa;

    if(sisa <= 0){
      clearInterval(timer);

      thankPage.style.display="none";
      showDashboard();
    }
  },1000);
};

// ===== DASHBOARD FUNCTION =====
function showDashboard(){

  dashboardPage.style.display="block";

  fetch(`${URL}?uid=${UID}`)
  .then(r=>r.json())
  .then(data=>{
    if(data.status === "OK"){
      dashNama.innerText = data.nama;
      dashUID.innerText = UID;
    }
  });

}

</script>

</body>
</html>
