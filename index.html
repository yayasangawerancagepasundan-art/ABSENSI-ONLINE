<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    .status {
      font-size: 20px;
      font-weight: bold;
    }

    .green { color: green; }
    .red { color: red; }

    button {
      padding: 15px;
      font-size: 18px;
      width: 100%;
      border-radius: 10px;
      border: none;
      background: gray;
      color: white;
    }

    button.active {
      background: green;
    }

    /* ===== RADAR ===== */
    .radar {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 20px auto;
      border-radius: 50%;
      background: rgba(0,0,0,0.05);
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    /* sweep */
    .sweep {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        rgba(0,255,100,0.6) 0deg,
        rgba(0,255,100,0.2) 30deg,
        transparent 60deg
      );
      animation: rotate 2s linear infinite;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    /* sonar */
    .sonar {
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(0,255,100,0.4);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: sonarWave 2s infinite;
    }

    @keyframes sonarWave {
      0% {
        transform: translate(-50%, -50%) scale(0.3);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(4);
        opacity: 0;
      }
    }

    /* center */
    .center-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: lime;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* target */
    .target-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      background: red;
      border-radius: 50%;
    }

  </style>
</head>

<body>

<h2>ABSENSI</h2>

<div class="card">

  <div id="statusText" class="status red">Mencari lokasi...</div>

  <div class="radar" id="radar">
    <div class="sweep"></div>
    <div class="sonar"></div>
    <div class="center-dot"></div>
    <div class="target-dot" id="targetDot"></div>
  </div>

  <p>Jarak: <span id="jarak">-</span></p>
  <p>Akurasi: <span id="akurasi">-</span></p>

  <button id="btnAbsen" disabled>ABSEN</button>

</div>

<script>

const TARGET_LAT = -6.2341459;
const TARGET_LNG = 106.4997284;
const RADIUS = 50;

let locked = false;

// ===== HITUNG JARAK =====
function hitungJarak(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI/180;
  const dLon = (lon2 - lon1) * Math.PI/180;

  const a = Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// ===== GPS =====
navigator.geolocation.watchPosition(pos => {

  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;
  let accuracy = pos.coords.accuracy;

  let jarak = hitungJarak(lat, lng, TARGET_LAT, TARGET_LNG);

  document.getElementById("jarak").innerText = Math.round(jarak) + " m";
  document.getElementById("akurasi").innerText = "± " + Math.round(accuracy) + " m";

  // ===== AUTO ZOOM =====
  let zoom = 1 + (100 / (jarak + 50)); // makin dekat makin zoom
  zoom = Math.min(2.5, zoom); // batas max zoom

  document.getElementById("radar").style.transform = "scale(" + zoom + ")";

  // ===== POSISI TARGET =====
  let dx = TARGET_LNG - lng;
  let dy = TARGET_LAT - lat;

  let scale = 100000 * (1/zoom); // ikut zoom

  let x = dx * scale;
  let y = dy * scale;

  let max = 90;
  x = Math.max(-max, Math.min(max, x));
  y = Math.max(-max, Math.min(max, y));

  let target = document.getElementById("targetDot");

  target.style.left = (100 + x) + "px";
  target.style.top = (100 - y) + "px";

  // ===== SPEED SWEEP =====
  let speed = Math.max(0.5, jarak / 100);
  document.querySelector(".sweep").style.animationDuration = speed + "s";

  // ===== LOCK =====
  if (jarak <= RADIUS && !locked) {

    locked = true;

    document.getElementById("statusText").innerText = "TARGET TERKUNCI";
    document.getElementById("statusText").className = "status green";

    document.getElementById("btnAbsen").disabled = false;
    document.getElementById("btnAbsen").classList.add("active");

  }

}, err => {
  alert("GPS ERROR: " + err.message);
},{
  enableHighAccuracy: true,
  maximumAge: 3000,
  timeout: 15000
});

</script>

</body>
</html>
