<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABSENSI</title>

<style>
body{
  background:#0b1a2e;
  color:white;
  text-align:center;
  font-family:Arial;
}

.hidden{display:none}

/* RADAR */
.radar-box{
  position:relative;
  width:220px;
  height:220px;
  margin:40px auto;
  border-radius:50%;
  border:2px solid #22c55e;
  overflow:hidden;
}

.radar-line{
  position:absolute;
  width:50%;
  height:2px;
  background:#22c55e;
  top:50%;
  left:50%;
  transform-origin:left center;
  animation:spin 2s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

button{
  padding:12px 20px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  color:white;
}

video{
  width:90%;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- SCAN -->
<div id="scanPage">
  <h2>ABSENSI</h2>
  <p>UID: <span id="uid">-</span></p>
  <button onclick="startScan()">SCAN KARTU</button>
  <p id="status">Menunggu...</p>
</div>

<!-- LOKASI -->
<div id="locationPage" class="hidden">
  <h3>📍 Cek Lokasi</h3>
  <div class="radar-box">
    <div class="radar-line"></div>
  </div>
  <p id="locStatus">Mengambil lokasi...</p>
  <p id="jarak"></p>
</div>

<!-- KAMERA -->
<div id="cameraPage" class="hidden">
  <h3>📸 Kamera</h3>
  <video id="video" autoplay playsinline></video>
  <p id="camStatus">Mengambil foto...</p>
</div>

<!-- RESULT -->
<div id="resultPage" class="hidden">
  <h3>✅ Berhasil</h3>
  <p id="nama"></p>
  <p id="gudang"></p>
</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbznCmA9JKgrMSklIBvN8y7fpqGJt1jNSNUEu9hfGmCgGV5bMhAQPfzFqaB_leRqLis/exec";

let stream;

/* ================= NFC ================= */
async function startScan(){
  try{
    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("status").innerText="Tempel kartu...";

    ndef.onreading = (event)=>{
      let uid = event.serialNumber;
      window.uid = uid;

      document.getElementById("uid").innerText = uid;

      document.getElementById("scanPage").classList.add("hidden");
      document.getElementById("locationPage").classList.remove("hidden");

      getLocation();
    }

  }catch(e){
    alert("HP tidak support NFC");
  }
}

/* ================= LOKASI ================= */
function getLocation(){

navigator.geolocation.getCurrentPosition(async (pos)=>{

  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;

  window.lat = lat;
  window.lng = lng;

  document.getElementById("locStatus").innerText="Validasi lokasi...";

  try{

    let res = await fetch(`${URL}?uid=${window.uid}&lat=${lat}&lng=${lng}`);
    let data = await res.json();

    console.log("RESP LOKASI:", data);

    document.getElementById("jarak").innerText="Jarak: "+Math.round(data.jarak)+" m";

    if(data.status === "IN_RANGE"){

      window.nama = data.nama;
      window.gudang = data.gudang;

      document.getElementById("locStatus").innerText="Dalam area";

      setTimeout(openCamera,1000);

    }else{
      document.getElementById("locStatus").innerText="Diluar area ❌";
    }

  }catch(e){
    alert("Gagal koneksi lokasi");
    console.log(e);
  }

});
}

/* ================= KAMERA ================= */
async function openCamera(){

document.getElementById("locationPage").classList.add("hidden");
document.getElementById("cameraPage").classList.remove("hidden");

stream = await navigator.mediaDevices.getUserMedia({video:true});

let video = document.getElementById("video");
video.srcObject = stream;

video.onloadedmetadata = ()=>{
  video.play();

  setTimeout(()=>{
    takePhoto(video);
  },1500);
};

}

/* ================= FOTO ================= */
function takePhoto(video){

let canvas = document.createElement("canvas");

canvas.width = video.videoWidth || 640;
canvas.height = video.videoHeight || 480;

let ctx = canvas.getContext("2d");
ctx.drawImage(video,0,0,canvas.width,canvas.height);

let foto = canvas.toDataURL("image/jpeg",0.7);

console.log("FOTO DIAMBIL");

sendData(foto);

}

/* ================= KIRIM ================= */
async function sendData(foto){

console.log("KIRIM DATA...");

try{

let res = await fetch(URL,{
  method:"POST",
  headers:{
    "Content-Type":"application/json"
  },
  body:JSON.stringify({
    uid:window.uid,
    nama:window.nama,
    gudang:window.gudang,
    lat:window.lat,
    lng:window.lng,
    foto:foto
  })
});

let text = await res.text();
console.log("RESP SERVER:", text);

let data = JSON.parse(text);

stream.getTracks().forEach(t=>t.stop());

if(data.status === "SUCCESS"){

  document.getElementById("cameraPage").classList.add("hidden");
  document.getElementById("resultPage").classList.remove("hidden");

  document.getElementById("nama").innerText = window.nama;
  document.getElementById("gudang").innerText = window.gudang;

}else{
  alert("Server error: "+data.status);
}

}catch(e){
  alert("Gagal kirim data");
  console.log(e);
}

}

</script>

</body>
</html>
