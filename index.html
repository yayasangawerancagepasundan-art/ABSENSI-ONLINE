<!DOCTYPE html>
<html>
<body>

<button onclick="test()">TEST POST</button>

<script>
const URL = "https://script.google.com/macros/s/AKfycbznCmA9JKgrMSklIBvN8y7fpqGJt1jNSNUEu9hfGmCgGV5bMhAQPfzFqaB_leRqLis/exec";

async function test(){

  try{

    let res = await fetch(URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        uid:"TEST123"
      })
    });

    let text = await res.text();

    console.log("RESP:", text);
    alert(text);

  }catch(e){
    console.log("ERROR:", e);
    alert("GAGAL CONNECT");
  }

}
</script>
