<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI KARYAWAN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #f0f2f5;
      padding: 15px;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 10px;
    }

    .status {
      font-size: 22px;
      font-weight: bold;
      margin: 10px 0;
    }

    .success { color: green; }
    .keluar { color: orange; }
    .error { color: red; }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      font-size: 16px;
    }

    .label {
      text-align: left;
      width: 40%;
      font-weight: bold;
    }

    .value {
      text-align: left;
      width: 60%;
    }

    .camera {
      margin-top: 15px;
    }

    video, canvas {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #007bff;
      color: white;
      font-size: 16px;
    }

  </style>
</head>

<body>

<div class="card">

  <h2>ABSENSI</h2>

  <div id="status" class="status">Memproses...</div>

  <div class="row">
    <div class="label">Nama</div>
    <div class="value" id="nama">-</div>
  </div>

  <div class="row">
    <div class="label">Tanggal</div>
    <div class="value" id="tanggal">-</div>
  </div>

  <div class="row">
    <div class="label">Jam</div>
    <div class="value" id="jam">-</div>
  </div>

  <div class="row">
    <div class="label">Gudang</div>
    <div class="value" id="gudang">-</div>
  </div>

  <!-- CAMERA -->
  <div class="camera">
    <video id="video" autoplay></video>
    <button onclick="ambilFoto()">Ambil Foto</button>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");

const statusEl = document.getElementById("status");

if(!uid){
  statusEl.innerHTML = "<span class='error'>UID tidak ditemukan</span>";
}else{
  kirim(uid);
}

// =======================
// KIRIM KE SERVER
// =======================
async function kirim(uid){

  try {

    let res = await fetch("https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec?uid=" + uid);

    let data = await res.json();

    if(data.status === "OK"){

      let warna = (data.aksi === "MASUK") ? "success" : "keluar";

      statusEl.innerHTML = "<span class='"+warna+"'>ABSEN " + data.aksi + "</span>";

      document.getElementById("nama").innerText = data.nama;
      document.getElementById("gudang").innerText = data.gudang;

      let now = new Date();

      document.getElementById("tanggal").innerText =
        now.toLocaleDateString("id-ID");

      document.getElementById("jam").innerText =
        now.toLocaleTimeString("id-ID");

    } else {
      statusEl.innerHTML = "<span class='error'>Tidak terdaftar</span>";
    }

  } catch (err){
    statusEl.innerHTML = "<span class='error'>Server error</span>";
  }

}

// =======================
// CAMERA
// =======================
const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
  video.srcObject = stream;
});

// ambil foto
function ambilFoto(){
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.drawImage(video, 0, 0);

  let image = canvas.toDataURL("image/png");

  console.log("FOTO:", image);

  alert("Foto berhasil diambil (nanti bisa kirim ke server)");
}

// =======================
// AUTO RESET 10 DETIK
// =======================
setTimeout(() => {
  window.location.href = "https://yayasangawerancagepasundan-art.github.io/ABSENSI-ONLINE/";
}, 10000);

</script>

</body>
</html>
