<!DOCTYPE html>
<html>
<head>
  <title>Absensi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .hidden { display: none; }

    .btn {
      padding: 10px 16px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      color: white;
    }

    /* =========================
       RADAR STYLE
    ========================= */
    .radar {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 20px auto;
    }

    .ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
      opacity: 0.6;
    }

    .ring2 { animation-delay: 0.5s; }
    .ring3 { animation-delay: 1s; }

    .dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes pulse {
      0% { transform: scale(0.5); opacity: 0.8; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    video {
      width: 100%;
      border-radius: 10px;
    }

    img {
      width: 100px;
      border-radius: 10px;
      margin: 5px;
    }
  </style>
</head>

<body>

<!-- SCAN -->
<div id="scanPage">
  <h2>Absensi</h2>
  <p>UID: <span id="uid">-</span></p>
  <button class="btn" onclick="startScan()">Scan Kartu</button>
  <p id="status">Menunggu...</p>
</div>

<!-- LOCATION -->
<div id="locationPage" class="hidden">

  <h3>📍 Cek Lokasi</h3>

  <div class="radar">
    <div class="ring"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>
    <div class="dot"></div>
  </div>

  <p id="locationStatus">Mendeteksi lokasi...</p>
  <p id="jarakInfo"></p>

</div>

<!-- CAMERA -->
<div id="cameraPage" class="hidden">
  <h3>📸 Ambil Foto</h3>
  <video id="video" autoplay playsinline></video>
  <p id="cameraStatus">Arahkan wajah</p>
</div>

<!-- RESULT -->
<div id="resultPage" class="hidden">
  <h3>✅ Berhasil</h3>
  <p id="nama"></p>
  <p id="gudang"></p>
  <div>
    <img id="fotoDB">
    <img id="fotoSelfie">
  </div>
</div>

<script>

let stream;

/* RESET */
function resetUI() {
  document.getElementById("scanPage").classList.remove("hidden");
  document.getElementById("locationPage").classList.add("hidden");
  document.getElementById("cameraPage").classList.add("hidden");
  document.getElementById("resultPage").classList.add("hidden");

  document.getElementById("uid").innerText = "-";
  document.getElementById("status").innerText = "Menunggu...";
}

/* RESULT */
function showResult(data, foto) {
  document.getElementById("nama").innerText = data.nama;
  document.getElementById("gudang").innerText = data.gudang;
  document.getElementById("fotoDB").src = data.fotoDB;
  document.getElementById("fotoSelfie").src = foto;

  document.getElementById("cameraPage").classList.add("hidden");
  document.getElementById("resultPage").classList.remove("hidden");

  setTimeout(resetUI, 3000);
}

/* FOTO */
function ambilFoto(video) {
  let canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  let ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);

  let foto = canvas.toDataURL("image/jpeg");
  kirimData(foto);
}

/* FACE */
async function tungguWajah(video) {

  if (!("FaceDetector" in window)) {
    setTimeout(() => ambilFoto(video), 1500);
    return;
  }

  const detector = new FaceDetector();

  const interval = setInterval(async () => {
    const faces = await detector.detect(video);

    if (faces.length > 0) {
      clearInterval(interval);
      setTimeout(() => ambilFoto(video), 800);
    }
  }, 300);
}

/* KIRIM DATA */
async function kirimData(foto) {

  let res = await fetch("https://script.google.com/macros/s/AKfycbxQYvZIxsv-KrVS2k3wKtmAtq3iOQuoz2PErPJP764YIvOiKv8lvx8IcFO44-tQc4A/exec", {
    method: "POST",
    body: JSON.stringify({
      uid: window.uid,
      lat: window.lat,
      lng: window.lng,
      foto: foto
    })
  });

  let data = await res.json();

  stream.getTracks().forEach(t => t.stop());

  if (data.status === "SUCCESS") showResult(data, foto);
}

/* NFC */
async function startScan() {

  try {

    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("status").innerText = "Tempel kartu...";

    ndef.onreading = async (event) => {

      let uid = event.serialNumber;
      window.uid = uid;

      document.getElementById("uid").innerText = uid;

      /* PINDAH KE LOKASI */
      document.getElementById("scanPage").classList.add("hidden");
      document.getElementById("locationPage").classList.remove("hidden");

      navigator.geolocation.getCurrentPosition(async (pos) => {

        window.lat = pos.coords.latitude;
        window.lng = pos.coords.longitude;

        document.getElementById("locationStatus").innerText = "Validasi lokasi...";

        let res = await fetch("https://script.google.com/macros/s/AKfycbxQYvZIxsv-KrVS2k3wKtmAtq3iOQuoz2PErPJP764YIvOiKv8lvx8IcFO44-tQc4A/exec", {
          method: "POST",
          body: JSON.stringify({
            uid: uid,
            lat: window.lat,
            lng: window.lng,
            mode: "cek_lokasi"
          })
        });

        let data = await res.json();

        document.getElementById("jarakInfo").innerText =
          "Jarak: " + Math.round(data.jarak) + " meter";

        if (data.status !== "VALID") {
          document.getElementById("locationStatus").innerText = "❌ Diluar area / tidak valid";
          setTimeout(resetUI, 3000);
          return;
        }

        document.getElementById("locationStatus").innerText = "✅ Lokasi valid";

        setTimeout(async () => {

          document.getElementById("locationPage").classList.add("hidden");
          document.getElementById("cameraPage").classList.remove("hidden");

          stream = await navigator.mediaDevices.getUserMedia({ video: true });

          let video = document.getElementById("video");
          video.srcObject = stream;

          tungguWajah(video);

        }, 1000);

      });

    };

  } catch (err) {
    alert("HP tidak support NFC");
  }

}

</script>

</body>
</html>
