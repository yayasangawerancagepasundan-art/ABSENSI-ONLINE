<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI NFC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .status {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .red { color:red; }
    .green { color:green; }

    .loader {
      border: 6px solid #eee;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 15px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }

    .label { font-weight: bold; width: 40%; text-align:left; }
    .value { width: 60%; text-align:left; }

  </style>
</head>

<body>

<h2>ABSENSI</h2>

<div class="card">

  <div id="status" class="status red">Mencari lokasi...</div>

  <div class="loader" id="loader"></div>

  <div class="row"><div class="label">Nama</div><div id="nama" class="value">-</div></div>
  <div class="row"><div class="label">Tanggal</div><div id="tgl" class="value">-</div></div>
  <div class="row"><div class="label">Jam</div><div id="jam" class="value">-</div></div>
  <div class="row"><div class="label">Gudang</div><div id="gudang" class="value">-</div></div>
  <div class="row"><div class="label">Jarak</div><div id="jarak" class="value">-</div></div>

</div>

<script>

// ===== API BARU =====
const API = "https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

// ===== AMBIL UID =====
const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");

if(!uid){
  document.getElementById("status").innerText = "UID tidak ditemukan";
}

// ===== HITUNG JARAK =====
function hitungJarak(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;

  const a =
    Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)*Math.sin(dLon/2);

  const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return R*c;
}

// ===== TRACKING GPS REALTIME =====
let sudahKirim = false;

navigator.geolocation.watchPosition(async pos => {

  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;

  document.getElementById("status").innerText = "Menghitung jarak...";

  try{

    let res = await fetch(API + "?uid=" + uid + "&lat=" + lat + "&lng=" + lng);
    let data = await res.json();

    // ===== LUAR AREA =====
    if(data.status == "OUTSIDE"){
      document.getElementById("status").innerText = "Diluar Area";
      document.getElementById("status").className = "status red";
      document.getElementById("jarak").innerText = data.jarak + " m";
      return;
    }

    // ===== DALAM AREA =====
    if(data.status == "OK" && !sudahKirim){

      sudahKirim = true;

      document.getElementById("loader").style.display = "none";

      document.getElementById("status").innerText = "ABSEN " + data.aksi;
      document.getElementById("status").className = "status green";

      document.getElementById("nama").innerText = data.nama;
      document.getElementById("gudang").innerText = data.gudang;

      const now = new Date();
      document.getElementById("tgl").innerText = now.toLocaleDateString("id-ID");
      document.getElementById("jam").innerText = now.toLocaleTimeString("id-ID");

      // auto close / reset
      setTimeout(()=>{
        window.location.href = window.location.pathname;
      },10000);

    }

  }catch(e){
    document.getElementById("status").innerText = "Gagal koneksi";
  }

},{
  enableHighAccuracy:true,
  maximumAge:0,
  timeout:10000
});

</script>

</body>
</html>
