<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABSENSI</title>

<style>
body{
  background:black;
  color:#00ff66;
  font-family:monospace;
  text-align:center;
}
.location-icon{
  font-size:80px;
  margin:20px;
}
.progress-container{
  width:80%;
  height:20px;
  background:#222;
  border-radius:10px;
  margin:10px auto;
}
.progress-bar{
  height:100%;
  width:0%;
  background:lime;
}
button{
  width:80%;
  padding:10px;
  margin-top:10px;
  transition:0.15s;
}
button:active{
  transform:scale(0.95);
  background:#ddd;
}
#infoPage,#thankPage,#warningPage,#dashboardPage,#cameraPage{
  display:none;
  margin:10px;
  padding:10px;
  border-radius:10px;
}
#infoPage,#thankPage,#dashboardPage,#cameraPage{
  background:white;
  color:black;
}
#warningPage{
  background:black;
  color:red;
}
.rowBox{
  display:flex;
  justify-content:space-between;
  background:white;
  padding:12px;
  border-radius:8px;
  margin-bottom:10px;
  border:1px solid #ccc;
}
video,img{
  width:100%;
  max-width:300px;
  border-radius:10px;
}

/* LOADER */
.loader{
  display:none;
  margin:15px auto;
  width:60px;
  height:60px;
  position:relative;
}
.loader span{
  position:absolute;
  width:6px;
  height:18px;
  background:#999;
  left:50%;
  top:50%;
  transform-origin:center -20px;
  border-radius:3px;
  animation:fade 1.2s linear infinite;
}
@keyframes fade{
  0%{opacity:1;}
  100%{opacity:0.1;}
}

/* DASHBOARD */
#dashboardPage{
  animation:fadeIn 0.4s ease;
}
@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
#dashWaktu{
  font-size:20px;
  font-weight:bold;
  color:#00cc66;
}
</style>
</head>

<body>

<h2>ABSENSI</h2>

<div id="mainPage">
  <div class="location-icon">📍</div>
  <div id="status">MENCARI LOKASI...</div>
  <div>Jarak: <span id="jarak">-</span></div>
  <div>Akurasi: <span id="akurasi">-</span></div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <button id="btnAbsen" disabled>ABSEN</button>
  <div class="loader" id="loader"></div>
</div>

<div id="infoPage">
<h3>INFORMASI</h3>
<div>Nama: <span id="nama"></span></div>
<div>Tanggal: <span id="tanggal"></span></div>
<div>Waktu: <span id="waktu"></span></div>
<div>Lokasi: <span id="lokasi"></span></div>
<div>Status: <span id="statusAbsensi"></span></div>

<hr>
<h3>SELFIE WAJIB</h3>
<img id="preview" style="display:none;">
<button id="btnFoto">AMBIL FOTO</button>
<button id="confirm" disabled>KONFIRMASI</button>
</div>

<div id="cameraPage">
<h3>AMBIL FOTO</h3>
<video id="video" autoplay></video>
<canvas id="canvas" style="display:none;"></canvas>
<button id="takePhoto">AMBIL FOTO</button>
<button id="retake" style="display:none;">ULANGI</button>
<button id="backInfo">KEMBALI</button>
</div>

<div id="warningPage">
<h1>⚠️</h1>
<h2 id="warningText"></h2>
<p>Menutup dalam <span id="warningCountdown">5</span> detik</p>
</div>

<div id="thankPage">
<h2>TERIMAKASIH</h2>
<p>Menutup dalam <span id="countdown">10</span> detik</p>
</div>

<div id="dashboardPage">
  <h3>Dashboard</h3>
  <div class="rowBox"><div>Tanggal</div><div id="dashTanggal">-</div></div>
  <div class="rowBox"><div>Waktu</div><div id="dashWaktu">-</div></div>
  <div class="rowBox"><div>Nama</div><div id="dashNama">-</div></div>
  <div class="rowBox"><div>Total Hari</div><div id="dashHari">-</div></div>
  <div class="rowBox"><div>Total Jam</div><div id="dashJam">-</div></div>
</div>

<script>

// ===== CODE ASLI KAMU (TIDAK DIUBAH) =====
const URL="https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";
const params=new URLSearchParams(location.search);
const UID=params.get("uid")||"";

// loader dll tetap
const loader=document.getElementById("loader");
for(let i=0;i<12;i++){
  let s=document.createElement("span");
  s.style.transform=`rotate(${i*30}deg) translate(-50%, -50%)`;
  s.style.animationDelay=`${i*0.1}s`;
  loader.appendChild(s);
}

// GPS dll tetap
const TARGET_LAT=-6.2341459;
const TARGET_LNG=106.4997284;
const RADIUS=50;

const btnAbsen=document.getElementById("btnAbsen");
const progressBar=document.getElementById("progressBar");

const jarak=document.getElementById("jarak");
const akurasi=document.getElementById("akurasi");
const status=document.getElementById("status");

const mainPage=document.getElementById("mainPage");
const infoPage=document.getElementById("infoPage");
const warningPage=document.getElementById("warningPage");
const thankPage=document.getElementById("thankPage");
const dashboardPage=document.getElementById("dashboardPage");

function dist(a,b,c,d){
  const R=6371000;
  let dLat=(c-a)*Math.PI/180;
  let dLon=(d-b)*Math.PI/180;
  let x=Math.sin(dLat/2)**2+
  Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
  Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

let lat=0,lng=0;

navigator.geolocation.watchPosition(p=>{
  lat=p.coords.latitude;
  lng=p.coords.longitude;
  let d=dist(lat,lng,TARGET_LAT,TARGET_LNG);

  jarak.innerText=Math.round(d)+" m";
  akurasi.innerText="± "+Math.round(p.coords.accuracy)+" m";

  let persen=100-(d/RADIUS*100);
  persen=Math.max(0,Math.min(100,persen));
  progressBar.style.width=persen+"%";

  if(d<=RADIUS){
    status.innerText="LOKASI VALID";
    btnAbsen.disabled=false;
  }
});

// ABSEN tetap
btnAbsen.onclick=()=>{
  loader.style.display="block";
  btnAbsen.disabled=true;

  fetch(`${URL}?uid=${UID}&lat=${lat}&lng=${lng}`)
  .then(r=>r.json())
  .then(data=>{
    loader.style.display="none";

    if(data.status!="OK"){
      mainPage.style.display="none";
      warningPage.style.display="block";
      let txt=document.getElementById("warningText");

      if(data.pesan?.includes("3")){
        txt.innerText="BELUM 3 JAM";
      }else{
        txt.innerText="BELUM 10 MENIT";
      }
      return;
    }

    mainPage.style.display="none";
    infoPage.style.display="block";

    document.getElementById("nama").innerText=data.nama;
    document.getElementById("lokasi").innerText=data.gudang;
    document.getElementById("statusAbsensi").innerText=data.aksi;

    let now=new Date();
    document.getElementById("tanggal").innerText=now.toLocaleDateString();
    document.getElementById("waktu").innerText=now.toLocaleTimeString();
  });
};

// ===== TAMBAHAN ROLE (TANPA GANGGU) =====
(function(){
  if(!UID) return;

  fetch(`${URL}?uid=${UID}&mode=check`)
  .then(r=>r.json())
  .then(data=>{
    if(data.status!=="OK") return;

    const role=data.role||"User";
    if(role==="User") return;

    document.body.innerHTML="";

    if(role==="Admin"){
      document.body.innerHTML="<h2>DASHBOARD ADMIN</h2>";
    }else if(role==="Direktur"){
      document.body.innerHTML="<h2>DASHBOARD DIREKTUR</h2>";
    }else if(role==="Teknisi"){
      document.body.innerHTML="<h2>DASHBOARD TEKNISI</h2>";
    }
  });
})();

</script>

</body>
</html>
