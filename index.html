<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi NFC</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

/* PAGE */
.page { display:none; padding:20px; }
.active { display:block; }

/* BUTTON */
.btn {
  background:#22c55e;
  padding:10px 20px;
  border-radius:8px;
  border:none;
  color:white;
}

/* RADAR */
.radar-wrap {
  margin-top:30px;
}

.circle {
  width:200px;
  height:200px;
  border:2px solid #22c55e;
  border-radius:50%;
  margin:auto;
  position:relative;
}

.scan {
  width:2px;
  height:100%;
  background:#22c55e;
  position:absolute;
  left:50%;
  transform-origin:bottom;
}

/* CAMERA */
video {
  width:100%;
  border-radius:10px;
  background:black;
}

/* RESULT */
img {
  width:100px;
  border-radius:10px;
  margin:5px;
}
</style>
</head>

<body>

<!-- ================= SCAN ================= -->
<div id="scanPage" class="page active">

  <h2><i class="fa-solid fa-id-card"></i> Absensi</h2>

  <p>UID: <span id="uid">-</span></p>

  <button class="btn" onclick="startScan()">Scan Kartu</button>

  <p id="status">Menunggu...</p>

</div>

<!-- ================= LOKASI ================= -->
<div id="locationPage" class="page">

  <h2>📍 Cek Lokasi</h2>

  <div class="radar-wrap">
    <div class="circle">
      <div class="scan" id="radar"></div>
    </div>
  </div>

  <p id="locationStatus">Mengambil lokasi...</p>
  <p id="jarakInfo"></p>

</div>

<!-- ================= CAMERA ================= -->
<div id="cameraPage" class="page">

  <h2>📸 Ambil Foto</h2>

  <video id="video" autoplay playsinline></video>

  <p id="cameraStatus">Arahkan wajah ke kamera</p>

</div>

<!-- ================= RESULT ================= -->
<div id="resultPage" class="page">

  <h2>✅ Berhasil</h2>

  <p id="nama"></p>
  <p id="gudang"></p>

  <div>
    <img id="fotoDB">
    <img id="fotoSelfie">
  </div>

</div>

<script>

// ================= CONFIG =================
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxQYvZIxsv-KrVS2k3wKtmAtq3iOQuoz2PErPJP764YIvOiKv8lvx8IcFO44-tQc4A/exec";

let stream;
let radarInterval;

// ================= NAVIGATION =================
function show(page){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(page).classList.add("active");
}

// ================= RESET =================
function resetUI(){
  show("scanPage");
  document.getElementById("uid").innerText = "-";
  document.getElementById("status").innerText = "Menunggu...";
}

// ================= RADAR =================
function startRadar(){
  let angle = 0;
  radarInterval = setInterval(()=>{
    angle += 5;
    document.getElementById("radar").style.transform = "rotate("+angle+"deg)";
  },30);
}

function stopRadar(){
  clearInterval(radarInterval);
}

// ================= NFC =================
async function startScan(){

  try{
    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("status").innerText = "Tempel kartu...";

    ndef.onreading = (event)=>{

      window.uid = event.serialNumber;
      document.getElementById("uid").innerText = window.uid;

      // pindah ke lokasi
      show("locationPage");
      cekLokasi();

    };

  }catch{
    alert("HP tidak support NFC");
  }
}

// ================= LOKASI =================
function cekLokasi(){

  startRadar();
  document.getElementById("locationStatus").innerText = "Mengambil lokasi...";

  navigator.geolocation.getCurrentPosition(async(pos)=>{

    window.lat = pos.coords.latitude;
    window.lng = pos.coords.longitude;

    document.getElementById("locationStatus").innerText = "Validasi lokasi...";

    try{

      const res = await fetch(
        URL_SCRIPT + "?uid="+window.uid+"&lat="+window.lat+"&lng="+window.lng
      );

      const text = await res.text();
      console.log(text);

      let data;
      try { data = JSON.parse(text); } catch {}

      // ❌ tidak terdaftar
      if(text.includes("NOT_REGISTERED")){
        stopRadar();
        alert("Kartu tidak terdaftar");
        resetUI();
        return;
      }

      // ❌ diluar area
      if(data && data.status === "OUT_OF_RANGE"){
        stopRadar();
        document.getElementById("jarakInfo").innerText =
          "Jarak: "+Math.round(data.jarak)+" meter";

        alert("Diluar area");
        resetUI();
        return;
      }

      // ✅ lanjut kamera
      stopRadar();
      show("cameraPage");
      startCamera();

    }catch(err){
      stopRadar();
      alert("Gagal koneksi server");
      resetUI();
    }

  }, ()=>{
    stopRadar();
    alert("GPS tidak aktif");
    resetUI();
  });

}

// ================= CAMERA =================
async function startCamera(){

  try{
    stream = await navigator.mediaDevices.getUserMedia({video:true});
    const video = document.getElementById("video");
    video.srcObject = stream;

    tungguWajah(video);

  }catch{
    alert("Kamera gagal");
    resetUI();
  }
}

// ================= FACE DETECT =================
async function tungguWajah(video){

  if(!("FaceDetector" in window)){
    setTimeout(()=>ambilFoto(video),2000);
    return;
  }

  const detector = new FaceDetector();

  const interval = setInterval(async()=>{

    const faces = await detector.detect(video);

    if(faces.length > 0){
      clearInterval(interval);
      ambilFoto(video);
    }

  },500);
}

// ================= FOTO =================
function ambilFoto(video){

  let canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  let ctx = canvas.getContext("2d");
  ctx.drawImage(video,0,0);

  let foto = canvas.toDataURL("image/jpeg");

  kirimData(foto);
}

// ================= KIRIM =================
async function kirimData(foto){

  document.getElementById("cameraStatus").innerText = "Mengirim...";

  let res = await fetch(URL_SCRIPT,{
    method:"POST",
    body: JSON.stringify({
      uid: window.uid,
      lat: window.lat,
      lng: window.lng,
      foto: foto
    })
  });

  let data = await res.json();

  stream.getTracks().forEach(t=>t.stop());

  if(data.status === "SUCCESS"){
    tampilHasil(data, foto);
  }else{
    alert("Gagal absensi");
    resetUI();
  }
}

// ================= RESULT =================
function tampilHasil(data, foto){

  show("resultPage");

  document.getElementById("nama").innerText = "Nama: "+data.nama;
  document.getElementById("gudang").innerText = "Gudang: "+data.gudang;

  document.getElementById("fotoDB").src = data.fotoDB;
  document.getElementById("fotoSelfie").src = foto;

  setTimeout(resetUI,3000);
}

</script>

</body>
</html>
