<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI NFC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h2 {
      margin-top: 20px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      background: green;
      color: white;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
    }

    .box {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      text-align: left;
    }
  </style>
</head>

<body>

<h2>ABSENSI NFC</h2>

<button onclick="scanNFC()">SCAN KARTU</button>

<div class="box">
  <p id="status">Status: Menunggu scan...</p>
  <p id="uid">ID: -</p>
  <p id="server">Server: -</p>
</div>

<script>

async function scanNFC() {

  if (!('NDEFReader' in window)) {
    alert("HP tidak support NFC Web");
    return;
  }

  try {
    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("status").innerText = "Dekatkan kartu ke HP...";

    ndef.onreading = async (event) => {

      let uid = "";

      // ambil isi NDEF (bukan UID asli)
      for (const record of event.message.records) {
        if (record.recordType === "text") {
          const textDecoder = new TextDecoder();
          uid = textDecoder.decode(record.data);
        }
      }

      if (!uid) {
        document.getElementById("status").innerText = "Kartu kosong!";
        return;
      }

      document.getElementById("uid").innerText = "ID: " + uid;
      document.getElementById("status").innerText = "Mengirim ke server...";

      // ambil lokasi
      navigator.geolocation.getCurrentPosition(async function(pos) {

        let lat = pos.coords.latitude;
        let lng = pos.coords.longitude;

        try {

          let res = await fetch("https://script.google.com/macros/s/AKfycbxQYvZIxsv-KrVS2k3wKtmAtq3iOQuoz2PErPJP764YIvOiKv8lvx8IcFO44-tQc4A/exec", {
            method: "POST",
            body: JSON.stringify({
              uid: uid,
              lat: lat,
              lng: lng
            })
          });

          let data = await res.json();

          document.getElementById("status").innerText = "Berhasil";
          document.getElementById("server").innerText = JSON.stringify(data);

        } catch (err) {
          document.getElementById("status").innerText = "Gagal kirim ke server";
        }

      }, function() {
        document.getElementById("status").innerText = "Gagal ambil lokasi";
      });

    };

  } catch (error) {
    alert("Error NFC: " + error);
  }
}

</script>

</body>
</html>
