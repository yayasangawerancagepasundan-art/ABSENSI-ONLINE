<!DOCTYPE html>
<html>
<head>
  <title>RFID V9</title>
</head>
<body>

<h2>SCAN RFID</h2>

<input id="uid" placeholder="Scan UID">
<button onclick="kirim()">SCAN</button>

<pre id="hasil"></pre>

<script>
function kirim(){

  let uid = document.getElementById("uid").value;

  let url = "https://script.google.com/macros/s/AKfycbyrlWCsEXuAFpv0qdAw7JLclCjjooQ3MT3wg3LKgT0CxWEa9mBGOw_9QF83mrR3toY/exec?uid=" + encodeURIComponent(uid);

  fetch(url, {
    method: "GET",
    mode: "cors"
  })
  .then(res => res.json())
  .then(data => {

    let tampil = "";

    if(data.status === "OK"){
      tampil += "✅ NAMA   : " + data.nama + "\n";
      tampil += "📌 JABATAN: " + data.jabatan + "\n";
      tampil += "🏢 GUDANG : " + data.gudang + "\n";
    } else {
      tampil = "❌ " + data.status;
    }

    document.getElementById("hasil").innerText = tampil;

  })
  .catch(err => {
    document.getElementById("hasil").innerText = "ERROR: " + err;
  });

}
</script>

</body>
</html>
