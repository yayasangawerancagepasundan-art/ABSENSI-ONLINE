<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi NFC</title>

<style>
body { font-family: Arial; text-align:center; background:#f5f5f5; }
.box { max-width:400px; margin:auto; padding:20px; }
input, button { width:90%; padding:12px; margin:5px; font-size:16px; }
.card { background:#fff; padding:15px; border-radius:10px; margin-top:15px; }
img { width:100px; border-radius:10px; }
</style>
</head>

<body>

<div class="box">
<h2>ABSENSI KARYAWAN</h2>

<input id="uid" placeholder="Scan / Input UID">
<button onclick="absen()">ABSEN</button>
<button onclick="scanNFC()">📶 Scan NFC</button>

<p id="status"></p>

<div id="hasil" class="card" style="display:none;">
<img id="foto">
<h3 id="nama"></h3>
<p id="jabatan"></p>
<p id="info"></p>
</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxEzs-krfZ8i12sbVaw5bo_HQEY7HNKxcIXpBmcdDpNvR8ckTgypRqz46gmX1590EM/exec";

async function absen() {
  let uid = document.getElementById("uid").value;
  let status = document.getElementById("status");

  if (!uid) {
    status.innerHTML = "❌ UID kosong";
    return;
  }

  status.innerHTML = "📍 Mengambil lokasi...";

  navigator.geolocation.getCurrentPosition(async (pos) => {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    status.innerHTML = "⏳ Proses...";

    try {
      let res = await fetch(`${API_URL}?uid=${uid}&lat=${lat}&lng=${lng}`);
      let data = await res.json();

      if (data.status === "out_of_range") {
        status.innerHTML = "❌ Di luar radius (" + data.jarak + " m)";
        return;
      }

      if (data.status === "blocked") {
        status.innerHTML = "❌ " + data.message;
        return;
      }

      if (data.status === "success") {

        status.innerHTML = "✅ Berhasil";

        document.getElementById("hasil").style.display = "block";
        document.getElementById("nama").innerText = data.nama;
        document.getElementById("jabatan").innerText = data.jabatan;
        document.getElementById("foto").src = data.foto;
        document.getElementById("info").innerText =
          data.tipe + " | " + data.waktu;

      } else {
        status.innerHTML = "❌ RFID tidak ditemukan";
      }

    } catch {
      status.innerHTML = "❌ Error koneksi";
    }

  });
}

// NFC
async function scanNFC() {
  if ('NDEFReader' in window) {
    const reader = new NDEFReader();
    await reader.scan();

    reader.onreading = event => {
      document.getElementById("uid").value = event.serialNumber;
    };
  } else {
    alert("HP tidak support NFC");
  }
}
</script>

</body>
</html>
