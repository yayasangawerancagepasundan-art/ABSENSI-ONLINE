<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi</title>

<style>
body{background:#0b1a2e;color:white;text-align:center;font-family:Arial}
.hidden{display:none}

.radar-box{
  position:relative;
  width:220px;
  height:220px;
  margin:40px auto;
  border-radius:50%;
  border:2px solid #22c55e;
  overflow:hidden;
}

.radar-line{
  position:absolute;
  width:50%;
  height:2px;
  background:#22c55e;
  top:50%;
  left:50%;
  transform-origin:left center;
  animation:spin 2s linear infinite;
}

@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

.dot{
  width:12px;height:12px;background:#22c55e;border-radius:50%;
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
}

.target{
  width:10px;height:10px;background:red;border-radius:50%;
  position:absolute;top:20%;left:70%;
}

button{
  padding:10px 18px;
  background:#22c55e;
  border:none;border-radius:8px;color:white;
}

video{width:90%;border-radius:10px;background:black}
</style>
</head>

<body>

<div id="scanPage">
<h2>ABSENSI</h2>
<p>UID: <span id="uid">-</span></p>
<button onclick="startScan()">SCAN</button>
<p id="status">Menunggu...</p>
</div>

<div id="locationPage" class="hidden">
<h3>📍 Cek Lokasi</h3>
<div class="radar-box">
  <div class="radar-line"></div>
  <div class="dot"></div>
  <div class="target"></div>
</div>
<p id="locStatus">Mengambil lokasi...</p>
<p id="jarak">-</p>
</div>

<div id="cameraPage" class="hidden">
<h3>📸 Kamera</h3>
<video id="video" autoplay playsinline></video>
</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbznCmA9JKgrMSklIBvN8y7fpqGJt1jNSNUEu9hfGmCgGV5bMhAQPfzFqaB_leRqLis/exec";

let stream;

/* SCAN */
async function startScan(){
  const ndef = new NDEFReader();
  await ndef.scan();

  ndef.onreading = (e)=>{
    window.uid = e.serialNumber;

    document.getElementById("uid").innerText = window.uid;

    document.getElementById("scanPage").classList.add("hidden");
    document.getElementById("locationPage").classList.remove("hidden");

    getLocation();
  }
}

/* LOCATION */
function getLocation(){

navigator.geolocation.getCurrentPosition(async (pos)=>{

  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;

  window.lat = lat;
  window.lng = lng;

  document.getElementById("locStatus").innerText="Cek server...";

  let res = await fetch(URL + "?uid=" + window.uid + "&lat=" + lat + "&lng=" + lng);
  let data = await res.json();

  document.getElementById("jarak").innerText="Jarak: "+Math.round(data.jarak)+" m";

  if(data.status==="IN_RANGE"){

    window.nama = data.nama;
    window.gudang = data.gudang;

    document.getElementById("locStatus").innerText="VALID ✔";

    setTimeout(openCamera,1000);

  }else{
    document.getElementById("locStatus").innerText="Diluar area ❌";
  }

});

}

/* CAMERA */
async function openCamera(){

document.getElementById("locationPage").classList.add("hidden");
document.getElementById("cameraPage").classList.remove("hidden");

stream = await navigator.mediaDevices.getUserMedia({video:true});

let video = document.getElementById("video");
video.srcObject = stream;

setTimeout(()=>takePhoto(video),2000);

}

/* FOTO */
function takePhoto(video){

let canvas = document.createElement("canvas");
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

let ctx = canvas.getContext("2d");
ctx.drawImage(video,0,0);

let foto = canvas.toDataURL("image/jpeg");

sendData(foto);

}

/* KIRIM */
async function sendData(foto){

let res = await fetch(URL,{
  method:"POST",
  headers:{
    "Content-Type":"application/json"
  },
  body:JSON.stringify({
    uid:window.uid,
    nama:window.nama,
    gudang:window.gudang,
    lat:window.lat,
    lng:window.lng,
    foto:foto
  })
});

let data = await res.json();

alert(data.status);

stream.getTracks().forEach(t=>t.stop());

}

</script>

</body>
</html>
