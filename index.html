<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABSENSI</title>

<style>
body{
  background:black;
  color:#00ff66;
  font-family:monospace;
  text-align:center;
}

button{
  width:80%;
  padding:10px;
  margin-top:10px;
}

button:disabled{opacity:0.5;}

.page{display:none;}
#mainPage{display:block;}

video,img{
  width:100%;
  max-width:300px;
}
</style>
</head>

<body>

<h2>ABSENSI</h2>

<!-- MAIN -->
<div id="mainPage" class="page">
  <div>📍 <span id="status">MENCARI...</span></div>
  <div>Jarak: <span id="jarak">-</span></div>
  <div>Akurasi: <span id="akurasi">-</span></div>

  <button id="btnAbsen" disabled>ABSEN</button>
</div>

<!-- INFO -->
<div id="infoPage" class="page">
  <h3>INFORMASI</h3>

  <div>Nama: <span id="nama"></span></div>
  <div>Status: <span id="statusAbsensi"></span></div>

  <hr>

  <img id="preview" style="display:none;">

  <button id="btnFoto">AMBIL FOTO</button>
  <button id="confirm" disabled>KONFIRMASI</button>
</div>

<!-- CAMERA PAGE -->
<div id="cameraPage" class="page">
  <h3>AMBIL FOTO</h3>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <button id="takePhoto">AMBIL FOTO</button>
  <button id="cancelFoto">BATAL</button>
</div>

<!-- WARNING -->
<div id="warningPage" class="page">
  <h2 id="warningText"></h2>
</div>

<!-- THANK -->
<div id="thankPage" class="page">
  <h2>TERIMAKASIH</h2>
  <div id="countdown">10</div>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage" class="page">
  <div>📅 <span id="tgl"></span></div>
  <div>⏰ <span id="jam"></span></div>

  <div>Nama: <span id="dashNama"></span></div>
  <div>Hari: <span id="dashHari"></span></div>
  <div>Jam: <span id="dashJam"></span></div>
</div>

<script>

// ===== CONFIG (TIDAK DIUBAH)
const URL="https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";
const UID=new URLSearchParams(location.search).get("uid")||"";

// ===== PAGE CONTROL (TAMBAHAN)
const pages=["mainPage","infoPage","cameraPage","warningPage","thankPage","dashboardPage"];

function show(p){
  pages.forEach(x=>document.getElementById(x).style.display="none");
  document.getElementById(p).style.display="block";
}

// ===== CAMERA (TAMBAHAN SAJA)
let stream=null;

function startCamera(){
  navigator.mediaDevices.getUserMedia({video:true})
  .then(s=>{
    stream=s;
    video.srcObject=s;
  });
}

function stopCamera(){
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }
}

// ===== GPS (PAKAI PUNYAMU - INI HANYA PLACEHOLDER)
// JANGAN HAPUS LOGIC GPS LAMAMU
navigator.geolocation.watchPosition(p=>{
  status.innerText="LOKASI VALID";
  btnAbsen.disabled=false;

  jarak.innerText="OK";
  akurasi.innerText="OK";
});

// ===== ABSEN (TETAP)
btnAbsen.onclick=()=>{
  fetch(`${URL}?uid=${UID}&lat=0&lng=0`)
  .then(r=>r.json())
  .then(d=>{

    if(d.status!="OK"){
      show("warningPage");
      warningText.innerText=d.pesan;
      return;
    }

    nama.innerText=d.nama;
    statusAbsensi.innerText=d.aksi;

    show("infoPage");

    // reset state
    confirm.disabled=true;
    preview.style.display="none";
  });
};

// ===== MASUK CAMERA PAGE
btnFoto.onclick=()=>{
  show("cameraPage");
  startCamera();
};

// ===== AMBIL FOTO
takePhoto.onclick=()=>{

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  canvas.getContext("2d").drawImage(video,0,0);

  preview.src=canvas.toDataURL("image/jpeg");
  preview.style.display="block";

  stopCamera();

  show("infoPage");

  confirm.disabled=false;
};

// ===== BATAL FOTO
cancelFoto.onclick=()=>{
  stopCamera();
  show("infoPage");
};

// ===== KONFIRMASI
confirm.onclick=()=>{
  show("thankPage");

  let s=10;
  let t=setInterval(()=>{
    s--;
    countdown.innerText=s;

    if(s<=0){
      clearInterval(t);
      showDashboard();
    }
  },1000);
};

// ===== DASHBOARD
function showDashboard(){
  show("dashboardPage");

  fetch(`${URL}?mode=dashboard&uid=${UID}`)
  .then(r=>r.json())
  .then(d=>{
    dashNama.innerText=d.nama;
    dashHari.innerText=d.totalHari;
    dashJam.innerText=d.totalJam;
  });

  setInterval(()=>{
    let n=new Date();
    tgl.innerText=n.toLocaleDateString();
    jam.innerText=n.toLocaleTimeString();
  },1000);
}

</script>

</body>
</html>
