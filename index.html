<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI NFC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      color: white;
      border: none;
      border-radius: 10px;
      margin-top: 15px;
    }

    #btnScan {
      background: green;
    }

    #btnKirim {
      background: blue;
      display: none;
    }

    .box {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      text-align: left;
    }
  </style>
</head>

<body>

<h2>ABSENSI NFC</h2>

<button id="btnScan" onclick="scanNFC()">SCAN KARTU</button>

<button id="btnKirim" onclick="kirimData()">KONFIRMASI</button>

<div class="box">
  <p id="status">Status: Menunggu scan...</p>
  <p id="uid">ID: -</p>
  <p id="server">Server: -</p>
</div>

<script>

let uidTerscan = "";
let ndef = null;

// parsing text NFC
function parseTextRecord(record) {
  const data = new Uint8Array(record.data);
  const textDecoder = new TextDecoder();
  const langLength = data[0] & 0x3F;
  return textDecoder.decode(data.slice(1 + langLength));
}

// scan NFC
async function scanNFC() {

  if (!('NDEFReader' in window)) {
    alert("HP tidak support NFC Web");
    return;
  }

  try {
    ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("status").innerText = "Tempelkan kartu...";

    ndef.onreading = (event) => {

      let rawText = "";

      for (const record of event.message.records) {
        if (record.recordType === "text") {
          rawText = parseTextRecord(record);
        }
      }

      uidTerscan = rawText.replace(/[^0-9]/g, "");

      if (!uidTerscan) {
        document.getElementById("uid").innerText = "UID: GAGAL BACA";
        document.getElementById("status").innerText = "Scan ulang";
        return;
      }

      document.getElementById("uid").innerText = "UID: " + uidTerscan;
      document.getElementById("status").innerText = "Klik KONFIRMASI";

      // STOP scan biar tidak double
      ndef.onreading = null;

      document.getElementById("btnKirim").style.display = "block";
    };

  } catch (error) {
    alert("Error NFC: " + error);
  }
}

// kirim ke server
async function kirimData() {

  if (!uidTerscan) {
    alert("Belum ada UID");
    return;
  }

  document.getElementById("status").innerText = "Kirim ke server...";

  try {
    let res = await fetch("https://script.google.com/macros/s/AKfycbyrlWCsEXuAFpv0qdAw7JLclCjjooQ3MT3wg3LKgT0CxWEa9mBGOw_9QF83mrR3toY/exec?uid=" + uidTerscan);

    let data = await res.json();

    if (data.status === "OK") {
      document.getElementById("server").innerText =
        "Nama: " + data.nama + "\nStatus: " + data.aksi;

      document.getElementById("status").innerText = "Berhasil";
    } else {
      document.getElementById("status").innerText = "Gagal: " + data.message;
    }

  } catch (err) {
    document.getElementById("status").innerText = "Gagal koneksi";
  }

  // reset
  uidTerscan = "";
  document.getElementById("btnKirim").style.display = "none";
}

</script>

</body>
</html>
