<!DOCTYPE html>
<html>
<head>
  <title>Absensi NFC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .hidden { display: none; }

    .btn {
      padding: 10px 16px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
    }

    /* =========================
       RADAR
    ========================= */
    .radar {
      width: 200px;
      height: 200px;
      border: 2px solid #22c55e;
      border-radius: 50%;
      position: relative;
      margin: 30px auto;
      overflow: hidden;
    }

    .scan {
      width: 100%;
      height: 100%;
      position: absolute;
      background: conic-gradient(
        rgba(34,197,94,0.8),
        rgba(34,197,94,0.2),
        transparent
      );
      border-radius: 50%;
      animation: scanRotate 2s linear infinite;
    }

    .wave {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid rgba(34,197,94,0.3);
      border-radius: 50%;
      animation: wavePulse 2s infinite;
    }

    .radar::after {
      content: "";
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes scanRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes wavePulse {
      0% { transform: scale(0.5); opacity: 0.7; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    video {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }

    img {
      width: 100px;
      border-radius: 10px;
      margin: 5px;
    }
  </style>
</head>

<body>

<!-- =========================
   PAGE 1: SCAN
========================= -->
<div id="scanPage">
  <h2><i class="fa-solid fa-id-card"></i> Absensi</h2>
  <p>UID: <span id="uid">-</span></p>
  <button class="btn" onclick="startScan()">Scan Kartu</button>
  <p id="status">Menunggu...</p>
</div>

<!-- =========================
   PAGE 2: LOCATION
========================= -->
<div id="locationPage" class="hidden">
  <h3>📍 Cek Lokasi</h3>

  <div class="radar" id="radarBox">
    <div class="scan"></div>
    <div class="wave"></div>
  </div>

  <p id="locationStatus">Mengambil lokasi...</p>
  <p id="jarakInfo"></p>
</div>

<!-- =========================
   PAGE 3: CAMERA
========================= -->
<div id="cameraPage" class="hidden">
  <h3>📸 Ambil Foto</h3>
  <video id="video" autoplay playsinline></video>
  <p id="cameraStatus">Arahkan wajah ke kamera</p>

  <!-- tombol backup -->
  <button class="btn" onclick="ambilFoto(document.getElementById('video'))">
    Ambil Manual
  </button>
</div>

<!-- =========================
   PAGE 4: RESULT
========================= -->
<div id="resultPage" class="hidden">
  <h3>✅ Berhasil</h3>
  <p id="nama"></p>
  <p id="gudang"></p>

  <div>
    <img id="fotoDB">
    <img id="fotoSelfie">
  </div>
</div>

<script>

let stream;

/* =========================
   RESET UI
========================= */
function resetUI() {
  document.getElementById("scanPage").classList.remove("hidden");
  document.getElementById("locationPage").classList.add("hidden");
  document.getElementById("cameraPage").classList.add("hidden");
  document.getElementById("resultPage").classList.add("hidden");

  document.getElementById("uid").innerText = "-";
}

/* =========================
   SCAN NFC
========================= */
async function startScan() {

  try {

    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("status").innerText = "Tempel kartu...";

    ndef.onreading = async (event) => {

      let uid = event.serialNumber;
      window.uid = uid;

      document.getElementById("uid").innerText = uid;

      // pindah ke lokasi
      document.getElementById("scanPage").classList.add("hidden");
      document.getElementById("locationPage").classList.remove("hidden");

      // FIX radar refresh
      const radar = document.getElementById("radarBox");
      radar.style.display = "none";
      setTimeout(() => radar.style.display = "block", 50);

      ambilLokasi();

    };

  } catch (err) {
    alert("HP tidak support NFC");
  }

}

/* =========================
   AMBIL LOKASI
========================= */
function ambilLokasi() {

  navigator.geolocation.getCurrentPosition(async (pos) => {

    window.lat = pos.coords.latitude;
    window.lng = pos.coords.longitude;

    // =========================
    // CEK KE SERVER (JARAK)
    // =========================
    let res = await fetch("YOUR_SCRIPT_URL?uid=" + window.uid + "&lat=" + window.lat + "&lng=" + window.lng);
    let data = await res.json();

    document.getElementById("jarakInfo").innerText = "Jarak: " + Math.round(data.jarak) + " m";

    if (data.status === "OUT_OF_RANGE") {

      document.getElementById("locationStatus").innerHTML = "❌ Diluar area";
      setTimeout(resetUI, 2000);
      return;
    }

    // lanjut kamera
    document.getElementById("locationPage").classList.add("hidden");
    document.getElementById("cameraPage").classList.remove("hidden");

    startCamera();

  });

}

/* =========================
   START CAMERA
========================= */
async function startCamera() {

  stream = await navigator.mediaDevices.getUserMedia({ video: true });

  let video = document.getElementById("video");
  video.srcObject = stream;
  video.play();

  tungguWajah(video);
}

/* =========================
   DETEKSI WAJAH
========================= */
async function tungguWajah(video) {

  await new Promise(r => video.onloadedmetadata = r);

  if ("FaceDetector" in window) {

    const detector = new FaceDetector();

    const interval = setInterval(async () => {

      const faces = await detector.detect(video);

      if (faces.length > 0) {
        clearInterval(interval);
        setTimeout(() => ambilFoto(video), 800);
      }

    }, 500);

  } else {

    // fallback
    setTimeout(() => ambilFoto(video), 2500);
  }
}

/* =========================
   AMBIL FOTO
========================= */
function ambilFoto(video) {

  let canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  let ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);

  let foto = canvas.toDataURL("image/jpeg");

  kirimData(foto);
}

/* =========================
   KIRIM DATA
========================= */
async function kirimData(foto) {

  let res = await fetch("YOUR_SCRIPT_URL", {
    method: "POST",
    body: JSON.stringify({
      uid: window.uid,
      lat: window.lat,
      lng: window.lng,
      foto: foto
    })
  });

  let data = await res.json();

  stream.getTracks().forEach(t => t.stop());

  if (data.status === "SUCCESS") {

    document.getElementById("cameraPage").classList.add("hidden");
    document.getElementById("resultPage").classList.remove("hidden");

    document.getElementById("nama").innerText = "Nama: " + data.nama;
    document.getElementById("gudang").innerText = "Gudang: " + data.gudang;
    document.getElementById("fotoDB").src = data.fotoDB;
    document.getElementById("fotoSelfie").src = foto;

    setTimeout(resetUI, 3000);
  }
}

</script>

</body>
</html>
