<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABSENSI</title>

<style>
body{
  background:black;
  color:#00ff66;
  font-family:monospace;
  text-align:center;
}

.location-icon{
  font-size:80px;
  margin:20px;
}

.progress-container{
  width:80%;
  height:20px;
  background:#222;
  border-radius:10px;
  margin:10px auto;
}

.progress-bar{
  height:100%;
  width:0%;
  background:lime;
}

button{
  width:80%;
  padding:10px;
  margin-top:10px;
}

button:disabled{
  opacity:0.5;
}

#infoPage,#thankPage,#warningPage,#dashboardPage{
  display:none;
  margin:10px;
  padding:10px;
  border-radius:10px;
}

#infoPage,#thankPage,#dashboardPage{
  background:white;
  color:black;
}

#warningPage{
  background:black;
  color:red;
}

.rowBox{
  display:flex;
  justify-content:space-between;
  background:white;
  padding:12px;
  border-radius:8px;
  margin-bottom:10px;
  border:1px solid #ccc;
}

video,img{
  width:100%;
  max-width:300px;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>ABSENSI</h2>

<!-- MAIN -->
<div id="mainPage">
  <div class="location-icon">📍</div>
  <div id="status">MENCARI LOKASI...</div>
  <div>Jarak: <span id="jarak">-</span></div>
  <div>Akurasi: <span id="akurasi">-</span></div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <button id="btnAbsen" disabled>ABSEN</button>
</div>

<!-- INFO -->
<div id="infoPage">
<h3>INFORMASI</h3>

<div>Nama: <span id="nama"></span></div>
<div>Tanggal: <span id="tanggal"></span></div>
<div>Waktu: <span id="waktu"></span></div>
<div>Lokasi: <span id="lokasi"></span></div>
<div>Status: <span id="statusAbsensi"></span></div>

<hr>

<h3>SELFIE WAJIB</h3>
<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>
<img id="preview" style="display:none;">

<button id="takePhoto">AMBIL FOTO</button>
<button id="retake" style="display:none;">ULANGI</button>
<button id="confirm" disabled>KONFIRMASI</button>
</div>

<!-- WARNING -->
<div id="warningPage">
<h1>⚠️</h1>
<h2 id="warningText"></h2>
<p><span id="warningCountdown">5</span> detik</p>
</div>

<!-- THANK -->
<div id="thankPage">
<h2>TERIMAKASIH</h2>
<p><span id="countdown">10</span> detik</p>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage">

  <div style="display:flex; justify-content:space-between;">
    <h3>Dashboard</h3>
    <div>👤</div>
  </div>

  <hr>

  <div class="rowBox">
    <div>📅 Tanggal</div>
    <div id="dashTanggal">-</div>
  </div>

  <div class="rowBox">
    <div>⏰ Waktu</div>
    <div id="dashJamRealtime">-</div>
  </div>

  <div class="rowBox">
    <div>👤 Nama</div>
    <div id="dashNama">-</div>
  </div>

  <div class="rowBox">
    <div>📅 Total Hari</div>
    <div id="dashHari">-</div>
  </div>

  <div class="rowBox">
    <div>⏱ Total Jam</div>
    <div id="dashJam">-</div>
  </div>

</div>

<script>

// CONFIG
const URL="https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";
const UID=new URLSearchParams(location.search).get("uid")||"";

const TARGET_LAT=-6.2341459;
const TARGET_LNG=106.4997284;
const RADIUS=50;

// ELEMENT
const btnAbsen=document.getElementById("btnAbsen");
const progressBar=document.getElementById("progressBar");
const jarak=document.getElementById("jarak");
const akurasi=document.getElementById("akurasi");
const status=document.getElementById("status");

const mainPage=document.getElementById("mainPage");
const infoPage=document.getElementById("infoPage");
const warningPage=document.getElementById("warningPage");
const thankPage=document.getElementById("thankPage");
const dashboardPage=document.getElementById("dashboardPage");

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const preview=document.getElementById("preview");
const confirmBtn=document.getElementById("confirm");
const retakeBtn=document.getElementById("retake");

// CAMERA CONTROL
function startCamera(){
  navigator.mediaDevices.getUserMedia({video:true})
  .then(s=>video.srcObject=s);
}

function stopCamera(){
  if(video.srcObject){
    video.srcObject.getTracks().forEach(t=>t.stop());
    video.srcObject=null;
  }
}

// DISTANCE
function dist(a,b,c,d){
  const R=6371000;
  let dLat=(c-a)*Math.PI/180;
  let dLon=(d-b)*Math.PI/180;
  let x=Math.sin(dLat/2)**2+
  Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
  Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// GPS
let lat=0,lng=0,locked=false;

navigator.geolocation.watchPosition(p=>{
  lat=p.coords.latitude;
  lng=p.coords.longitude;

  let d=dist(lat,lng,TARGET_LAT,TARGET_LNG);

  jarak.innerText=Math.round(d)+" m";
  akurasi.innerText="± "+Math.round(p.coords.accuracy)+" m";

  let persen=100-(d/RADIUS*100);
  persen=Math.max(0,Math.min(100,persen));
  progressBar.style.width=persen+"%";

  if(d<=RADIUS){
    locked=true;
    status.innerText="LOKASI VALID";
    btnAbsen.disabled=false;
  }
});

// ABSEN
btnAbsen.onclick=()=>{
  if(!locked) return;

  fetch(`${URL}?uid=${UID}&lat=${lat}&lng=${lng}`)
  .then(r=>r.json())
  .then(data=>{

    if(data.status!="OK"){
      mainPage.style.display="none";
      warningPage.style.display="block";

      document.getElementById("warningText").innerText=data.pesan;

      let s=5;
      let t=setInterval(()=>{
        s--;
        warningCountdown.innerText=s;
        if(s<=0){
          clearInterval(t);
          warningPage.style.display="none";
          showDashboard();
        }
      },1000);
      return;
    }

    mainPage.style.display="none";
    infoPage.style.display="block";

    // RESET STATE
    confirmBtn.disabled=true;
    retakeBtn.style.display="none";
    preview.style.display="none";
    video.style.display="block";

    startCamera();

    nama.innerText=data.nama;
    lokasi.innerText=data.gudang;
    statusAbsensi.innerText=data.aksi;

    let now=new Date();
    tanggal.innerText=now.toLocaleDateString();
    waktu.innerText=now.toLocaleTimeString();
  });
};

// FOTO
takePhoto.onclick=()=>{
  if(!video.srcObject) return;

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  canvas.getContext("2d").drawImage(video,0,0);

  preview.src=canvas.toDataURL("image/jpeg");

  stopCamera();

  preview.style.display="block";
  video.style.display="none";

  confirmBtn.disabled=false;
  retakeBtn.style.display="inline-block";
};

// RETAKE
retake.onclick=()=>{
  preview.style.display="none";
  confirmBtn.disabled=true;
  startCamera();
  video.style.display="block";
};

// KONFIRMASI
confirmBtn.onclick=()=>{
  stopCamera();

  infoPage.style.display="none";
  thankPage.style.display="block";

  let s=10;
  let t=setInterval(()=>{
    s--;
    countdown.innerText=s;
    if(s<=0){
      clearInterval(t);
      thankPage.style.display="none";
      showDashboard();
    }
  },1000);
};

// DASHBOARD
function showDashboard(){
  stopCamera();

  dashboardPage.style.display="block";

  fetch(`${URL}?mode=dashboard&uid=${UID}`)
  .then(r=>r.json())
  .then(d=>{
    if(d.status=="OK"){
      dashNama.innerText=d.nama;
      dashHari.innerText=d.totalHari;
      dashJam.innerText=d.totalJam+" Jam";
    }
  });

  startClock();
}

// CLOCK
function startClock(){
  setInterval(()=>{
    let now=new Date();
    dashTanggal.innerText=now.toLocaleDateString();
    dashJamRealtime.innerText=now.toLocaleTimeString();
  },1000);
}

</script>

</body>
</html>
