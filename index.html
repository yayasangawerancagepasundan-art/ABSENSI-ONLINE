<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI NFC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    .status {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .red { color:red; }
    .green { color:green; }

    .loader {
      border: 6px solid #eee;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 15px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    button {
      padding: 15px;
      font-size: 18px;
      background: green;
      color: white;
      border: none;
      border-radius: 10px;
      width: 100%;
      margin-top: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }

    .label { font-weight: bold; width: 40%; text-align:left; }
    .value { width: 60%; text-align:left; }
  </style>
</head>

<body>

<h2>ABSENSI</h2>

<div class="card">

  <!-- STATE 1 -->
  <div id="loading">
    <div class="status red">Mencari lokasi...</div>
    <div class="loader"></div>
    <p>Jarak: <span id="jarak">-</span></p>
  </div>

  <!-- STATE 2 -->
  <div id="ready" style="display:none;">
    <div class="status green">Dalam Area</div>
    <p>Jarak: <span id="jarak2">-</span></p>
    <button onclick="absen()">ABSEN</button>
  </div>

  <!-- STATE 3 -->
  <div id="result" style="display:none;">
    <div id="statusResult" class="status"></div>

    <div class="row"><div class="label">Nama</div><div id="nama" class="value">-</div></div>
    <div class="row"><div class="label">Tanggal</div><div id="tgl" class="value">-</div></div>
    <div class="row"><div class="label">Jam</div><div id="jam" class="value">-</div></div>
    <div class="row"><div class="label">Gudang</div><div id="gudang" class="value">-</div></div>
  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");

let currentLat = "";
let currentLng = "";
let sudahReady = false;

// ===== TRACK GPS =====
navigator.geolocation.watchPosition(async pos => {

  currentLat = pos.coords.latitude;
  currentLng = pos.coords.longitude;

  let res = await fetch(API + "?uid=" + uid + "&lat=" + currentLat + "&lng=" + currentLng);
  let data = await res.json();

  // LUAR AREA
  if(data.status == "OUTSIDE"){
    document.getElementById("jarak").innerText = data.jarak + " m";
    return;
  }

  // MASUK AREA
  if(data.status == "OK" && !sudahReady){

    sudahReady = true;

    document.getElementById("loading").style.display = "none";
    document.getElementById("ready").style.display = "block";

    document.getElementById("jarak2").innerText = "0 - OK";
  }

});

// ===== KLIK ABSEN =====
async function absen(){

  document.getElementById("ready").style.display = "none";
  document.getElementById("loading").style.display = "block";

  let res = await fetch(API + "?uid=" + uid + "&lat=" + currentLat + "&lng=" + currentLng);
  let data = await res.json();

  document.getElementById("loading").style.display = "none";
  document.getElementById("result").style.display = "block";

  if(data.status == "OK"){

    document.getElementById("statusResult").innerText = "ABSEN " + data.aksi;
    document.getElementById("statusResult").className = "status green";

    document.getElementById("nama").innerText = data.nama;
    document.getElementById("gudang").innerText = data.gudang;

    const now = new Date();
    document.getElementById("tgl").innerText = now.toLocaleDateString("id-ID");
    document.getElementById("jam").innerText = now.toLocaleTimeString("id-ID");

  } else {
    document.getElementById("statusResult").innerText = "Gagal";
  }

  setTimeout(()=>{
    window.location.href = window.location.pathname;
  },10000);
}

</script>

</body>
</html>
