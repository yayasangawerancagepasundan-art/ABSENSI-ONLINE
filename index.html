<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi</title>

<style>
body {
  font-family: Arial;
  text-align:center;
  background: linear-gradient(#5fa8d3, #4a90c2);
  color:white;
}

.box { max-width:400px; margin:auto; padding:20px; }

input, button {
  width:90%;
  padding:12px;
  margin:5px;
  font-size:16px;
  border-radius:8px;
  border:none;
}

button { background:#ffffff; color:#333; }

.card {
  background: rgba(255,255,255,0.2);
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}

img { width:150px; border-radius:12px; }
</style>
</head>

<body>

<div class="box">

<h2>ABSENSI KARYAWAN</h2>

<input id="uid" placeholder="Scan UID">

<input type="file" accept="image/*" capture="user" id="fotoSelfie">

<img id="preview" style="display:none; margin-top:10px;">

<button onclick="absen()">ABSEN</button>

<p id="status"></p>

<div id="hasil" class="card" style="display:none;">
  <img id="foto">
  <h3 id="nama"></h3>
  <p id="jabatan"></p>
  <p id="info"></p>
</div>

</div>

<script>

const API_URL = "PASTE_URL_WEB_APP_KAMU";

/* ========================================= */
async function absen() {

  let uid = document.getElementById("uid").value.trim().toLowerCase();
  let status = document.getElementById("status");

  if (!uid) return status.innerHTML = "❌ UID kosong";

  let file = document.getElementById("fotoSelfie").files[0];
  if (!file) return status.innerHTML = "❌ Selfie dulu";

  status.innerHTML = "📍 Ambil lokasi...";

  navigator.geolocation.getCurrentPosition(async (pos) => {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    let blob = await prosesSelfie(lat, lng);

    let base64 = await blobToBase64(blob);

    status.innerHTML = "⏳ Kirim data...";

    let res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        uid, lat, lng, foto: base64
      })
    });

    let data = await res.json();

    if (data.status === "success") {

      document.getElementById("hasil").style.display = "block";
      document.getElementById("foto").src = document.getElementById("preview").src;
      document.getElementById("nama").innerText = data.nama;
      document.getElementById("jabatan").innerText = data.jabatan;
      document.getElementById("info").innerText =
        data.tipe + " | " + new Date().toLocaleTimeString();

      status.innerHTML = "✅ Berhasil";

    } else {
      status.innerHTML = "❌ " + data.message;
    }

  }, () => {
    status.innerHTML = "❌ GPS gagal";
  });
}

/* ========================================= */
async function prosesSelfie(lat, lng) {

  let file = document.getElementById("fotoSelfie").files[0];

  return new Promise((resolve) => {

    let img = new Image();
    let reader = new FileReader();

    reader.onload = e => img.src = e.target.result;

    img.onload = () => {

      let canvas = document.createElement("canvas");
      let ctx = canvas.getContext("2d");

      canvas.width = img.width;
      canvas.height = img.height;

      ctx.drawImage(img, 0, 0);

      ctx.fillStyle = "yellow";
      ctx.strokeStyle = "black";
      ctx.lineWidth = 3;
      ctx.font = "28px Arial";

      let y = canvas.height - 100;

      let t1 = "Lat: " + lat.toFixed(6);
      let t2 = "Lng: " + lng.toFixed(6);
      let t3 = new Date().toLocaleString();

      ctx.strokeText(t1, 20, y);
      ctx.fillText(t1, 20, y);

      ctx.strokeText(t2, 20, y+30);
      ctx.fillText(t2, 20, y+30);

      ctx.strokeText(t3, 20, y+60);
      ctx.fillText(t3, 20, y+60);

      canvas.toBlob(blob => {

        let url = URL.createObjectURL(blob);
        let preview = document.getElementById("preview");
        preview.src = url;
        preview.style.display = "block";

        resolve(blob);

      }, "image/jpeg", 0.9);
    };

    reader.readAsDataURL(file);
  });
}

/* ========================================= */
function blobToBase64(blob) {
  return new Promise((resolve) => {
    let reader = new FileReader();
    reader.onloadend = () => {
      resolve(reader.result.split(',')[1]);
    };
    reader.readAsDataURL(blob);
  });
}

</script>

</body>
</html>
