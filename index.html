<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Absensi</title>

<style>
body{
  background:#0b1a2e;
  color:white;
  text-align:center;
  font-family:Arial;
}

/* =====================
   PAGE
===================== */
.hidden{display:none}

/* =====================
   RADAR FIX
===================== */
.radar-box{
  position:relative;
  width:220px;
  height:220px;
  margin:40px auto;
  border-radius:50%;
  border:2px solid #22c55e;
  overflow:hidden;
}

/* garis scan */
.radar-line{
  position:absolute;
  width:50%;
  height:2px;
  background:#22c55e;
  top:50%;
  left:50%;
  transform-origin:left center;
  animation:spin 2s linear infinite;
}

@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

/* titik user */
.dot{
  width:12px;
  height:12px;
  background:#22c55e;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* titik target */
.target{
  width:10px;
  height:10px;
  background:red;
  border-radius:50%;
  position:absolute;
  top:20%;
  left:70%;
}

/* =====================
   BUTTON
===================== */
button{
  padding:10px 18px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  color:white;
}

/* =====================
   CAMERA
===================== */
video{
  width:90%;
  border-radius:10px;
  background:black;
}

img{
  width:100px;
  border-radius:10px;
}
</style>

</head>

<body>

<!-- =====================
     SCAN PAGE
===================== -->
<div id="scanPage">
<h2>ABSENSI</h2>
<p>UID: <span id="uid">-</span></p>
<button onclick="startScan()">SCAN KARTU</button>
<p id="status">Menunggu...</p>
</div>

<!-- =====================
     LOCATION PAGE
===================== -->
<div id="locationPage" class="hidden">

<h3>📍 Cek Lokasi</h3>

<div class="radar-box">
  <div class="radar-line"></div>
  <div class="dot"></div>
  <div class="target"></div>
</div>

<p id="locStatus">Mengambil lokasi...</p>
<p id="jarak">-</p>

</div>

<!-- =====================
     CAMERA PAGE
===================== -->
<div id="cameraPage" class="hidden">
<h3>📸 Ambil Foto</h3>
<video id="video" autoplay playsinline></video>
<p id="camStatus">Arahkan wajah...</p>
</div>

<!-- =====================
     RESULT PAGE
===================== -->
<div id="resultPage" class="hidden">
<h3>✅ Berhasil</h3>
<p id="nama"></p>
<p id="gudang"></p>
<img id="fotoDB">
<img id="fotoSelfie">
</div>

<script>

let stream;

/* =====================
   NFC SCAN
===================== */
async function startScan(){
  try{
    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("status").innerText="Tempel kartu...";

    ndef.onreading = async (event)=>{
      let uid = event.serialNumber;
      window.uid = uid;

      document.getElementById("uid").innerText = uid;

      // pindah ke lokasi
      document.getElementById("scanPage").classList.add("hidden");
      document.getElementById("locationPage").classList.remove("hidden");

      getLocation();
    }

  }catch(e){
    alert("HP tidak support NFC");
  }
}

/* =====================
   GET LOCATION + VALIDASI
===================== */
function getLocation(){

navigator.geolocation.getCurrentPosition(async (pos)=>{

  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;

  window.lat = lat;
  window.lng = lng;

  document.getElementById("locStatus").innerText="Validasi lokasi...";

  try{

    let res = await fetch("https://script.google.com/macros/s/AKfycbxQYvZIxsv-KrVS2k3wKtmAtq3iOQuoz2PErPJP764YIvOiKv8lvx8IcFO44-tQc4A/exec?mode=cek",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        uid:window.uid,
        lat:lat,
        lng:lng
      })
    });

    let data = await res.json();

    document.getElementById("jarak").innerText="Jarak: "+Math.round(data.jarak)+" m";

    if(data.status==="VALID"){

      document.getElementById("locStatus").innerText="Dalam area";

      setTimeout(()=>{
        openCamera();
      },1000);

    }else{
      document.getElementById("locStatus").innerText="Diluar area ❌";
    }

  }catch(e){
    alert("Gagal koneksi server");
    console.log(e);
  }

});

}

/* =====================
   CAMERA
===================== */
async function openCamera(){

document.getElementById("locationPage").classList.add("hidden");
document.getElementById("cameraPage").classList.remove("hidden");

stream = await navigator.mediaDevices.getUserMedia({video:true});

let video = document.getElementById("video");
video.srcObject = stream;

setTimeout(()=>{
  takePhoto(video);
},2000);

}

/* =====================
   AMBIL FOTO
===================== */
function takePhoto(video){

let canvas = document.createElement("canvas");
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

let ctx = canvas.getContext("2d");
ctx.drawImage(video,0,0);

let foto = canvas.toDataURL("image/jpeg");

sendData(foto);

}

/* =====================
   KIRIM DATA
===================== */
async function sendData(foto){

try{

let res = await fetch("https://script.google.com/macros/s/AKfycbxQYvZIxsv-KrVS2k3wKtmAtq3iOQuoz2PErPJP764YIvOiKv8lvx8IcFO44-tQc4A/exec",{
  method:"POST",
  headers:{
    "Content-Type":"application/json"
  },
  body:JSON.stringify({
    uid:window.uid,
    lat:window.lat,
    lng:window.lng,
    foto:foto
  })
});

let data = await res.json();

stream.getTracks().forEach(t=>t.stop());

if(data.status==="SUCCESS"){

  document.getElementById("cameraPage").classList.add("hidden");
  document.getElementById("resultPage").classList.remove("hidden");

  document.getElementById("nama").innerText=data.nama;
  document.getElementById("gudang").innerText=data.gudang;
  document.getElementById("fotoDB").src=data.fotoDB;
  document.getElementById("fotoSelfie").src=foto;

}

}catch(e){
  alert("Gagal kirim data");
  console.log(e);
}

}

</script>

</body>
</html>
