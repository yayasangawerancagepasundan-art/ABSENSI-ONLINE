<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI KARYAWAN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #f0f2f5;
      padding: 15px;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .status {
      font-size: 20px;
      font-weight: bold;
      margin: 10px 0;
    }

    .success { color: green; }
    .keluar { color: orange; }
    .error { color: red; }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
    }

    .label { width: 40%; text-align: left; font-weight: bold; }
    .value { width: 60%; text-align: left; }

    video { width: 100%; border-radius: 10px; margin-top: 10px; }
    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #007bff;
      color: white;
    }

  </style>
</head>

<body>

<div class="card">
  <h2>ABSENSI</h2>

  <div id="status" class="status">Memproses...</div>

  <div class="row"><div class="label">Nama</div><div id="nama" class="value">-</div></div>
  <div class="row"><div class="label">Tanggal</div><div id="tanggal" class="value">-</div></div>
  <div class="row"><div class="label">Jam</div><div id="jam" class="value">-</div></div>
  <div class="row"><div class="label">Gudang</div><div id="gudang" class="value">-</div></div>
  <div class="row"><div class="label">Jarak</div><div id="jarak" class="value">-</div></div>

  <video id="video" autoplay></video>
  <button onclick="ambilFoto()">Ambil Foto</button>

</div>

<script>

// ===== PARAM UID =====
const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");

// ===== LOKASI KANTOR =====
const kantorLat = -0.123456;
const kantorLng = 104.123456;
const radiusMax = 100; // meter

// ===== HITUNG JARAK =====
function hitungJarak(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI/180;
  const dLon = (lon2 - lon1) * Math.PI/180;

  const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)*Math.sin(dLon/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

// ===== START =====
if(!uid){
  document.getElementById("status").innerHTML = "<span class='error'>UID tidak ada</span>";
}else{
  ambilLokasi();
}

// ===== AMBIL LOKASI =====
function ambilLokasi(){

  navigator.geolocation.getCurrentPosition(async function(pos){

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    let jarak = hitungJarak(lat, lng, kantorLat, kantorLng);

    document.getElementById("jarak").innerText = Math.round(jarak) + " m";

    if(jarak > radiusMax){
      document.getElementById("status").innerHTML =
        "<span class='error'>Diluar area</span>";
      return;
    }

    kirim(uid, lat, lng, jarak);

  }, function(){
    document.getElementById("status").innerText = "Izin lokasi ditolak";
  });
}

// ===== CAMERA =====
const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => video.srcObject = stream);

let fotoBase64 = "";

function ambilFoto(){
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  canvas.getContext("2d").drawImage(video,0,0);

  fotoBase64 = canvas.toDataURL("image/jpeg");

  kirim(uid);
}

// ===== KIRIM DATA =====
async function kirim(uid, lat="", lng="", jarak=""){

  document.getElementById("status").innerText = "Kirim data...";

  let url = "https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

  url += "?uid=" + uid +
         "&lat=" + lat +
         "&lng=" + lng +
         "&jarak=" + jarak +
         "&foto=" + encodeURIComponent(fotoBase64);

  let res = await fetch(url);
  let data = await res.json();

  if(data.status === "OK"){

    let warna = (data.aksi === "MASUK") ? "success" : "keluar";

    document.getElementById("status").innerHTML =
      "<span class='"+warna+"'>ABSEN " + data.aksi + "</span>";

    document.getElementById("nama").innerText = data.nama;
    document.getElementById("gudang").innerText = data.gudang;

    let now = new Date();
    document.getElementById("tanggal").innerText = now.toLocaleDateString("id-ID");
    document.getElementById("jam").innerText = now.toLocaleTimeString("id-ID");

  } else {
    document.getElementById("status").innerText = data.message;
  }
}

// ===== AUTO RESET =====
setTimeout(() => {
  window.location.href = window.location.pathname;
}, 10000);

</script>

</body>
</html>
