<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABSENSI</title>

<style>
body{
  background:black;
  color:#00ff66;
  font-family:monospace;
  text-align:center;
}

.location-icon{
  font-size:80px;
  margin:20px;
}

.progress-container{
  width:80%;
  height:20px;
  background:#222;
  border-radius:10px;
  margin:10px auto;
}

.progress-bar{
  height:100%;
  width:0%;
  background:lime;
}

button{
  width:80%;
  padding:10px;
  margin-top:10px;
  transition:0.15s;
}

button:active{
  transform:scale(0.95);
  background:#ddd;
}

#infoPage,#thankPage,#warningPage,#dashboardPage,#cameraPage{
  display:none;
  margin:10px;
  padding:10px;
  border-radius:10px;
}

#infoPage,#thankPage,#dashboardPage,#cameraPage{
  background:white;
  color:black;
}

#warningPage{
  background:black;
  color:red;
}

.rowBox{
  display:flex;
  justify-content:space-between;
  background:white;
  padding:12px;
  border-radius:8px;
  margin-bottom:10px;
  border:1px solid #ccc;
}

video,img{
  width:100%;
  max-width:300px;
  border-radius:10px;
}

/* LOADER */
.loader{
  display:none;
  margin:15px auto;
  width:60px;
  height:60px;
  position:relative;
}

.loader span{
  position:absolute;
  width:6px;
  height:18px;
  background:#999;
  left:50%;
  top:50%;
  transform-origin:center -20px;
  border-radius:3px;
  animation:fade 1.2s linear infinite;
}

@keyframes fade{
  0%{opacity:1;}
  100%{opacity:0.1;}
}

/* DASHBOARD STYLE */
#dashboardPage{
  animation:fadeIn 0.4s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

#dashWaktu{
  font-size:20px;
  font-weight:bold;
  color:#00cc66;
}
</style>
</head>

<body>

<h2>ABSENSI</h2>

<!-- MAIN -->
<div id="mainPage">
  <div class="location-icon">📍</div>
  <div id="status">MENCARI LOKASI...</div>
  <div>Jarak: <span id="jarak">-</span></div>
  <div>Akurasi: <span id="akurasi">-</span></div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <button id="btnAbsen" disabled>ABSEN</button>

  <div class="loader" id="loader"></div>
</div>

<!-- INFO -->
<div id="infoPage">
<h3>INFORMASI</h3>

<div>Nama: <span id="nama"></span></div>
<div>Tanggal: <span id="tanggal"></span></div>
<div>Waktu: <span id="waktu"></span></div>
<div>Lokasi: <span id="lokasi"></span></div>
<div>Status: <span id="statusAbsensi"></span></div>

<hr>

<h3>SELFIE WAJIB</h3>
<img id="preview" style="display:none;">

<button id="btnFoto">AMBIL FOTO</button>
<button id="confirm" disabled>KONFIRMASI</button>
</div>

<!-- CAMERA -->
<div id="cameraPage">
<h3>AMBIL FOTO</h3>

<video id="video" autoplay></video>
<canvas id="canvas" style="display:none;"></canvas>

<button id="takePhoto">AMBIL FOTO</button>
<button id="retake" style="display:none;">ULANGI</button>
<button id="backInfo">KEMBALI</button>
</div>

<!-- WARNING -->
<div id="warningPage">
<h1>⚠️</h1>
<h2 id="warningText"></h2>
<p>Menutup dalam <span id="warningCountdown">5</span> detik</p>
</div>

<!-- THANK -->
<div id="thankPage">
<h2>TERIMAKASIH</h2>
<p>Menutup dalam <span id="countdown">10</span> detik</p>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage">
  <h3>Dashboard</h3>

  <div class="rowBox"><div>Tanggal</div><div id="dashTanggal">-</div></div>
  <div class="rowBox"><div>Waktu</div><div id="dashWaktu">-</div></div>
  <div class="rowBox"><div>Nama</div><div id="dashNama">-</div></div>
  <div class="rowBox"><div>Total Hari</div><div id="dashHari">-</div></div>
  <div class="rowBox"><div>Total Jam</div><div id="dashJam">-</div></div>
</div>

<script>

// ==========================
// 🔵 CODE ASLI KAMU (UTUH)
// ==========================

const URL="https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";
const params=new URLSearchParams(location.search);
const UID=params.get("uid")||"";

const loader=document.getElementById("loader");
for(let i=0;i<12;i++){
  let s=document.createElement("span");
  s.style.transform=`rotate(${i*30}deg) translate(-50%, -50%)`;
  s.style.animationDelay=`${i*0.1}s`;
  loader.appendChild(s);
}

const TARGET_LAT=-6.2341459;
const TARGET_LNG=106.4997284;
const RADIUS=50;

const btnAbsen=document.getElementById("btnAbsen");
const progressBar=document.getElementById("progressBar");
const jarak=document.getElementById("jarak");
const akurasi=document.getElementById("akurasi");
const status=document.getElementById("status");

const mainPage=document.getElementById("mainPage");
const infoPage=document.getElementById("infoPage");
const warningPage=document.getElementById("warningPage");
const thankPage=document.getElementById("thankPage");
const dashboardPage=document.getElementById("dashboardPage");
const cameraPage=document.getElementById("cameraPage");

function dist(a,b,c,d){
  const R=6371000;
  let dLat=(c-a)*Math.PI/180;
  let dLon=(d-b)*Math.PI/180;
  let x=Math.sin(dLat/2)**2+
  Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
  Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

let lat=0,lng=0;

navigator.geolocation.watchPosition(p=>{
  lat=p.coords.latitude;
  lng=p.coords.longitude;

  let d=dist(lat,lng,TARGET_LAT,TARGET_LNG);

  jarak.innerText=Math.round(d)+" m";
  akurasi.innerText="± "+Math.round(p.coords.accuracy)+" m";

  let persen=100-(d/RADIUS*100);
  persen=Math.max(0,Math.min(100,persen));
  progressBar.style.width=persen+"%";

  if(d<=RADIUS){
    status.innerText="LOKASI VALID";
    btnAbsen.disabled=false;
  }
});

btnAbsen.onclick=()=>{
  loader.style.display="block";
  btnAbsen.disabled=true;

  fetch(`${URL}?uid=${UID}&lat=${lat}&lng=${lng}`)
  .then(r=>r.json())
  .then(data=>{

    loader.style.display="none";

    if(data.status!="OK"){
      mainPage.style.display="none";
      warningPage.style.display="block";

      let txt=document.getElementById("warningText");

      txt.innerText = data.pesan?.includes("3") ? "BELUM 3 JAM" : "BELUM 10 MENIT";

      let s=5;
      let cd=document.getElementById("warningCountdown");

      let t=setInterval(()=>{
        s--; cd.innerText=s;
        if(s<=0){
          clearInterval(t);
          warningPage.style.display="none";
          showDashboard();
        }
      },1000);

      return;
    }

    mainPage.style.display="none";
    infoPage.style.display="block";

    document.getElementById("nama").innerText=data.nama;
    document.getElementById("lokasi").innerText=data.gudang;
    document.getElementById("statusAbsensi").innerText=data.aksi;

    let now=new Date();
    document.getElementById("tanggal").innerText=now.toLocaleDateString();
    document.getElementById("waktu").innerText=now.toLocaleTimeString();

  });
};

function startClock(){
  function update(){
    let now = new Date();

    document.getElementById("dashTanggal").innerText =
      now.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});

    document.getElementById("dashWaktu").innerText =
      now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  }

  update();
  setInterval(update,1000);
}

function showDashboard(){
  dashboardPage.style.display="block";

  fetch(`${URL}?mode=dashboard&uid=${UID}`)
  .then(r=>r.json())
  .then(d=>{
    if(d.status=="OK"){
      document.getElementById("dashNama").innerText=d.nama;
      document.getElementById("dashHari").innerText=d.totalHari;
      document.getElementById("dashJam").innerText=d.totalJam+" Jam";
    }
  });

  startClock();
}


// ==========================
// 🟢 TAMBAHAN KAMERA (AMAN)
// ==========================

const btnFoto = document.getElementById("btnFoto");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");
const takePhoto = document.getElementById("takePhoto");
const retake = document.getElementById("retake");
const backInfo = document.getElementById("backInfo");
const confirmBtn = document.getElementById("confirm");

let stream = null;

btnFoto.onclick = async () => {
  infoPage.style.display = "none";
  cameraPage.style.display = "block";

  stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
};

takePhoto.onclick = () => {
  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0);

  preview.src = canvas.toDataURL("image/png");
  preview.style.display = "block";

  confirmBtn.disabled = false;
  retake.style.display = "inline-block";

  stream.getTracks().forEach(t=>t.stop());
};

retake.onclick = ()=> btnFoto.onclick();

backInfo.onclick = ()=>{
  cameraPage.style.display="none";
  infoPage.style.display="block";
};

confirmBtn.onclick = ()=>{
  infoPage.style.display="none";
  thankPage.style.display="block";

  let s=10;
  let cd=document.getElementById("countdown");

  let t=setInterval(()=>{
    s--; cd.innerText=s;
    if(s<=0){
      clearInterval(t);
      thankPage.style.display="none";
      showDashboard();
    }
  },1000);
};

</script>

</body>
</html>
