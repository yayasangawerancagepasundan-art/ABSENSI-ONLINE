<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI NFC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    .box {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 10px;
    }

    .success {
      color: green;
      font-size: 20px;
      font-weight: bold;
    }

    .error {
      color: red;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h2>ABSENSI NFC</h2>

<div class="box">
  <p id="status">Memproses...</p>
  <p id="info"></p>
</div>

<script>

// ambil UID dari URL
const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");

if(!uid){
  document.getElementById("status").innerHTML = "<span class='error'>UID tidak ada</span>";
} else {
  kirim(uid);
}

async function kirim(uid){

  document.getElementById("status").innerText = "Mengirim ke server...";

  try {

    let res = await fetch("https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec?uid=" + uid);

    let data = await res.json();

    if(data.status === "OK"){

      document.getElementById("status").innerHTML =
        "<span class='success'>ABSEN " + data.aksi + "</span>";

      document.getElementById("info").innerHTML =
        "Nama: " + data.nama + "<br>" +
        "UID: " + uid + "<br>" +
        "Gudang: " + data.gudang;

    } else {

      document.getElementById("status").innerHTML =
        "<span class='error'>Gagal</span>";

      document.getElementById("info").innerText = data.message;

    }

  } catch (err){
    document.getElementById("status").innerHTML =
      "<span class='error'>Server Error</span>";
  }
}

</script>

</body>
</html>
