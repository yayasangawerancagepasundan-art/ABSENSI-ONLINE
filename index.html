<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan NFC</title>
</head>

<body style="text-align:center; font-family:Arial; padding:20px;">

<h2>ABSENSI NFC</h2>

<button onclick="scanNFC()" style="padding:15px; font-size:18px;">
SCAN KARTU
</button>

<p id="hasil">UID: -</p>
<p id="server">Server: -</p>

<script>

async function scanNFC() {

  try {

    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("hasil").innerText = "Tempel kartu...";

    ndef.onreading = async (event) => {

      const decoder = new TextDecoder();

      let text = "";

      for (const record of event.message.records) {
        text = decoder.decode(record.data);
      }

      document.getElementById("hasil").innerText = "UID: " + text;

      // 🔥 KIRIM KE SERVER
      let res = await fetch("https://script.google.com/macros/s/AKfycbyrlWCsEXuAFpv0qdAw7JLclCjjooQ3MT3wg3LKgT0CxWEa9mBGOw_9QF83mrR3toY/exec", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          uid: text
        })
      });

      let data = await res.json();

      document.getElementById("server").innerText = "Server: " + JSON.stringify(data);

    };

  } catch (err) {
    alert("HP tidak support NFC / belum aktif");
    console.log(err);
  }

}

</script>

</body>
</html>
