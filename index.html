<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI NFC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    .status {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .red { color:red; }
    .green { color:green; }

    .loader {
      border: 6px solid #eee;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 15px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    button {
      padding: 15px;
      font-size: 18px;
      background: gray;
      color: white;
      border: none;
      border-radius: 10px;
      width: 100%;
      margin-top: 20px;
    }

    button.active {
      background: green;
    }

    .row {
      display: flex;
      margin: 6px 0;
    }

    .label {
      width: 40%;
      text-align: left;
      font-weight: bold;
    }

    .titik {
      width: 10%;
      text-align: center;
    }

    .value {
      width: 50%;
      text-align: left;
    }
  </style>
</head>

<body>

<h2>ABSENSI</h2>

<div class="card">

  <!-- LOADING -->
  <div id="loading">
    <div class="status red">Mencari lokasi...</div>
    <div class="loader"></div>
    <p>Jarak: <span id="jarak">-</span></p>
    <p>Akurasi: <span id="akurasi">-</span></p>
  </div>

  <!-- READY -->
  <div id="ready" style="display:none;">
    <div class="status green">Dalam Area</div>
    <p>Jarak: <span id="jarak2">-</span></p>
    <p>Akurasi: <span id="akurasi2">-</span></p>
    <button id="btnAbsen" disabled>ABSEN</button>
  </div>

  <!-- RESULT -->
  <div id="result" style="display:none;">
    <div id="statusResult" class="status"></div>

    <div class="row">
      <div class="label">Nama</div>
      <div class="titik">:</div>
      <div class="value" id="nama">-</div>
    </div>

    <div class="row">
      <div class="label">Jam</div>
      <div class="titik">:</div>
      <div class="value" id="jam">-</div>
    </div>

    <div class="row">
      <div class="label">Tanggal</div>
      <div class="titik">:</div>
      <div class="value" id="tanggal">-</div>
    </div>

    <div class="row">
      <div class="label">GPS</div>
      <div class="titik">:</div>
      <div class="value" id="gps">-</div>
    </div>

    <div class="row">
      <div class="label">Gudang</div>
      <div class="titik">:</div>
      <div class="value" id="gudang">-</div>
    </div>

  </div>

</div>

<script>

// ===== API BARU =====
const API = "https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

// ===== UID =====
const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");

// ===== TARGET =====
const TARGET_LAT = -6.2341459;
const TARGET_LNG = 106.4997284;
const RADIUS = 50;

let sudahDalamArea = false;
let currentLat = "";
let currentLng = "";

// ===== HITUNG JARAK =====
function hitungJarak(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI/180;
  const dLon = (lon2 - lon1) * Math.PI/180;

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1 * Math.PI/180) *
    Math.cos(lat2 * Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

// ===== GPS =====
navigator.geolocation.watchPosition(pos => {

  currentLat = pos.coords.latitude;
  currentLng = pos.coords.longitude;

  const accuracy = pos.coords.accuracy;
  const jarak = hitungJarak(currentLat, currentLng, TARGET_LAT, TARGET_LNG);

  document.getElementById("jarak").innerText = Math.round(jarak) + " m";
  document.getElementById("akurasi").innerText = "± " + Math.round(accuracy) + " m";

  if(document.getElementById("jarak2")){
    document.getElementById("jarak2").innerText = Math.round(jarak) + " m";
    document.getElementById("akurasi2").innerText = "± " + Math.round(accuracy) + " m";
  }

  if (jarak <= RADIUS && !sudahDalamArea) {

    sudahDalamArea = true;

    document.getElementById("loading").style.display = "none";
    document.getElementById("ready").style.display = "block";

    let btn = document.getElementById("btnAbsen");
    btn.disabled = false;
    btn.classList.add("active");
  }

}, err => {
  alert("GPS ERROR: " + err.message);
},{
  enableHighAccuracy: true,
  maximumAge: 0,
  timeout: 10000
});

// ===== KLIK ABSEN =====
document.getElementById("btnAbsen").onclick = async function(){

  this.innerText = "Mengirim...";
  this.disabled = true;

  let res = await fetch(API + "?uid=" + uid + "&lat=" + currentLat + "&lng=" + currentLng);
  let data = await res.json();

  document.getElementById("ready").style.display = "none";
  document.getElementById("result").style.display = "block";

  const now = new Date();
  document.getElementById("tanggal").innerText = now.toLocaleDateString("id-ID");
  document.getElementById("jam").innerText = now.toLocaleTimeString("id-ID");

  document.getElementById("gps").innerText =
    currentLat.toFixed(6) + ", " + currentLng.toFixed(6);

  if(data.status == "OK"){

    document.getElementById("statusResult").innerText = "ABSEN " + data.aksi;
    document.getElementById("statusResult").className = "status green";

    document.getElementById("nama").innerText = data.nama;
    document.getElementById("gudang").innerText = data.gudang;

  }
  else if(data.status == "DITOLAK"){

    document.getElementById("statusResult").innerText = "DITOLAK";
    document.getElementById("statusResult").className = "status red";

    document.getElementById("nama").innerText = data.pesan;
    document.getElementById("gudang").innerText = "-";

  }
  else{

    document.getElementById("statusResult").innerText = "ERROR";
    document.getElementById("statusResult").className = "status red";

  }

};

</script>

</body>
</html>
