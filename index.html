<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABSENSI</title>

<style>
body {
  background:black;
  color:#00ff66;
  font-family:monospace;
  text-align:center;
}

/* ===== RADAR ===== */
.radar {
  position: relative;
  width: 260px;
  height: 260px;
  margin: 20px auto;
  border-radius: 50%;
  background: radial-gradient(circle, #001a00 10%, #000 70%);
  overflow: hidden;
}

.ring {
  position:absolute;
  border:1px solid rgba(0,255,100,0.3);
  border-radius:50%;
  animation:pulse 2s infinite;
}
.ring:nth-child(1){width:100%;height:100%;}
.ring:nth-child(2){width:70%;height:70%;top:15%;left:15%;}
.ring:nth-child(3){width:40%;height:40%;top:30%;left:30%;}

@keyframes pulse {
  0%{opacity:0.2;}
  50%{opacity:1;}
  100%{opacity:0.2;}
}

.sweep {
  position:absolute;
  width:100%;
  height:100%;
  background:conic-gradient(rgba(0,255,100,0.4),transparent 60%);
  animation:spin 2s linear infinite;
}
@keyframes spin {100%{transform:rotate(360deg);}}

/* target */
.target {
  width:10px;height:10px;
  background:red;border-radius:50%;
  position:absolute;
}

.crosshair {
  width:30px;height:30px;
  border:2px solid #00ff66;
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  display:none;
}

/* tombol */
button {
  margin-top:10px;
  padding:10px;
  width:80%;
}

/* halaman */
#infoPage,#thankPage {
  display:none;
  background:white;
  color:black;
  margin:10px;
  padding:10px;
  border-radius:10px;
}

video,img {
  width:100%;
  max-width:300px;
  border-radius:10px;
}

</style>
</head>

<body>

<h2>ABSENSI</h2>

<!-- MAIN -->
<div id="mainPage">
  <div class="radar">
    <div class="sweep"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>

    <div class="target" id="target"></div>
    <div class="crosshair" id="crosshair"></div>
  </div>

  <div id="status">MENCARI TARGET...</div>
  <div>Jarak: <span id="jarak">-</span></div>
  <div>Akurasi: <span id="akurasi">-</span></div>

  <button id="btnAbsen" disabled>ABSEN</button>
</div>

<!-- INFO -->
<div id="infoPage">

<h3>INFORMASI</h3>
<div>Nama : <span id="nama">-</span></div>
<div>Tanggal : <span id="tanggal">-</span></div>
<div>Waktu : <span id="waktu">-</span></div>
<div>Lokasi : <span id="lokasi">-</span></div>
<div>Status : <span id="statusAbsensi">SIAP ABSEN</span></div>

<hr>

<h3>SELFIE WAJIB</h3>

<video id="video" autoplay></video>
<canvas id="canvas" style="display:none;"></canvas>
<img id="preview" style="display:none;">

<button id="takePhoto">AMBIL FOTO</button>
<button id="retake" style="display:none;">ULANGI</button>
<button id="confirm" disabled>KONFIRMASI</button>

</div>

<!-- THANK YOU -->
<div id="thankPage">
<h2>TERIMAKASIH</h2>
<p>Data berhasil dicatat</p>
<p>Menutup dalam 10 detik...</p>
</div>

<script>

// ===== CONFIG =====
const URL = "https://script.google.com/macros/s/AKfycbxwlXN-GC8cavD_8z4k6x-m6-cItZVP2F8P8jkgEuU5N0L3oO3ToZLt0VAaL8xiGhg/exec";

const params = new URLSearchParams(window.location.search);
const UID = params.get("uid") || "";

// TARGET
const TARGET_LAT = -6.2341459;
const TARGET_LNG = 106.4997284;
const RADIUS = 50;

let lat=0,lng=0,locked=false,photo="";

// ===== DISTANCE =====
function dist(a,b,c,d){
  const R=6371000;
  let dLat=(c-a)*Math.PI/180;
  let dLon=(d-b)*Math.PI/180;
  let x=Math.sin(dLat/2)**2+
  Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
  Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ===== GPS =====
navigator.geolocation.watchPosition(p=>{
  lat=p.coords.latitude;
  lng=p.coords.longitude;

  let d=dist(lat,lng,TARGET_LAT,TARGET_LNG);

  jarak.innerText=Math.round(d)+" m";
  akurasi.innerText="± "+Math.round(p.coords.accuracy)+" m";

  if(d<=RADIUS){
    locked=true;
    status.innerText="TARGET LOCK";
    crosshair.style.display="block";
    btnAbsen.disabled=false;
  }
});

// ===== ABSEN (TANPA SERVER) =====
btnAbsen.onclick=()=>{
  if(!locked) return alert("Belum dalam radius");

  mainPage.style.display="none";
  infoPage.style.display="block";

  // isi waktu lokal
  let now = new Date();
  tanggal.innerText = now.toLocaleDateString();
  waktu.innerText = now.toLocaleTimeString();
};

// ===== CAMERA =====
function startCamera(){
  navigator.mediaDevices.getUserMedia({video:true})
  .then(s=>video.srcObject=s);
}

startCamera();

takePhoto.onclick=()=>{
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  canvas.getContext("2d").drawImage(video,0,0);

  photo = canvas.toDataURL("image/jpeg");

  preview.src = photo;
  preview.style.display="block";
  video.style.display="none";

  confirm.disabled=false;
  retake.style.display="inline-block";
};

retake.onclick=()=>{
  preview.style.display="none";
  video.style.display="block";
  confirm.disabled=true;
};

// ===== KONFIRMASI (BARU HIT SERVER) =====
confirm.onclick=()=>{

  fetch(`${URL}?uid=${UID}&lat=${lat}&lng=${lng}`)
  .then(r=>r.json())
  .then(data=>{

    // isi dari server
    nama.innerText = data.nama || "-";
    lokasi.innerText = data.gudang || "-";
    statusAbsensi.innerText = data.aksi || "-";

    infoPage.style.display="none";
    thankPage.style.display="block";

    setTimeout(()=>{
      window.close();
    },10000);

  });

};

</script>

</body>
</html>
