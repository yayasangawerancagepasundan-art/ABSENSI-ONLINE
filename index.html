<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ABSENSI KARYAWAN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      width: 80%;
      max-width: 300px;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>ABSENSI KARYAWAN</h1>

<input type="text" id="uid" placeholder="Input UID / RFID">
<br>

<button onclick="absen()">ABSEN</button>

<br><br>

<button onclick="startNFC()">📶 Scan NFC</button>

<p id="status">Status: -</p>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxEzs-krfZ8i12sbVaw5bo_HQEY7HNkxcI/exec";

function absen() {
  let uid = document.getElementById("uid").value;

  if (!uid) {
    alert("Masukkan UID dulu!");
    return;
  }

  document.getElementById("status").innerText = "⏳ Memproses...";

  fetch(API_URL + "?uid=" + uid)
    .then(res => res.json())
    .then(data => {
      document.getElementById("status").innerText = "✅ " + data.status;
    })
    .catch(err => {
      document.getElementById("status").innerText = "❌ Error koneksi";
      console.log(err);
    });
}


// NFC (hanya HP Android Chrome)
async function startNFC() {
  if ('NDEFReader' in window) {
    const reader = new NDEFReader();

    await reader.scan();

    document.getElementById("status").innerText = "📡 Tempel kartu...";

    reader.onreading = event => {
      let uid = event.serialNumber;
      document.getElementById("uid").value = uid;

      document.getElementById("status").innerText = "📥 UID terbaca: " + uid;

      absen();
    };

  } else {
    alert("HP tidak support NFC Web 😢");
  }
}
</script>

</body>
</html>
