<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABSENSI FINAL FIX</title>

<style>
body{
  background:#0b1a2e;
  color:white;
  text-align:center;
  font-family:Arial;
}
.hidden{display:none}
video{width:90%;border-radius:10px;background:black;}
button{padding:10px 18px;background:#22c55e;border:none;border-radius:8px;color:white;}
</style>
</head>

<body>

<!-- SCAN -->
<div id="scanPage">
<h2>ABSENSI</h2>
<p>UID: <span id="uid">-</span></p>
<button onclick="startScan()">SCAN KARTU</button>
<p id="status">Menunggu scan...</p>
</div>

<!-- LOKASI -->
<div id="locationPage" class="hidden">
<h3>📍 Cek Lokasi</h3>
<p id="locStatus">...</p>
</div>

<!-- KAMERA -->
<div id="cameraPage" class="hidden">
<h3>📸 Kamera</h3>
<video id="video" autoplay playsinline></video>
<p id="camStatus">Mengambil foto...</p>
</div>

<!-- RESULT -->
<div id="resultPage" class="hidden">
<h3>✅ BERHASIL</h3>
<p id="nama"></p>
<p id="gudang"></p>
<img id="fotoSelfie" width="120">
</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbznCmA9JKgrMSklIBvN8y7fpqGJt1jNSNUEu9hfGmCgGV5bMhAQPfzFqaB_leRqLis/exec";

let stream;

/* =====================
   NFC SCAN
===================== */
async function startScan(){
  try{
    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("status").innerText="Tempel kartu...";

    ndef.onreading = (event)=>{

      let uid = event.serialNumber;

      if(!uid){
        alert("UID tidak terbaca");
        return;
      }

      window.uid = uid;
      document.getElementById("uid").innerText = uid;

      document.getElementById("scanPage").classList.add("hidden");
      document.getElementById("locationPage").classList.remove("hidden");

      getLocation();
    }

  }catch(e){
    alert("HP tidak support NFC");
  }
}

/* =====================
   LOKASI
===================== */
function getLocation(){

navigator.geolocation.getCurrentPosition(async (pos)=>{

  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;

  window.lat = lat;
  window.lng = lng;

  document.getElementById("locStatus").innerText="Validasi lokasi...";

  try{

    let res = await fetch(`${URL}?uid=${window.uid}&lat=${lat}&lng=${lng}`);
    let data = await res.json();

    if(data.status==="IN_RANGE"){

      window.nama = data.nama;
      window.gudang = data.gudang;

      openCamera();

    }else{
      document.getElementById("locStatus").innerText="Diluar area ❌";
    }

  }catch(e){
    alert("Gagal koneksi lokasi");
  }

});
}

/* =====================
   KAMERA
===================== */
async function openCamera(){

document.getElementById("locationPage").classList.add("hidden");
document.getElementById("cameraPage").classList.remove("hidden");

stream = await navigator.mediaDevices.getUserMedia({
  video:{width:320,height:240}
});

let video = document.getElementById("video");
video.srcObject = stream;

setTimeout(()=>takePhoto(video),1500);
}

/* =====================
   FOTO (RINGAN)
===================== */
function takePhoto(video){

let canvas = document.createElement("canvas");
canvas.width = 320;
canvas.height = 240;

let ctx = canvas.getContext("2d");
ctx.drawImage(video,0,0,320,240);

// foto hanya untuk tampilan
let foto = canvas.toDataURL("image/jpeg",0.5);

sendData(foto);
}

/* =====================
   KIRIM DATA (🔥 FIX TOTAL)
===================== */
function sendData(foto){

try{

let formData = new FormData();
formData.append("uid", window.uid);
formData.append("lat", window.lat);
formData.append("lng", window.lng);

/* 🔥 KIRIM TANPA FETCH */
navigator.sendBeacon(URL, formData);

/* stop kamera */
stream.getTracks().forEach(t=>t.stop());

/* langsung tampil */
document.getElementById("cameraPage").classList.add("hidden");
document.getElementById("resultPage").classList.remove("hidden");

document.getElementById("nama").innerText = window.nama;
document.getElementById("gudang").innerText = window.gudang;
document.getElementById("fotoSelfie").src = foto;

}catch(e){
  alert("Gagal kirim data");
}

}

</script>
</body>
</html>
