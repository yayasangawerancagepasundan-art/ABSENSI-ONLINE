<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI NFC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    .status {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .green { color: green; }
    .red { color: red; }

    button {
      padding: 15px;
      font-size: 18px;
      background: gray;
      color: white;
      border: none;
      border-radius: 10px;
      width: 100%;
      margin-top: 10px;
    }

    button.active { background: green; }

    /* ===== RADAR ===== */
    .radar {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 20px auto;
      border-radius: 50%;
      background: rgba(0, 150, 255, 0.1);
      overflow: hidden;
      transition: 0.3s;
    }

    /* pulse */
    .radar::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #3498db;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    /* sweep */
    .sweep {
      position: absolute;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, rgba(52,152,219,0.6), transparent);
      transform-origin: left center;
      animation: rotate 2s linear infinite;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* center dot */
    .center-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #3498db;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* LOCK EFFECT */
    .lock {
      animation: lockFlash 0.6s ease 2;
    }

    @keyframes lockFlash {
      0% { transform: scale(1); background: rgba(0,255,0,0.1); }
      50% { transform: scale(1.2); background: rgba(0,255,0,0.4); }
      100% { transform: scale(1); background: rgba(0,255,0,0.1); }
    }

  </style>
</head>

<body>

<h2>ABSENSI</h2>

<div class="card">

  <div id="statusText" class="status red">Mencari lokasi...</div>

  <!-- RADAR -->
  <div class="radar" id="radar">
    <div class="sweep"></div>
    <div class="center-dot" id="dot"></div>
  </div>

  <p>Jarak: <span id="jarak">-</span></p>
  <p>Akurasi: <span id="akurasi">-</span></p>

  <button id="btnAbsen" disabled>ABSEN</button>

</div>

<script>

const TARGET_LAT = -6.2341459;
const TARGET_LNG = 106.4997284;
const RADIUS = 50;

let locked = false;

// ===== HITUNG JARAK =====
function hitungJarak(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI/180;
  const dLon = (lon2 - lon1) * Math.PI/180;

  const a = Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// ===== GPS =====
navigator.geolocation.watchPosition(pos => {

  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;
  let accuracy = pos.coords.accuracy;

  let jarak = hitungJarak(lat, lng, TARGET_LAT, TARGET_LNG);

  document.getElementById("jarak").innerText = Math.round(jarak) + " m";
  document.getElementById("akurasi").innerText = "± " + Math.round(accuracy) + " m";

  // efek makin dekat makin cepat
  let speed = Math.max(0.5, jarak / 100);
  document.querySelector(".sweep").style.animationDuration = speed + "s";

  // ===== LOCK TARGET =====
  if (jarak <= RADIUS && !locked) {

    locked = true;

    let radar = document.getElementById("radar");

    radar.classList.add("lock");

    document.getElementById("statusText").innerText = "TARGET TERKUNCI";
    document.getElementById("statusText").className = "status green";

    document.getElementById("dot").style.background = "green";

    let btn = document.getElementById("btnAbsen");
    btn.disabled = false;
    btn.classList.add("active");
  }

}, err => {
  alert("GPS ERROR: " + err.message);
},{
  enableHighAccuracy: true,
  maximumAge: 3000,
  timeout: 15000
});

</script>

</body>
</html>
