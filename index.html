<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi NFC</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      background: green;
      color: white;
      border: none;
      border-radius: 10px;
    }

    .box {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h2>ABSENSI NFC</h2>

<button onclick="scanNFC()">SCAN KARTU</button>

<div class="box">
  <p id="hasil">UID: -</p>
  <p id="server">Server: -</p>
</div>

<script>

async function scanNFC() {

  try {

    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("hasil").innerText = "Tempel kartu...";

    ndef.onreading = async (event) => {

      let text = "";

      for (const record of event.message.records) {

        // 🔥 ambil TEXT dari kartu
        if (record.recordType === "text") {

          const data = new Uint8Array(record.data);
          const langLength = data[0]; // skip bahasa (contoh: en)

          const textDecoder = new TextDecoder("utf-8");
          text = textDecoder.decode(data.slice(1 + langLength));
        }
      }

      // kalau kosong
      if (text === "") {
        document.getElementById("hasil").innerText = "Kartu kosong / salah format";
        return;
      }

      document.getElementById("hasil").innerText = "UID: " + text;

      // 🔥 KIRIM KE APPS SCRIPT
      let res = await fetch("https://script.google.com/macros/s/AKfycbyrlWCsEXuAFpv0qdAw7JLclCjjooQ3MT3wg3LKgT0CxWEa9mBGOw_9QF83mrR3toY/exec", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          uid: text
        })
      });

      let data = await res.json();

      document.getElementById("server").innerText =
        "Server: " + JSON.stringify(data);

    };

  } catch (err) {
    alert("HP tidak support NFC / belum aktif");
    console.log(err);
  }

}

</script>

</body>
</html>
