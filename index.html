<!DOCTYPE html>
<html>
<head>
  <title>Absensi Karyawan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ICON -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .hidden { display: none; }

    .btn {
      padding: 10px 16px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
    }

    .progress {
      height: 4px;
      background: #1e293b;
      margin-top: 15px;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #22c55e;
    }

    video {
      width: 100%;
      border-radius: 10px;
    }

    img {
      width: 100px;
      border-radius: 10px;
      margin: 5px;
    }

    /* RADAR */
    .radar {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 2px solid #22c55e;
      margin: 20px auto;
      position: relative;
      overflow: hidden;
    }

    .radar::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(34,197,94,0.3) 0%, transparent 70%);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.5); opacity: 0.8; }
      100% { transform: scale(1.5); opacity: 0; }
    }
  </style>
</head>

<body>

<!-- ================= SCAN ================= -->
<div id="scanPage">
  <h2><i class="fa-solid fa-id-card"></i> Absensi</h2>
  <p>UID: <span id="uid">-</span></p>
  <button class="btn" onclick="startScan()">Scan Kartu</button>
  <p id="status">Menunggu...</p>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>
</div>

<!-- ================= LOKASI ================= -->
<div id="locationPage" class="hidden">
  <h3>📍 Cek Lokasi</h3>

  <div class="radar"></div>

  <p id="locationStatus">Mengambil GPS...</p>
</div>

<!-- ================= KAMERA ================= -->
<div id="cameraPage" class="hidden">
  <h3>📸 Ambil Foto</h3>
  <video id="video" autoplay playsinline></video>
  <p id="cameraStatus">Arahkan wajah ke kamera</p>
</div>

<!-- ================= RESULT ================= -->
<div id="resultPage" class="hidden">
  <h3>✅ Berhasil</h3>
  <p id="nama"></p>
  <p id="gudang"></p>

  <div>
    <img id="fotoDB">
    <img id="fotoSelfie">
  </div>
</div>

<script>

let stream;

/* ================= PROGRESS ================= */
function loading(p) {
  document.getElementById("bar").style.width = p + "%";
}

/* ================= RESET ================= */
function resetUI() {
  document.getElementById("scanPage").classList.remove("hidden");
  document.getElementById("locationPage").classList.add("hidden");
  document.getElementById("cameraPage").classList.add("hidden");
  document.getElementById("resultPage").classList.add("hidden");

  document.getElementById("uid").innerText = "-";
  document.getElementById("status").innerText = "Menunggu...";
  loading(0);
}

/* ================= RESULT ================= */
function showResult(data, foto) {

  document.getElementById("nama").innerText = "Nama: " + data.nama;
  document.getElementById("gudang").innerText = "Gudang: " + data.gudang;
  document.getElementById("fotoDB").src = data.fotoDB;
  document.getElementById("fotoSelfie").src = foto;

  document.getElementById("cameraPage").classList.add("hidden");
  document.getElementById("resultPage").classList.remove("hidden");

  setTimeout(resetUI, 3000);
}

/* ================= FOTO ================= */
function ambilFoto(video) {

  let canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  let ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);

  let foto = canvas.toDataURL("image/jpeg");

  kirimData(foto);
}

/* ================= DETEKSI WAJAH ================= */
async function tungguWajah(video) {

  if (!("FaceDetector" in window)) {
    setTimeout(() => ambilFoto(video), 2000);
    return;
  }

  const detector = new FaceDetector();

  const interval = setInterval(async () => {
    const faces = await detector.detect(video);

    if (faces.length > 0) {
      clearInterval(interval);
      document.getElementById("cameraStatus").innerText = "Wajah terdeteksi";
      setTimeout(() => ambilFoto(video), 800);
    }
  }, 300);
}

/* ================= KIRIM ================= */
async function kirimData(foto) {

  loading(80);

  let res = await fetch("https://script.google.com/macros/s/AKfycbxQYvZIxsv-KrVS2k3wKtmAtq3iOQuoz2PErPJP764YIvOiKv8lvx8IcFO44-tQc4A/exec", {
    method: "POST",
    body: JSON.stringify({
      uid: window.uid,
      lat: Number(window.lat),
      lng: Number(window.lng),
      foto: foto
    })
  });

  let data = await res.json();

  stream.getTracks().forEach(t => t.stop());

  loading(100);

  if (data.status === "SUCCESS") {
    showResult(data, foto);
  }

  if (data.status === "OUT_OF_RANGE") {
    alert("Diluar area (" + data.jarak + "m)");
    resetUI();
  }

  if (data.status === "NOT_REGISTERED") {
    alert("Kartu tidak terdaftar");
    resetUI();
  }

}

/* ================= LOKASI ================= */
function ambilLokasi() {

  document.getElementById("scanPage").classList.add("hidden");
  document.getElementById("locationPage").classList.remove("hidden");

  navigator.geolocation.getCurrentPosition((pos) => {

    window.lat = parseFloat(pos.coords.latitude);
    window.lng = parseFloat(pos.coords.longitude);

    console.log("LAT:", window.lat);
    console.log("LNG:", window.lng);

    if (isNaN(window.lat) || isNaN(window.lng)) {
      alert("Lokasi gagal");
      resetUI();
      return;
    }

    document.getElementById("locationStatus").innerText = "Lokasi ditemukan";

    setTimeout(startCamera, 1000);

  }, () => {
    alert("GPS tidak aktif");
    resetUI();
  });

}

/* ================= CAMERA ================= */
async function startCamera() {

  document.getElementById("locationPage").classList.add("hidden");
  document.getElementById("cameraPage").classList.remove("hidden");

  stream = await navigator.mediaDevices.getUserMedia({ video: true });

  let video = document.getElementById("video");
  video.srcObject = stream;

  tungguWajah(video);
}

/* ================= NFC ================= */
async function startScan() {

  try {

    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("status").innerText = "Tempel kartu...";
    loading(20);

    ndef.onreading = (event) => {

      window.uid = event.serialNumber;

      document.getElementById("uid").innerText = window.uid;

      loading(40);

      ambilLokasi();

    };

  } catch (err) {
    alert("HP tidak support NFC");
  }

}

</script>

</body>
</html>
