<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: black;
      color: #00ff66;
      font-family: monospace;
      text-align: center;
    }

    h2 {
      margin-top: 20px;
    }

    .radar {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 20px auto;
      border-radius: 50%;
      background: radial-gradient(circle, #001a00, #000);
      box-shadow: 0 0 20px #00ff66 inset;
      overflow: hidden;
    }

    .ring {
      position: absolute;
      border: 1px solid rgba(0,255,100,0.3);
      border-radius: 50%;
    }

    .ring:nth-child(1) { width: 100%; height: 100%; }
    .ring:nth-child(2) { width: 75%; height: 75%; top: 12.5%; left: 12.5%; }
    .ring:nth-child(3) { width: 50%; height: 50%; top: 25%; left: 25%; }
    .ring:nth-child(4) { width: 25%; height: 25%; top: 37.5%; left: 37.5%; }

    .sweep {
      position: absolute;
      width: 100%;
      height: 100%;
      background: conic-gradient(rgba(0,255,100,0.4), transparent 60%);
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .center {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #00ff66;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .target {
      position: absolute;
      width: 10px;
      height: 10px;
      background: red;
      border-radius: 50%;
      transition: 0.2s linear;
    }

    .crosshair {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 2px solid #00ff66;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
    }

    .crosshair::before,
    .crosshair::after {
      content: "";
      position: absolute;
      background: #00ff66;
    }

    .crosshair::before {
      width: 2px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
    }

    .crosshair::after {
      height: 2px;
      width: 100%;
      top: 50%;
      transform: translateY(-50%);
    }

    .status {
      font-size: 18px;
      margin-top: 10px;
    }

    .lock {
      color: lime;
      font-weight: bold;
    }

    .error {
      color: red;
    }

    button {
      margin-top: 15px;
      padding: 12px;
      width: 80%;
      font-size: 18px;
      background: #003300;
      color: #00ff66;
      border: 1px solid #00ff66;
      border-radius: 8px;
    }

    button.active {
      background: #00aa00;
      color: white;
    }

  </style>
</head>

<body>

<h2>ABSENSI</h2>

<div class="radar">
  <div class="sweep"></div>

  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>

  <div class="center"></div>
  <div class="target" id="target"></div>
  <div class="crosshair" id="crosshair"></div>
</div>

<div id="status" class="status">MENCARI TARGET...</div>

<div>Jarak: <span id="jarak">-</span></div>
<div>Akurasi: <span id="akurasi">-</span></div>

<button id="btnAbsen" disabled>ABSEN</button>

<script>

const TARGET_LAT = -6.2341459;
const TARGET_LNG = 106.4997284;
const RADIUS = 50;

let locked = false;
let firstFix = false;

// ===== HITUNG JARAK =====
function distance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;

  const a = Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ===== UPDATE UI =====
function updateUI(lat, lng, acc) {

  let d = distance(lat, lng, TARGET_LAT, TARGET_LNG);

  document.getElementById("jarak").innerText = Math.round(d) + " m";
  document.getElementById("akurasi").innerText = "± " + Math.round(acc) + " m";

  document.getElementById("status").innerText = "MENCARI TARGET...";

  let dx = TARGET_LNG - lng;
  let dy = TARGET_LAT - lat;

  let scale = 120000;

  let x = dx * scale;
  let y = dy * scale;

  let max = 110;
  x = Math.max(-max, Math.min(max, x));
  y = Math.max(-max, Math.min(max, y));

  let target = document.getElementById("target");
  target.style.left = (130 + x) + "px";
  target.style.top = (130 - y) + "px";

  if (d <= RADIUS && !locked) {
    locked = true;

    document.getElementById("status").innerText = "TARGET LOCK";
    document.getElementById("status").classList.add("lock");

    document.getElementById("crosshair").style.display = "block";

    let btn = document.getElementById("btnAbsen");
    btn.disabled = false;
    btn.classList.add("active");
  }
}

// ===== GET FIRST FIX =====
navigator.geolocation.getCurrentPosition(
  pos => {
    firstFix = true;
    updateUI(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
  },
  err => {
    document.getElementById("status").innerText = "IZINKAN LOKASI / AKTIFKAN GPS";
  },
  { enableHighAccuracy: true, timeout: 10000 }
);

// ===== REALTIME TRACK =====
navigator.geolocation.watchPosition(
  pos => {
    firstFix = true;
    updateUI(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
  },
  err => {
    document.getElementById("status").innerText = "GPS ERROR: " + err.message;
    document.getElementById("status").classList.add("error");
  },
  {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 15000
  }
);

// ===== FALLBACK =====
setTimeout(() => {
  if (!firstFix) {
    document.getElementById("status").innerText =
      "MENUNGGU GPS... PINDAH KE LUAR RUANGAN";
  }
}, 8000);

</script>

</body>
</html>
