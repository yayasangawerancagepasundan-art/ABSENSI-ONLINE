<!DOCTYPE html>
<html>
<head>
  <title>Absensi Karyawan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }
    button {
      padding: 15px 25px;
      font-size: 18px;
      background: green;
      color: white;
      border: none;
      border-radius: 10px;
    }
    .box {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h2>ABSENSI KARYAWAN</h2>

  <button onclick="kirim()">KIRIM ABSENSI</button>

  <div class="box">
    <p id="status">Status: -</p>
    <p id="nama">Nama: -</p>
    <p id="gudang">Gudang: -</p>
  </div>

<script>

async function kirim() {

  document.getElementById("status").innerText = "Ambil lokasi...";

  navigator.geolocation.getCurrentPosition(async function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    // UID sementara (nanti diganti NFC)
    let uid = "dd:b0:b2:06";

    document.getElementById("status").innerText = "Kirim ke server...";

    let res = await fetch("https://script.google.com/macros/s/AKfycbxQYvZIxsv-KrVS2k3wKtmAtq3iOQuoz2PErPJP764YIvOiKv8lvx8IcFO44-tQc4A/exec", {
      method: "POST",
      body: JSON.stringify({
        uid: uid,
        lat: lat,
        lng: lng
      })
    });

    let data = await res.json();

    if (data.status == "SUCCESS") {
      document.getElementById("status").innerText = "Berhasil";
      document.getElementById("nama").innerText = "Nama: " + data.nama;
      document.getElementById("gudang").innerText = "Gudang: " + data.gudang;
    } else {
      document.getElementById("status").innerText = "Tidak terdaftar";
    }

  }, function() {
    alert("Gagal ambil lokasi");
  });

}

</script>

</body>
</html>
