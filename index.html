<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi</title>

<style>
body{
  background:#0b1a2e;
  color:white;
  text-align:center;
  font-family:Arial;
}
.hidden{display:none}
video{width:90%;border-radius:10px;background:black;}
button{padding:10px 18px;background:#22c55e;border:none;border-radius:8px;color:white;}
</style>

</head>

<body>

<!-- SCAN -->
<div id="scanPage">
<h2>ABSENSI</h2>
<p>UID: <span id="uid">-</span></p>
<button onclick="startScan()">SCAN KARTU</button>
<p id="status">Menunggu...</p>
</div>

<!-- LOKASI -->
<div id="locationPage" class="hidden">
<h3>📍 Cek Lokasi</h3>
<p id="locStatus">Mengambil lokasi...</p>
</div>

<!-- KAMERA -->
<div id="cameraPage" class="hidden">
<h3>📸 Kamera</h3>
<video id="video" autoplay playsinline></video>
<p id="camStatus">Menyiapkan kamera...</p>
</div>

<!-- RESULT -->
<div id="resultPage" class="hidden">
<h3>✅ Berhasil</h3>
<p id="nama"></p>
<p id="gudang"></p>
<img id="fotoSelfie" width="120">
</div>

<script>

let stream;
const URL = "https://script.google.com/macros/s/AKfycbznCmA9JKgrMSklIBvN8y7fpqGJt1jNSNUEu9hfGmCgGV5bMhAQPfzFqaB_leRqLis/exec";

/* =====================
   SCAN (SIMULASI)
===================== */
function startScan(){
  let uid = "dd:b0:b2:06"; // test UID
  window.uid = uid;

  document.getElementById("uid").innerText = uid;

  document.getElementById("scanPage").classList.add("hidden");
  document.getElementById("locationPage").classList.remove("hidden");

  getLocation();
}

/* =====================
   LOKASI
===================== */
function getLocation(){

navigator.geolocation.getCurrentPosition(async (pos)=>{

  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;

  window.lat = lat;
  window.lng = lng;

  document.getElementById("locStatus").innerText="Validasi lokasi...";

  try{

    let res = await fetch(URL+"?uid="+window.uid+"&lat="+lat+"&lng="+lng);
    let data = await res.json();

    if(data.status === "IN_RANGE"){
      openCamera();
    }else{
      document.getElementById("locStatus").innerText="Diluar area ❌";
    }

  }catch(e){
    alert("Gagal koneksi lokasi");
  }

});

}

/* =====================
   KAMERA
===================== */
async function openCamera(){

document.getElementById("locationPage").classList.add("hidden");
document.getElementById("cameraPage").classList.remove("hidden");

stream = await navigator.mediaDevices.getUserMedia({video:true});

let video = document.getElementById("video");
video.srcObject = stream;

setTimeout(()=>{
  takePhoto(video);
},2000);

}

/* =====================
   FOTO (🔥 SUDAH FIX)
===================== */
function takePhoto(video){

let canvas = document.createElement("canvas");

/* 🔥 KUNCI FIX DI SINI */
canvas.width = 320;
canvas.height = 240;

let ctx = canvas.getContext("2d");
ctx.drawImage(video,0,0,320,240);

/* 🔥 KOMPRES */
let foto = canvas.toDataURL("image/jpeg",0.5);

sendData(foto);

}

/* =====================
   KIRIM DATA
===================== */
async function sendData(foto){

try{

let res = await fetch(URL,{
  method:"POST",
  headers:{
    "Content-Type":"application/json"
  },
  body:JSON.stringify({
    uid:window.uid,
    lat:window.lat,
    lng:window.lng,
    foto:foto
  })
});

let data = await res.json();

stream.getTracks().forEach(t=>t.stop());

if(data.status==="SUCCESS"){

  document.getElementById("cameraPage").classList.add("hidden");
  document.getElementById("resultPage").classList.remove("hidden");

  document.getElementById("nama").innerText="Berhasil Absen";
  document.getElementById("gudang").innerText="Lokasi OK";
  document.getElementById("fotoSelfie").src=foto;

}else{
  alert("Server error: "+data.msg);
}

}catch(e){
  alert("Gagal kirim data");
}

}

</script>

</body>
</html>
