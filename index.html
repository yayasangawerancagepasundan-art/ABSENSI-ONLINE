<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI NFC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h2 {
      margin-top: 20px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      background: green;
      color: white;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
    }

    .box {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      text-align: left;
    }
  </style>
</head>

<body>

<h2>ABSENSI NFC</h2>

<button onclick="scanNFC()">SCAN KARTU</button>

<div class="box">
  <p id="info">Status: -</p>
  <p id="raw">RAW: -</p>
  <p id="uid">UID: -</p>
  <p id="server">Server: -</p>
</div>

<script>

async function scanNFC() {
  try {
    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("info").innerText = "Dekatkan kartu NFC...";

    ndef.onreading = event => {

      let uidText = "";
      let rawText = "";

      try {
        for (const record of event.message.records) {

          // tampilkan raw HEX
          let dataArray = new Uint8Array(record.data);
          rawText = Array.from(dataArray)
            .map(b => b.toString(16).padStart(2, '0'))
            .join(' ');

          console.log("RAW:", rawText);

          // decode TEXT record
          if (record.recordType === "text") {

            const decoder = new TextDecoder(record.encoding || "utf-8");

            let langLength = dataArray[0] & 0x3F;

            uidText = decoder.decode(dataArray.slice(1 + langLength));
          }

          // fallback kalau gagal
          if (!uidText) {
            let fallback = new TextDecoder().decode(dataArray);
            uidText = fallback.replace(/[^\x20-\x7E]/g, "");
          }
        }

      } catch (e) {
        console.log("Decode error:", e);
      }

      // tampilkan hasil
      document.getElementById("raw").innerText = "RAW: " + rawText;

      if (!uidText) {
        document.getElementById("uid").innerText = "UID: GAGAL BACA";
        return;
      }

      document.getElementById("uid").innerText = "UID: " + uidText;
      document.getElementById("info").innerText = "Kartu terbaca";

      // kirim ke server
      kirimKeServer(uidText);
    };

  } catch (err) {
    alert("HP tidak support NFC / izin ditolak");
    console.log(err);
  }
}

async function kirimKeServer(uid) {

  document.getElementById("info").innerText = "Kirim ke server...";

  try {
    let res = await fetch("https://script.google.com/macros/s/AKfycbyrlWCsEXuAFpv0qdAw7JLclCjjooQ3MT3wg3LKgT0CxWEa9mBGOw_9QF83mrR3toY/exec", {
      method: "POST",
      body: JSON.stringify({
        uid: uid
      })
    });

    let data = await res.json();

    document.getElementById("server").innerText =
      "Server: " + JSON.stringify(data);

    document.getElementById("info").innerText = "Selesai";

  } catch (e) {
    document.getElementById("server").innerText = "Server: ERROR";
    console.log(e);
  }
}

</script>

</body>
</html>
