<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Absensi Karyawan</title>

<style>
body {
  font-family: Arial;
  text-align:center;
  background: linear-gradient(rgba(90,160,210,0.9), rgba(70,130,200,0.9));
  color:white;
}

.box {
  max-width:400px;
  margin:auto;
  padding:20px;
}

input, button {
  width:90%;
  padding:12px;
  margin:6px;
  font-size:16px;
  border-radius:10px;
  border:none;
}

button {
  background:white;
  color:#2f6fa3;
  font-weight:bold;
}

.card {
  background: rgba(255,255,255,0.2);
  padding:20px;
  border-radius:15px;
}

img {
  width:150px;
  border-radius:10px;
}

.hidden {
  display:none;
}
</style>
</head>

<body>

<div class="box">

<!-- HALAMAN ABSEN -->
<div id="pageAbsen">

<h2>ABSENSI KARYAWAN</h2>

<input id="uid" placeholder="Scan UID">

<input type="file" accept="image/*" capture="user" id="fotoSelfie">

<button onclick="absen()">ABSEN</button>

<p id="status"></p>

</div>

<!-- HALAMAN HASIL -->
<div id="pageHasil" class="hidden">

<h2>INFORMASI KARYAWAN</h2>

<div class="card">
  <img id="foto">
  <h3 id="nama"></h3>
  <p id="jabatan"></p>
  <p id="info"></p>
</div>

<button onclick="resetApp()">🔄 Scan Lagi</button>

</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxEzs-krfZ8i12sbVaw5bo_HQEY7HNKxcIXpBmcdDpNvR8ckTgypRqz46gmX1590EM/exec";

let isProcessing = false;

/* ============================= */
async function absen() {

  if (isProcessing) return;
  isProcessing = true;

  let status = document.getElementById("status");
  let uid = document.getElementById("uid").value.trim().toLowerCase();

  if (!uid) {
    status.innerHTML = "❌ UID kosong";
    isProcessing = false;
    return;
  }

  let file = document.getElementById("fotoSelfie").files[0];
  if (!file) {
    status.innerHTML = "❌ Selfie wajib";
    isProcessing = false;
    return;
  }

  status.innerHTML = "📍 Ambil lokasi...";

  navigator.geolocation.getCurrentPosition(async (pos) => {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    let base64 = await toBase64(file);

    status.innerHTML = "⏳ Mengirim data...";

    try {

      let res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          uid: uid,
          lat: lat,
          lng: lng,
          foto: base64
        }),
        headers: {
          "Content-Type": "application/json"
        }
      });

      // 🔥 ambil text dulu (biar tidak error parsing)
      let text = await res.text();
      console.log("RESPONSE:", text);

      let data = JSON.parse(text);

      if (data.status === "success") {

        // 🔥 PINDAH HALAMAN
        document.getElementById("pageAbsen").classList.add("hidden");
        document.getElementById("pageHasil").classList.remove("hidden");

        document.getElementById("nama").innerText = data.nama;
        document.getElementById("jabatan").innerText = data.jabatan;
        document.getElementById("foto").src = URL.createObjectURL(file);
        document.getElementById("info").innerText =
          data.tipe + " | " + new Date().toLocaleTimeString();

        status.innerHTML = "✅ Berhasil";

      } else {
        status.innerHTML = "❌ " + data.message;
      }

    } catch (err) {
      console.error(err);
      status.innerHTML = "❌ ERROR KONEKSI";
    }

    isProcessing = false;

  }, () => {
    status.innerHTML = "❌ GPS gagal";
    isProcessing = false;
  });
}

/* ============================= */
function toBase64(file) {
  return new Promise((resolve) => {
    let reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.readAsDataURL(file);
  });
}

/* ============================= */
function resetApp() {
  location.reload();
}

</script>

</body>
</html>
