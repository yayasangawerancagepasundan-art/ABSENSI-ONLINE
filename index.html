<script>
async function scanNFC(){
  try{
    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("hasil").innerText = "Tempel kartu...";

    ndef.onreading = event => {

      document.getElementById("hasil").innerText =
        "SERIAL: " + event.serialNumber;

    };

  }catch(error){
    document.getElementById("hasil").innerText = "ERROR: " + error;
  }
}
</script>
