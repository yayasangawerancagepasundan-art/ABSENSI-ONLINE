<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi NFC</title>

<style>
body{
  background:#0b1a2e;
  color:white;
  text-align:center;
  font-family:Arial;
}

.hidden{display:none}

/* RADAR */
.radar-box{
  position:relative;
  width:220px;
  height:220px;
  margin:40px auto;
  border-radius:50%;
  border:2px solid #22c55e;
  overflow:hidden;
}

.radar-line{
  position:absolute;
  width:50%;
  height:2px;
  background:#22c55e;
  top:50%;
  left:50%;
  transform-origin:left center;
  animation:spin 2s linear infinite;
}

@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

.dot{
  width:12px;
  height:12px;
  background:#22c55e;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

button{
  padding:10px 18px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  color:white;
}

video{
  width:90%;
  border-radius:10px;
  background:black;
}
</style>
</head>

<body>

<!-- SCAN -->
<div id="scanPage">
<h2>ABSENSI</h2>
<p>UID: <span id="uid">-</span></p>
<button onclick="startScan()">SCAN KARTU</button>
<p id="status">Menunggu...</p>
</div>

<!-- LOKASI -->
<div id="locationPage" class="hidden">
<h3>📍 Cek Lokasi</h3>

<div class="radar-box">
  <div class="radar-line"></div>
  <div class="dot"></div>
</div>

<p id="locStatus">Mengambil lokasi...</p>
<p id="jarak">-</p>
</div>

<!-- CAMERA -->
<div id="cameraPage" class="hidden">
<h3>📸 Ambil Foto</h3>
<video id="video" autoplay playsinline></video>
<p id="camStatus">Menyiapkan kamera...</p>
</div>

<!-- RESULT -->
<div id="resultPage" class="hidden">
<h3>✅ Berhasil</h3>
<p id="nama"></p>
<p id="gudang"></p>
<img id="fotoDB" width="100">
<img id="fotoSelfie" width="100">
</div>

<script>

/* =====================
   CONFIG
===================== */
const URL = "https://script.google.com/macros/s/AKfycbxEzs-krfZ8i12sbVaw5bo_HQEY7HNKxcIXpBmcdDpNvR8ckTgypRqz46gmX1590EM/exec";

let stream;

/* =====================
   DEBUG
===================== */
function debug(title,data){
  console.log("==== "+title+" ====");
  console.log(data);
}

/* =====================
   NFC
===================== */
async function startScan(){

  try{
    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("status").innerText="Tempel kartu...";

    ndef.onreading = (event)=>{

      window.uid = event.serialNumber;
      debug("UID", window.uid);

      document.getElementById("uid").innerText = window.uid;

      document.getElementById("scanPage").classList.add("hidden");
      document.getElementById("locationPage").classList.remove("hidden");

      getLocation();
    }

  }catch(e){
    alert("HP tidak support NFC");
  }
}

/* =====================
   LOKASI
===================== */
function getLocation(){

navigator.geolocation.getCurrentPosition(async (pos)=>{

  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;

  window.lat = lat;
  window.lng = lng;

  debug("LOKASI",{lat,lng});

  document.getElementById("locStatus").innerText="Validasi lokasi...";

  try{

    let res = await fetch(URL,{
      method:"POST",
      body:JSON.stringify({
        mode:"cek",
        uid:window.uid,
        lat:lat,
        lng:lng
      })
    });

    let data = await res.json();
    debug("RESPON CEK",data);

    document.getElementById("jarak").innerText="Jarak: "+Math.round(data.jarak)+" m";

    if(data.status==="VALID" || data.status==="SUCCESS"){
      document.getElementById("locStatus").innerText="Dalam area";
      setTimeout(openCamera,1000);
    }else{
      document.getElementById("locStatus").innerText="Diluar area ❌";
      alert("Diluar area: "+Math.round(data.jarak)+" m");
    }

  }catch(e){
    alert("Gagal koneksi server (cek lokasi)");
    debug("ERROR LOKASI",e);
  }

});
}

/* =====================
   CAMERA
===================== */
async function openCamera(){

document.getElementById("locationPage").classList.add("hidden");
document.getElementById("cameraPage").classList.remove("hidden");

try{

stream = await navigator.mediaDevices.getUserMedia({video:true});

let video = document.getElementById("video");
video.srcObject = stream;

document.getElementById("camStatus").innerText="Ambil foto...";

setTimeout(()=>{
  takePhoto(video);
},2000);

}catch(e){
  alert("Gagal buka kamera");
  debug("ERROR CAMERA",e);
}

}

/* =====================
   FOTO
===================== */
function takePhoto(video){

let canvas = document.createElement("canvas");
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

let ctx = canvas.getContext("2d");
ctx.drawImage(video,0,0);

let foto = canvas.toDataURL("image/jpeg");

debug("FOTO SIZE", foto.length);

sendData(foto);

}

/* =====================
   KIRIM DATA
===================== */
async function sendData(foto){

try{

debug("KIRIM DATA",{
  uid:window.uid,
  lat:window.lat,
  lng:window.lng
});

let res = await fetch(URL,{
  method:"POST",
  body:JSON.stringify({
    uid:window.uid,
    lat:window.lat,
    lng:window.lng,
    foto:foto
  })
});

let data = await res.json();
debug("RESPON SERVER",data);

stream.getTracks().forEach(t=>t.stop());

if(data.status==="SUCCESS"){

  document.getElementById("cameraPage").classList.add("hidden");
  document.getElementById("resultPage").classList.remove("hidden");

  document.getElementById("nama").innerText=data.nama;
  document.getElementById("gudang").innerText=data.gudang;
  document.getElementById("fotoDB").src=data.fotoDB;
  document.getElementById("fotoSelfie").src=foto;

}else{
  alert("Server: "+data.status);
}

}catch(e){
  alert("Gagal kirim ke server");
  debug("ERROR SEND",e);
}

}

</script>
</body>
</html>
