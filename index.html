<!DOCTYPE html>
<html>
<head>
  <title>Absensi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ICON -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    .btn {
      padding: 10px 16px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
    }

    .progress {
      height: 4px;
      background: #1e293b;
      margin-top: 15px;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #22c55e;
    }

    img {
      width: 90px;
      border-radius: 10px;
      margin: 5px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<!-- =========================
     HALAMAN SCAN
========================= -->
<div id="scanPage">

  <h2><i class="fa-solid fa-id-card"></i> Absensi</h2>

  <!-- UID tampil (tidak bisa diedit) -->
  <p>UID: <span id="uid">-</span></p>

  <button class="btn" onclick="startScan()">Scan Kartu</button>

  <p id="status">Menunggu...</p>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

</div>

<!-- =========================
     HALAMAN HASIL
========================= -->
<div id="resultPage" class="hidden">

  <h3>✅ Berhasil</h3>

  <p id="nama"></p>
  <p id="gudang"></p>

  <div>
    <img id="fotoDB">
    <img id="fotoSelfie">
  </div>

</div>

<script>

let stream;

/* =========================
   PROGRESS BAR
========================= */
function loading(persen) {
  document.getElementById("bar").style.width = persen + "%";
}

/* =========================
   PINDAH KE HALAMAN HASIL
========================= */
function showResult(data, foto) {

  document.getElementById("nama").innerText = "Nama: " + data.nama;
  document.getElementById("gudang").innerText = "Gudang: " + data.gudang;
  document.getElementById("fotoDB").src = data.fotoDB;
  document.getElementById("fotoSelfie").src = foto;

  document.getElementById("scanPage").classList.add("hidden");
  document.getElementById("resultPage").classList.remove("hidden");

  // kembali ke awal setelah 3 detik
  setTimeout(resetUI, 3000);
}

/* =========================
   RESET UI
========================= */
function resetUI() {

  document.getElementById("scanPage").classList.remove("hidden");
  document.getElementById("resultPage").classList.add("hidden");

  document.getElementById("uid").innerText = "-";
  document.getElementById("status").innerText = "Menunggu...";
  document.getElementById("bar").style.width = "0%";

}

/* =========================
   AMBIL FOTO
========================= */
function ambilFoto(video) {

  let canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  let ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);

  let foto = canvas.toDataURL("image/jpeg");

  kirimData(foto);
}

/* =========================
   DETEKSI WAJAH
========================= */
async function tungguWajah(video) {

  // cek apakah HP support face detection
  if (!("FaceDetector" in window)) {

    document.getElementById("status").innerText = "Mode standar...";

    // fallback: tetap foto tapi delay
    setTimeout(() => ambilFoto(video), 1500);
    return;
  }

  const detector = new FaceDetector();

  document.getElementById("status").innerText = "Arahkan wajah...";

  const interval = setInterval(async () => {

    const faces = await detector.detect(video);

    // kalau wajah terdeteksi
    if (faces.length > 0) {

      clearInterval(interval);

      document.getElementById("status").innerText = "Wajah terdeteksi";

      // delay sedikit biar posisi stabil
      setTimeout(() => {
        ambilFoto(video);
      }, 800);

    }

  }, 300);
}

/* =========================
   KIRIM DATA KE SERVER
========================= */
async function kirimData(foto) {

  loading(70);
  document.getElementById("status").innerText = "Kirim data...";

  let res = await fetch("https://script.google.com/macros/s/AKfycbxQYvZIxsv-KrVS2k3wKtmAtq3iOQuoz2PErPJP764YIvOiKv8lvx8IcFO44-tQc4A/exec", {
    method: "POST",
    body: JSON.stringify({
      uid: window.uid,
      lat: window.lat,
      lng: window.lng,
      foto: foto
    })
  });

  let data = await res.json();

  // matikan kamera
  stream.getTracks().forEach(t => t.stop());

  loading(100);

  if (data.status === "SUCCESS") {
    showResult(data, foto);
  }

  if (data.status === "OUT_OF_RANGE") {
    document.getElementById("status").innerText =
      "Diluar area (" + Math.round(data.jarak) + "m)";
  }

  if (data.status === "NOT_REGISTERED") {
    document.getElementById("status").innerText =
      "Kartu tidak terdaftar";
  }

}

/* =========================
   START NFC
========================= */
async function startScan() {

  try {

    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("status").innerText = "Tempel kartu...";
    loading(10);

    ndef.onreading = async (event) => {

      // ambil UID kartu
      let uid = event.serialNumber;
      window.uid = uid;

      document.getElementById("uid").innerText = uid;

      loading(30);
      document.getElementById("status").innerText = "Ambil lokasi...";

      navigator.geolocation.getCurrentPosition(async (pos) => {

        window.lat = pos.coords.latitude;
        window.lng = pos.coords.longitude;

        loading(50);
        document.getElementById("status").innerText = "Buka kamera...";

        // buka kamera
        stream = await navigator.mediaDevices.getUserMedia({ video: true });

        let video = document.createElement("video");
        video.srcObject = stream;
        video.play();

        // tunggu wajah sebelum foto
        tungguWajah(video);

      });

    };

  } catch (err) {
    alert("HP tidak support NFC");
  }

}

</script>

</body>
</html>
