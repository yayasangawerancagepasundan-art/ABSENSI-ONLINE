<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi NFC + Selfie</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #5dade2; /* 🔵 biru muda */
  color: white;
  margin: 0;
}

/* 🔥 Background logo */
body::before {
  content: "";
  position: fixed;
  top: 50%;
  left: 50%;
  width: 300px;
  height: 300px;
  background: url('logo.png') no-repeat center;
  background-size: contain;
  opacity: 0.1;
  transform: translate(-50%, -50%);
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  max-width: 400px;
  margin: auto;
  padding: 20px;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  padding: 20px;
  border-radius: 15px;
  margin-top: 20px;
}

input, button {
  width: 90%;
  padding: 12px;
  margin: 6px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

button {
  background: #ffffff;
  color: #3498db;
  font-weight: bold;
}

/* halaman */
#pageAbsen { display: block; }
#pageHasil { display: none; }

img {
  width: 120px;
  border-radius: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<!-- =========================
   🔵 HALAMAN ABSEN
========================= -->
<div id="pageAbsen">
  <h2>ABSENSI KARYAWAN</h2>

  <div class="card">
    <input id="uid" placeholder="Scan / Input UID">

    <input type="file" accept="image/*" capture="user" id="fotoSelfie">

    <button onclick="absen()">ABSEN</button>
    <button onclick="scanNFC()">📶 Scan NFC</button>

    <p id="status"></p>
  </div>
</div>

<!-- =========================
   🟢 HALAMAN HASIL
========================= -->
<div id="pageHasil">
  <h2>INFORMASI KARYAWAN</h2>

  <div class="card">
    <img id="foto">
    <h3 id="nama"></h3>
    <p id="jabatan"></p>
    <p id="info"></p>

    <button onclick="kembali()">⬅️ Kembali</button>
  </div>
</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxEzs-krfZ8i12sbVaw5bo_HQEY7HNKxcIXpBmcdDpNvR8ckTgypRqz46gmX1590EM/exec";

/* =========================================
   📸 SELFIE + WATERMARK
========================================= */
async function prosesSelfie(lat, lng) {
  let file = document.getElementById("fotoSelfie").files[0];
  if (!file) return null;

  return new Promise((resolve) => {

    let img = new Image();
    let reader = new FileReader();

    reader.onload = e => img.src = e.target.result;

    img.onload = () => {

      let canvas = document.createElement("canvas");
      let ctx = canvas.getContext("2d");

      canvas.width = img.width;
      canvas.height = img.height;

      ctx.drawImage(img, 0, 0);

      ctx.fillStyle = "yellow";
      ctx.strokeStyle = "black";
      ctx.lineWidth = 3;
      ctx.font = "28px Arial";

      let waktu = new Date().toLocaleString();

      ctx.strokeText("Lat: " + lat.toFixed(6), 20, canvas.height - 90);
      ctx.fillText("Lat: " + lat.toFixed(6), 20, canvas.height - 90);

      ctx.strokeText("Lng: " + lng.toFixed(6), 20, canvas.height - 55);
      ctx.fillText("Lng: " + lng.toFixed(6), 20, canvas.height - 55);

      ctx.strokeText(waktu, 20, canvas.height - 20);
      ctx.fillText(waktu, 20, canvas.height - 20);

      canvas.toBlob(blob => resolve(blob), "image/jpeg", 0.9);
    };

    reader.readAsDataURL(file);
  });
}

/* =========================================
   🚀 ABSEN
========================================= */
async function absen() {

  let uid = document.getElementById("uid").value.trim().toLowerCase();
  let status = document.getElementById("status");

  if (!uid) {
    status.innerHTML = "❌ UID kosong";
    return;
  }

  let file = document.getElementById("fotoSelfie").files[0];
  if (!file) {
    status.innerHTML = "❌ Ambil selfie dulu";
    return;
  }

  status.innerHTML = "📍 Mengambil lokasi...";

  navigator.geolocation.getCurrentPosition(async (pos) => {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    let fotoBlob = await prosesSelfie(lat, lng);

    status.innerHTML = "⏳ Proses...";

    try {

      let res = await fetch(`${API_URL}?uid=${uid}`);
      let text = await res.text();
      let data = JSON.parse(text);

      if (data.status === "success") {

        let jarak = getDistance(lat, lng, data.lat, data.lng);

        if (jarak > 50) {
          status.innerHTML = "❌ Di luar radius (" + Math.round(jarak) + " m)";
          return;
        }

        // 🔥 PINDAH HALAMAN
        document.getElementById("pageAbsen").style.display = "none";
        document.getElementById("pageHasil").style.display = "block";

        document.getElementById("nama").innerText = data.nama;
        document.getElementById("jabatan").innerText = data.jabatan;

        document.getElementById("foto").src =
          URL.createObjectURL(fotoBlob);

        document.getElementById("info").innerText =
          "Masuk | " + new Date().toLocaleTimeString();

      } else {
        status.innerHTML = "❌ RFID tidak ditemukan";
      }

    } catch (err) {
      console.error(err);
      status.innerHTML = "❌ Error koneksi";
    }

  }, () => {
    status.innerHTML = "❌ GPS gagal";
  });
}

/* =========================================
   🔙 KEMBALI
========================================= */
function kembali() {
  document.getElementById("pageAbsen").style.display = "block";
  document.getElementById("pageHasil").style.display = "none";
}

/* =========================================
   📶 NFC
========================================= */
async function scanNFC() {
  if ('NDEFReader' in window) {
    const reader = new NDEFReader();
    await reader.scan();
    reader.onreading = e => {
      document.getElementById("uid").value = e.serialNumber;
    };
  } else {
    alert("HP tidak support NFC");
  }
}

/* =========================================
   📍 HITUNG JARAK
========================================= */
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;

  const a =
    Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)*Math.sin(dLon/2);

  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

</script>

</body>
</html>
