<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi NFC</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

/* RADAR */
.radar {
  width: 200px;
  height: 200px;
  border: 2px solid #22c55e;
  border-radius: 50%;
  margin: 30px auto;
  position: relative;
}

.scan {
  width: 100%;
  height: 100%;
  background: conic-gradient(#22c55e, transparent);
  border-radius: 50%;
  animation: spin 2s linear infinite;
}

.wave {
  position: absolute;
  width: 100%;
  height: 100%;
  border: 2px solid rgba(34,197,94,0.3);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

@keyframes pulse {
  0% { transform: scale(0.5); opacity: 0.7; }
  100% { transform: scale(1.5); opacity: 0; }
}

.hidden { display:none; }

video { width:100%; border-radius:10px; }

.btn {
  padding:10px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  color:white;
}
</style>

</head>

<body>

<!-- SCAN -->
<div id="scanPage">
<h2>Scan Kartu</h2>
<p id="uid">-</p>
<button class="btn" onclick="startScan()">Scan</button>
</div>

<!-- LOKASI -->
<div id="locationPage" class="hidden">
<h3>Cek Lokasi</h3>

<div class="radar" id="radar">
<div class="scan"></div>
<div class="wave"></div>
</div>

<p id="statusLokasi">Mencari lokasi...</p>
<p id="jarak"></p>
</div>

<!-- KAMERA -->
<div id="cameraPage" class="hidden">
<h3>Ambil Foto</h3>
<video id="video" autoplay playsinline></video>
<p>Arahkan wajah ke kamera</p>
<button class="btn" onclick="ambilFoto()">Manual</button>
</div>

<!-- RESULT -->
<div id="resultPage" class="hidden">
<h3>Berhasil</h3>
<p id="nama"></p>
<p id="gudang"></p>
<img id="fotoDB">
<img id="fotoSelfie">
</div>

<script>

let stream;

/* SCAN NFC */
async function startScan() {

  const ndef = new NDEFReader();
  await ndef.scan();

  ndef.onreading = (event) => {

    window.uid = event.serialNumber;
    document.getElementById("uid").innerText = window.uid;

    showPage("locationPage");
    getLocation();

  };
}

/* PINDAH PAGE */
function showPage(id) {
  document.querySelectorAll("div").forEach(d => d.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

/* LOKASI */
function getLocation() {

  navigator.geolocation.getCurrentPosition(async (pos) => {

    window.lat = pos.coords.latitude;
    window.lng = pos.coords.longitude;

    let res = await fetch(
      "https://script.google.com/macros/s/AKfycbxQYvZIxsv-KrVS2k3wKtmAtq3iOQuoz2PErPJP764YIvOiKv8lvx8IcFO44-tQc4A/exec"
      + "?uid=" + window.uid
      + "&lat=" + window.lat
      + "&lng=" + window.lng
    );

    let data = await res.json();

    document.getElementById("jarak").innerText =
      "Jarak: " + Math.round(data.jarak) + " m";

    if (data.status === "OUT_OF_RANGE") {
      document.getElementById("statusLokasi").innerText = "Diluar area";
      setTimeout(() => showPage("scanPage"), 2000);
      return;
    }

    if (data.status === "IN_RANGE") {

      window.nama = data.nama;
      window.gudang = data.gudang;
      window.fotoDB = data.fotoDB;

      document.getElementById("statusLokasi").innerText = "Dalam area";

      setTimeout(startCamera, 1000);
    }

  });
}

/* KAMERA */
async function startCamera() {

  showPage("cameraPage");

  stream = await navigator.mediaDevices.getUserMedia({ video:true });

  let video = document.getElementById("video");
  video.srcObject = stream;

  setTimeout(ambilFoto, 3000);
}

/* FOTO */
function ambilFoto() {

  let video = document.getElementById("video");

  let canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  canvas.getContext("2d").drawImage(video,0,0);

  let foto = canvas.toDataURL("image/jpeg");

  kirimData(foto);
}

/* KIRIM */
async function kirimData(foto) {

  let res = await fetch(
    "https://script.google.com/macros/s/AKfycbxQYvZIxsv-KrVS2k3wKtmAtq3iOQuoz2PErPJP764YIvOiKv8lvx8IcFO44-tQc4A/exec",
    {
      method:"POST",
      body: JSON.stringify({
        uid: window.uid,
        nama: window.nama,
        gudang: window.gudang,
        lat: window.lat,
        lng: window.lng,
        foto: foto
      })
    }
  );

  stream.getTracks().forEach(t => t.stop());

  showPage("resultPage");

  document.getElementById("nama").innerText = window.nama;
  document.getElementById("gudang").innerText = window.gudang;
  document.getElementById("fotoDB").src = window.fotoDB;
  document.getElementById("fotoSelfie").src = foto;

  setTimeout(() => showPage("scanPage"), 3000);
}

</script>

</body>
</html>
