<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi NFC</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      background: green;
      color: white;
      border: none;
      border-radius: 10px;
    }

    .box {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      white-space: pre-wrap;
      text-align: left;
    }
  </style>
</head>

<body>

<h2>ABSENSI NFC</h2>

<button onclick="scanNFC()">SCAN KARTU</button>

<div class="box">
  <p id="hasil">Menunggu scan...</p>
  <p id="server">Server: -</p>
</div>

<script>

async function scanNFC() {
  try {

    const ndef = new NDEFReader();
    await ndef.scan();

    document.getElementById("hasil").innerText = "Tempel kartu...";

    ndef.onreading = async (event) => {

      let output = "";
      let uid = "";

      for (const record of event.message.records) {

        output += "Record Type: " + record.recordType + "\n";

        const raw = new Uint8Array(record.data);
        output += "RAW: " + Array.from(raw).map(b => b.toString(16)).join(" ") + "\n";

        // decode TEXT
        if (record.recordType === "text") {
          const langLength = raw[0];
          uid = new TextDecoder("utf-8").decode(raw.slice(1 + langLength));
          output += "UID: " + uid + "\n";
        }

        output += "----------------------\n";
      }

      document.getElementById("hasil").innerText = output;

      // 🔥 AUTO KIRIM KE SERVER
      if (uid !== "") {
        try {

          let res = await fetch("https://script.google.com/macros/s/AKfycbyrlWCsEXuAFpv0qdAw7JLclCjjooQ3MT3wg3LKgT0CxWEa9mBGOw_9QF83mrR3toY/exec", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              uid: uid
            })
          });

          let data = await res.json();

          document.getElementById("server").innerText =
            "Server: " + JSON.stringify(data);

        } catch (err) {
          document.getElementById("server").innerText = "Server ERROR";
          console.log(err);
        }
      }

    };

  } catch (err) {
    alert("NFC tidak support / belum aktif");
    console.log(err);
  }
}

</script>

</body>
</html>
