<!DOCTYPE html>
<html>
<head>
  <title>ABSENSI NFC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .status {
      font-size: 20px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .red { color: red; }
    .green { color: green; }

    .loader {
      border: 6px solid #eee;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 15px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    button {
      padding: 15px;
      font-size: 18px;
      background: gray;
      color: white;
      border: none;
      border-radius: 10px;
      width: 100%;
      margin-top: 20px;
    }

    button.active {
      background: green;
    }
  </style>
</head>

<body>

<h2>ABSENSI</h2>

<div class="card">

  <div id="status" class="status red">Mencari lokasi...</div>

  <div class="loader" id="loader"></div>

  <p>Jarak: <span id="jarak">-</span></p>

  <button id="btnAbsen" disabled>ABSEN</button>

</div>

<script>

// ====== SETTING ======
const TARGET_LAT = -6.2341459;   // ganti sesuai gudang
const TARGET_LNG = 106.4997284;  // ganti sesuai gudang
const RADIUS = 50; // meter

let sudahDalamArea = false;

// ====== HITUNG JARAK ======
function hitungJarak(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI/180;
  const dLon = (lon2 - lon1) * Math.PI/180;

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1 * Math.PI/180) *
    Math.cos(lat2 * Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

// ====== TRACKING LIVE ======
function startTracking() {

  if (!navigator.geolocation) {
    alert("HP tidak support GPS");
    return;
  }

  navigator.geolocation.watchPosition(pos => {

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    const jarak = hitungJarak(lat, lng, TARGET_LAT, TARGET_LNG);

    document.getElementById("jarak").innerText =
      Math.round(jarak) + " m";

    // ====== CEK RADIUS ======
    if (jarak <= RADIUS) {

      if (!sudahDalamArea) {
        sudahDalamArea = true;

        document.getElementById("status").innerText = "Dalam Area";
        document.getElementById("status").className = "status green";

        document.getElementById("loader").style.display = "none";

        let btn = document.getElementById("btnAbsen");
        btn.disabled = false;
        btn.classList.add("active");
      }

    } else {
      document.getElementById("status").innerText = "Diluar Area";
      document.getElementById("status").className = "status red";
    }

  }, err => {
    document.getElementById("status").innerText = "Gagal ambil lokasi";
  }, {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 10000
  });
}

// START
startTracking();

</script>

</body>
</html>
